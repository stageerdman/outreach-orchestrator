    if (chat) loadCopilot(chat.id);

  es.onerror = () => {
    if (!live) return;

    setTimeout(renderHeader, 31e3);
  };
  es.addEventListener('snapshot', () => soon('snapshot', onSnapshot));
  es.addEventListener('messages', (e) => { newIds.push(...JSON.parse(e.data).ids); soon('messages', onMessages); });
  es.addEventListener('requests', () => soon('requests', loadRequests));
  es.addEventListener('personal', () => soon('personal', loadPersonal));
  es.addEventListener('connect', () => { if (xconv) soon('connect', loadConnect, 100); });

];

async function loadSettings() {
  try { settings = await api('/api/settings'); }
  catch (e) { $('#settings').innerHTML = `<p class="err">Could not load settings: ${esc(e.message)}</p>`; return; }
  renderSettings();
  if (settings.learning.running) pollLearn();
}

const settingValue = (key) => settings[key] || settings.defaults[key] || '';
function renderLearn() {
  const l = settings.learning, el = $('#learn-info'), btn = $('#learn');
  if (!el) return;
  btn.setAttribute('aria-disabled', l.running);
  btn.lastChild.textContent = l.running ? `Learning from ${l.count} messages…` : 'Learn my style';
  $('[data-setting=styleGuide]').readOnly = l.running;
  el.className = l.error ? 'err' : 'info';
  el.textContent = l.error ? `Learning failed: ${l.error}. Your guide wasn't changed.`
    : settings.styleLearnedAt ? `Learned ${fullDate(new Date(settings.styleLearnedAt))} from ${settings.styleCount} of your messages.`
    : 'Not learned yet. Press Learn my style (takes a minute or two).';
}

function renderSettings() {
  const field = ([key, label, hint, rows]) => `<fieldset class="fields">
    <div class="lrow"><label for="set-${key}">${label}</label><span class="tstatus" id="st-${key}"></span>
      ${key === 'styleGuide' ? `<button type="button" class="btn" id="learn">${icon('regen')}<span>Learn my style</span></button>`
        : `<button type="button" class="quiet" data-reset="${key}"${settings[key] ? '' : ' hidden'}>Reset to default</button>`}</div>
    <textarea class="input" id="set-${key}" data-setting="${key}" rows="${rows}">${esc(settingValue(key))}</textarea>
    ${key === 'styleGuide' ? '<p id="learn-info" role="status"></p>' : ''}<p class="info">${hint}</p></fieldset>`;
  $('#settings').innerHTML = `<h1>Settings</h1>
    <fieldset class="fields"><legend>AI</legend><div class="field"><span>Model</span><span class="filters" role="group" aria-label="Model">${settings.models
      .map((m) => `<button type="button" data-model="${m}" aria-pressed="${settings.model === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</span>
      <span class="tstatus" id="st-model"></span></div></fieldset>
    ${SETTING_TEXTS.map(field).join('')}`;
  renderLearn();
}

const settingTimers = {};
function saveSetting(key, value) {
  const status = (t, bad) => { const el = $(`#st-${key}`); if (el) { el.textContent = t; el.classList.toggle('bad', !!bad); } };
  status('Saving…');
  clearTimeout(settingTimers[key]);
  settingTimers[key] = setTimeout(async () => {
    // A prompt equal to the default is saved empty, so it follows future defaults.
    const v = value === settings.defaults[key] ? '' : value;
    try {
      settings = { ...(await api('/api/settings', { method: 'PUT', headers: JSON_HEADERS, body: JSON.stringify({ [key]: v }) })), learning: settings.learning };
      status('Saved'); setTimeout(() => status(''), 2000);
      const reset = document.querySelector(`[data-reset=${key}]`);
      if (reset) reset.hidden = !settings[key];
    } catch (e) { status(`Not saved: ${e.message}`, true); }
  }, key === 'model' ? 0 : 600);
}

async function pollLearn() {
  clearTimeout(learnTimer);
  try { settings.learning = await api('/api/settings/learn'); } catch (e) { settings.learning = { running: false, error: e.message }; }
  if (settings.learning.running) { renderLearn(); learnTimer = setTimeout(pollLearn, 2000); return; }
  const learning = settings.learning;
  settings = { ...(await api('/api/settings')), learning };
  if (section === 'settings') { renderSettings(); $('#announce').textContent = learning.error ? 'Learning failed' : 'Style guide updated'; }
}

$('#settings').addEventListener('input', (e) => {
  const key = e.target.dataset.setting;
  if (key) saveSetting(key, e.target.value);
});
$('#settings').addEventListener('click', async (e) => {
  const m = e.target.closest('[data-model]');
  if (m) {
    document.querySelectorAll('[data-model]').forEach((x) => x.setAttribute('aria-pressed', x === m));
    return saveSetting('model', m.dataset.model);
  }
  const reset = e.target.closest('[data-reset]');
  if (reset) {
    const key = reset.dataset.reset;
    $(`#set-${key}`).value = settings.defaults[key];
    saveSetting(key, settings.defaults[key]);
    $(`#set-${key}`).focus();
    return ($('#announce').textContent = 'Prompt reset to default');
  }
  const learn = e.target.closest('#learn');
  if (learn && learn.getAttribute('aria-disabled') !== 'true') {
    if (settings.styleGuide && !learn.dataset.armed) {
      learn.dataset.armed = '1'; learn.lastChild.textContent = 'Replace the guide? Click again';
      return setTimeout(() => { if (settings && section === 'settings') renderLearn(); delete learn.dataset.armed; }, 4000);
    }
    settings.learning = await api('/api/settings/learn', { method: 'POST' });
    $('#announce').textContent = 'Learning your style';
    renderLearn();
    if (settings.learning.running) learnTimer = setTimeout(pollLearn, 2000);
  }
});
addEventListener('pagehide', () => { for (const t of Object.values(settingTimers)) clearTimeout(t); });

// ---- You: the portrait of how you think (lib/mind.js), built from your own
// conversations and corrections and kept current on its own. One line per
// item, the reasoning and your quotes one click away; "Correct it" in your own
// words; does it help (a blind test); facts about the offer. Live through the
// SSE `personal` event only (no polling); what's open survives the updates.
let pers = null, persError = '', redit = null, allHeur = false, seen = null, lastBuilt = null, lastMap = null;
let qpick = { id: null, option: '', text: '' }; // the open question's draft answer
const ruleLine = (r) => `${r.when ? `When ${r.when}: ` : ''}${r.text}`; // also the Playbooks log
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
// "5m ago", "just now", "on 3 Nov": for sentences.
const since = (at) => { const a = ago(at); return timeTag(at, a === 'now' ? 'just now' : /^\d+[mhd]$/.test(a) ? `${a} ago` : `on ${a}`); };
const lc = (t) => (t ? t[0].toLowerCase() + t.slice(1) : '').replace(/\.$/, '');
const LENS = { probing: 'Questions', 'challenge-support': 'Push or support', specifics: 'Pinning down', resistance: 'Pushback',
  reframing: 'Reframing', arc: 'The usual arc', closing: 'Closing', signals: 'Reading him' };
const LABEL_EV = { said: 'you said', observed: 'you did', inferred: 'its guess' };
const HEUR_SHOWN = 5;

async function loadPersonal() {
  try { pers = await api('/api/personal'); persError = ''; } catch (e) { persError = e.message; }
  trackChanges();
  renderYBadge();
  if (section === 'personal') renderPersonal(false);
}
// The rail: how many questions wait for you.
function renderYBadge() {
  const n = openQs().length, b = $('#ybadge');
  b.hidden = !n; b.textContent = n;
  b.parentElement.setAttribute('aria-label', `You${n ? `, ${plural(n, 'question')} for you` : ''}`);
  b.title = n ? `${plural(n, 'question')} for you` : '';
}
const openQs = () => (pers?.mind.questions || []).filter((q) => q.status === 'open');

// Items new or changed since you last looked get an "updated" tag for this
// visit; after a rebuild in this session, against the portrait before it.
const itemsOf = (p) => (p ? ['models', 'heuristics', 'conversation', 'values', 'never', 'tensions'].flatMap((k) => p[k].map((x) => [x.id, JSON.stringify([x.headline, x.line, x.then, x.text, x.between])])) : []);
function trackChanges() {
  const m = pers?.mind;
  if (!m?.portrait) return;
  const now = Object.fromEntries(itemsOf(m.portrait));
  if (seen === null) { try { seen = JSON.parse(localStorage.getItem('youSeen') || 'null'); } catch { seen = null; } seen ??= now; }
  else if (lastBuilt && m.builtAt !== lastBuilt) seen = lastMap;
  lastBuilt = m.builtAt; lastMap = now;
  try { localStorage.setItem('youSeen', JSON.stringify(now)); } catch {}
}
const updated = (x) => seen && seen[x.id] !== JSON.stringify([x.headline, x.line, x.then, x.text, x.between]);

// force = false for background refreshes: never re-render under the user's hands.
function renderPersonal(force = true) {
  const el = $('#personal');
  if (!force && el.contains(document.activeElement) && document.activeElement.matches('textarea, input')) return;
  if (!pers) { el.innerHTML = persError ? `<p class="empty err">Couldn't load: ${esc(persError)}</p>` : ''; return; }
  const open = new Set([...el.querySelectorAll('details[open][data-k]')].map((d) => d.dataset.k));
  const focus = document.activeElement?.closest('#personal [data-k]')?.dataset.k;
  const inQuiz = document.activeElement?.closest('#personal .qcard') ? (document.activeElement.dataset.qopt ?? document.activeElement.id ?? '') : null;
  const m = pers.mind, p = m.portrait;
  el.innerHTML = `<h1>How you think</h1>
    <div class="meta" role="status" aria-live="polite">${renderMindStatus(m)}</div>
    ${p ? `<p class="lead">${esc(p.identity)}</p>` : ''}
    ${renderQuiz()}
    ${renderTell(m)}
    ${p ? renderPortrait(p) : ''}
    ${renderFit(p)}
    ${renderFacts()}`;
  for (const d of el.querySelectorAll('details[data-k]')) if (open.has(d.dataset.k)) d.open = true;
  if (focus) el.querySelector(`[data-k="${CSS.escape(focus)}"] > summary`)?.focus();
  // In the quiz: back where you were, or the next question's first answer.
  if (inQuiz !== null) (el.querySelector(inQuiz ? `.qcard [data-qopt="${CSS.escape(inQuiz)}"], .qcard #${CSS.escape(inQuiz)}` : '.qcard [data-qopt]')
    || el.querySelector('.qcard [data-qopt], #qtext, #qdone'))?.focus();
}

function renderMindStatus(m) {
  const btn = (label) => `<button type="button" class="quiet" data-pp="build">${label}</button>`;
  if (m.building) return `<span>${SPIN} ${esc(m.step || 'Working')}… Takes a few minutes. Keep working.</span>`;
  if (m.error) return `<span><span class="err">Couldn't update: ${esc(m.error)}.</span>${m.portrait ? ' Drafts still use the version below.' : ''}</span>${btn('Retry')}`;
  if (!m.portrait) return `<span>Not built yet. It starts on its own in a few minutes.</span>${btn('Build now')}`;
  const b = m.basis || {}, n = (k) => b[k]?.used ?? 0;
  return `<span>Learned from ${plural(n('hard') + n('replies') + n('quiet'), 'moment')} and ${plural(n('decisions'), 'draft correction')}, updated ${since(m.builtAt)}</span>${btn('Update')}`;
}

// The page's one action: correct it in your own words. Your newest words show
// at once, with where they are (updating / in since …).
function renderTell(m) {
  const notes = (m.notes || []).filter((n) => n.source !== 'answer'), waiting = notes.filter((n) => n.at > (m.builtAt || '')), done = notes.filter((n) => n.at <= (m.builtAt || ''));
  return `<section class="tell" aria-labelledby="ph-tell"><h2 class="psh" id="ph-tell">Correct it</h2>
    <p class="info">Your words outrank everything it read.</p>
    <textarea class="input" id="tell" rows="3" aria-label="Correct it in your own words" placeholder="Something wrong or missing? Say it like you'd tell a new colleague."></textarea>
    <div class="ractions"><button type="button" class="btn${openQs().length ? '' : ' primary'}" data-pp="tell" aria-keyshortcuts="Meta+Enter" title="Tell it (⌘↵)">Tell it</button>
      <span class="why">⌘↵</span><span class="err" data-err></span></div>
    ${waiting.map((n) => `<p class="pending">“${esc(n.text)}”<span class="why">${m.building ? `${SPIN} Updating with this…` : 'In the next update'}</span></p>`).join('')}
    ${done.length ? `<details data-k="notes"><summary class="link">Your corrections (${done.length})</summary><ul class="quotes">${done.slice().reverse()
      .map((n) => `<li>${esc(n.text)} <span class="why">· ${since(n.at)}</span></li>`).join('')}</ul></details>` : ''}</section>`;
}

// Questions for you: one at a time. Pick a suggested answer and/or say it in
// your words, then Answer; or Skip. The next one follows; when the set is
// done, the portrait folds your answers in.
function renderQuiz() {
  const all = pers.mind.questions || [], qs = openQs();
  if (!qs.length) return renderQuizDone(all);
  const q = qs[0], set = all.filter((x) => x.at === q.at), pos = set.indexOf(q) + 1;
  if (qpick.id !== q.id) qpick = { id: q.id, option: '', text: '' };
  return `<section aria-labelledby="ph-quiz"><h2 class="psh" id="ph-quiz">Questions for you</h2>
    <div class="qcard" data-q="${esc(q.id)}">
      ${q.case ? `<p class="qcase"><span class="why">Example</span><span lang="cs">${esc(q.case)}</span></p>` : ''}
      <p class="qask" id="qask">${esc(q.ask)}</p>
      ${q.options.length ? `<div class="qopts" role="group" aria-labelledby="qask">${q.options.map((o, i) => `<button type="button" data-qopt="${esc(o)}" aria-pressed="${qpick.option === o}" aria-keyshortcuts="${i + 1}"><span class="k" aria-hidden="true">${i + 1}</span>${esc(o)}</button>`).join('')}</div>` : ''}
      <textarea class="input" id="qtext" rows="2" aria-label="Your answer in your own words" placeholder="${q.options.length ? 'Or say it your way…' : 'Say it your way…'}">${esc(qpick.text)}</textarea>
      <div class="ractions"><button type="button" class="btn primary" data-pp="qanswer" title="Answer (⌘↵)">Answer</button><span class="why">⌘↵</span>
        <button type="button" class="quiet" data-pp="qskip">Not sure</button><span class="err" data-err></span><span class="qpos">Question ${pos} of ${set.length}</span></div>
      ${q.why ? `<p class="why qwhy">Why I ask: ${esc(q.why)}</p>` : ''}
    </div></section>`;
}
// After a set: what happened to your answers (for 12 hours, survives reloads).
function renderQuizDone(all) {
  const last = all.at(-1);
  if (!last) return '';
  const set = all.filter((x) => x.at === last.at), answered = set.filter((x) => x.status === 'answered').length;
  const closed = set.map((x) => x.answer?.at || x.closedAt).filter(Boolean).sort().at(-1);
  if (!closed || Date.now() - new Date(closed) > 12 * 36e5) return '';
  const msg = !answered ? 'No problem. I’ll ask again later.'
    : pers.mind.building ? `${SPIN} Thanks, that’s ${plural(answered, 'answer')}. Updating how I see you…`
    : pers.mind.builtAt > closed ? `Thanks, that’s ${plural(answered, 'answer')}. They’re part of how I see you now.` : `Thanks, that’s ${plural(answered, 'answer')}. They go in with the next update.`;
  return `<section aria-labelledby="ph-quiz"><h2 class="psh" id="ph-quiz">Questions for you</h2><p class="info" tabindex="-1" id="qdone">${msg}</p></section>`;
}
async function closeQ(skip) {
  const card = $('#personal .qcard'), id = card?.dataset.q;
  if (!id) return;
  qpick.text = $('#qtext').value.trim();
  if (!skip && !qpick.option && !qpick.text) { card.querySelector('[data-err]').textContent = 'Pick an answer or write one'; return $('#qtext').focus(); }
  card.querySelectorAll('button, textarea').forEach((b) => { b.disabled = true; });
  try {
    pers.mind = await api(`/api/mind/questions/${encodeURIComponent(id)}/${skip ? 'skip' : 'answer'}`,
      skip ? { method: 'POST' } : { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify({ option: qpick.option, text: qpick.text }) });
    qpick = { id: null, option: '', text: '' };
    announce(skip ? 'Skipped' : 'Answered');
    renderYBadge(); renderPersonal();
    ($('#personal .qopts button') || $('#qtext') || $('#qdone'))?.focus();
  } catch (e) {
    card.querySelectorAll('button, textarea').forEach((b) => { b.disabled = false; });
    card.querySelector('[data-err]').textContent = e.message;
  }
}
// A tap answers at once; with your own words typed, it only picks (Answer sends both).
function pickQ(option) {
  qpick.option = qpick.option === option ? '' : option;
  for (const b of $('#personal').querySelectorAll('[data-qopt]')) b.setAttribute('aria-pressed', b.dataset.qopt === qpick.option);
  if (qpick.option && !$('#qtext').value.trim()) return closeQ(false);
}

// One row: the headline; open it for the reasoning and the quotes.
const quote = (e) => `<li><q lang="cs">${esc(e.quote)}</q><span class="why">${LABEL_EV[e.label] || e.label}</span></li>`;
const quotes = (ev) => (ev?.length ? `<ul class="quotes">${ev.slice(0, 2).map(quote).join('')}${ev.length > 2
  ? `<li class="qmore"><details><summary>+${ev.length - 2} more</summary><ul class="quotes">${ev.slice(2).map(quote).join('')}</ul></details></li>` : ''}</ul>` : '');
const item = (x, head, more, lead = '') => `<li><details class="it" data-k="${esc(x.id)}"><summary>${lead}<span class="hl">${head}</span>${updated(x) ? '<span class="tag">updated</span>' : ''}</summary>
  <div class="more">${more}${quotes(x.evidence)}</div></details></li>`;
const list = (items, f, cls = '') => `<ul class="plist ${cls}">${items.map(f).join('')}</ul>`;
const sec = (id, title, body, intro = '') => `<section aria-labelledby="ph-${id}"><h2 class="psh" id="ph-${id}">${title}</h2>${intro}${body}</section>`;

function renderPortrait(p) {
  const heur = allHeur ? p.heuristics : p.heuristics.slice(0, HEUR_SHOWN);
  const out = [
    p.models?.length && sec('models', 'How I see clients', list(p.models, (x) => item(x, `<b>${esc(x.name)}</b> — ${esc(x.headline || x.line)}`,
      `${x.headline ? `<p>${esc(x.line)}</p>` : ''}<dl class="wn"><dt>When</dt><dd>${esc(x.apply)}</dd><dt>Except</dt><dd>${esc(x.limits)}</dd></dl>`))),
    p.heuristics?.length && sec('heur', 'My rules of thumb', list(heur, (x) => item(x, esc(x.headline || `${lc(x.when)} → ${lc(x.then)}`),
      `${x.headline ? `<dl class="wn"><dt>When</dt><dd>${esc(lc(x.when))}</dd><dt>I</dt><dd>${esc(lc(x.then))}</dd></dl>` : ''}${x.case ? `<p class="why">Example: ${esc(x.case)}</p>` : ''}`))
      + (p.heuristics.length > HEUR_SHOWN ? `<button type="button" class="quiet showall" data-pp="allheur">${allHeur ? 'Show fewer' : `Show all ${p.heuristics.length}`}</button>` : '')),
    (p.values?.length || p.never?.length) && sec('stand', 'What I stand for',
      (p.values?.length ? list(p.values, (x, i) => item(x, esc(x.text), '', `<span class="n">${i + 1}</span>`), 'plain') : '')
      + (p.never?.length ? `<h3 class="sub">What I never do</h3>${list(p.never, (x) => item(x, esc(x.headline || x.text), x.headline ? `<p>${esc(x.text)}</p>` : ''), 'plain')}` : '')),
    p.tensions?.length && sec('calls', 'Judgment calls', list(p.tensions, (x) => item(x, esc(x.between), `<p>${esc(x.text)}</p>`)),
      '<p class="info">Two things you care about that clash. Open one to see which wins when.</p>'),
    p.conversation?.length && `<section><details class="moredetail" data-k="moredetail"><summary>How I lead a conversation · ${p.conversation.length}</summary>
      ${list(p.conversation, (x) => item(x, `${esc(x.headline || x.text)}${x.thin ? ' <span class="why">· less sure</span>' : ''}`, x.headline ? `<p>${esc(x.text)}</p>` : '', `<span class="lens">${esc(LENS[x.lens] || x.lens)}</span>`))}</details></section>`,
  ];
  return out.filter(Boolean).join('');
}

// Does it help: a blind test on moments it never saw, honest about noise.
const pctOf = (a, n) => (n ? `${Math.round((100 * a) / n)}%` : '–');
function renderFit(p) {
  const v = pers.mind.validation, f = pers.fidelity || [], scores = pers.mind.scores || [];
  const wk = (d, i) => (i === 0 ? 'this week' : `week of ${new Date(`${d}T12:00:00Z`).toLocaleDateString('en', { day: 'numeric', month: 'short' })}`);
  const gap = v ? v.with - v.without : 0;
  const test = v ? `<p class="fitn${gap >= 5 ? ' up' : ''}">${gap >= 5 ? `${gap} points better than without it` : 'About even so far'}</p>
    <div class="mrow"><span>With</span><i style="--v:${v.with}"></i><b>${v.with}</b></div>
    <div class="mrow off"><span>Without</span><i style="--v:${v.without}"></i><b>${v.without}</b></div>
    <p class="info">Blind test ${since(v.at)} on ${plural(v.n, 'recent moment')} it never saw: it guessed what you did, a second AI scored the guesses. Gaps under 5 are noise.${scores.length > 1 ? ` Before: ${scores.slice(-6, -1).reverse().map((x) => `${x.with} vs. ${x.without}`).join(' · ')}.` : ''}</p>` : '';
  const sent = f.length ? `<p class="info">Sent unedited: ${f.slice(0, 2).map((w, i) => `${pctOf(w.asIs, w.decided)} ${wk(w.week, i)} (${w.asIs} of ${w.decided})`).join(' · ')}</p>` : '';
  const blind = p?.limits?.length ? `<details data-k="blind"><summary class="link">Blind spots (${p.limits.length})</summary><ul>${p.limits.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></details>` : '';
  return test || sent || blind ? sec('fit', 'Does it help?', `${test}${sent}${blind}`) : '';
}

// ---- facts about the offer: added and edited in place; every draft respects them
function renderFacts() {
  const facts = pers.facts.filter((r) => r.status !== 'rejected');
  const edit = redit === 'new-fact' ? renderFactEdit({ id: '', text: '' }) : '';
  const rows = facts.map((r) => (redit === r.id ? renderFactEdit(r) : `<li class="rule" data-rule="${esc(r.id)}" id="rule-${esc(r.id)}">
      <div class="rtext row" tabindex="0" role="button" data-pp="edit" aria-label="Edit: ${esc(r.text)}">${esc(r.text)}</div></li>`)).join('');
  return `<section aria-labelledby="ph-facts"><div class="lrow"><h2 class="psh" id="ph-facts">Facts about the offer</h2>
    <button type="button" class="quiet" data-pp="new-fact" title="Add a fact (⌘N)">+ Add a fact</button></div>
    ${edit || rows ? `<ul class="plist">${edit}${rows}</ul>` : `<p class="info">What every draft must get right, e.g. “The free consultation is free only for a limited time.”</p>`}</section>`;
}
const renderFactEdit = (r) => `<li class="rule edit" data-rule="${esc(r.id)}">
  <label class="why" for="re-text">Fact</label>
  <textarea class="input" id="re-text" data-rf="text" rows="2">${esc(r.text)}</textarea>
  <div class="ractions"><button type="button" class="btn sm primary" data-pp="save" title="Save (⌘↵)">Save</button><button type="button" class="quiet" data-pp="cancel-edit">Cancel</button>
    <span class="err" data-err></span>${r.id ? '<span class="cancel"><button type="button" class="quiet danger" data-pp="delete">Delete</button></span>' : ''}</div></li>`;
function editRule(id) {
  redit = id === 'new-rule' ? 'new-fact' : id; renderPersonal();
  document.querySelector('#personal .rule.edit textarea')?.focus();
}
async function factCall(method, id, body, msg, card) {
  try {
    const out = await api(`/api/rules${id ? `/${encodeURIComponent(id)}` : ''}`, { method, ...(body && { headers: JSON_HEADERS, body: JSON.stringify(body) }) });
    redit = null; announce(msg);
    await loadPersonal(); renderPersonal();
    (document.querySelector(`#rule-${CSS.escape(out.ops?.[0]?.id ?? id ?? '')} .rtext`) || $('[data-pp=new-fact]'))?.focus();
  } catch (e) { const err = card?.querySelector('[data-err]'); if (err) err.textContent = e.message; else announce(e.message); }
}
async function saveFact(card) {
  const text = card.querySelector('[data-rf=text]').value.trim(), id = card.dataset.rule;
  if (!text) { card.querySelector('[data-err]').textContent = 'Write the fact first'; return card.querySelector('[data-rf=text]').focus(); }

// Copies HTML (with a plain-text fallback) or just text. The copy event runs
// inside the click, which WebKit allows; the async clipboard API is the backup.
async function copyRich(text, html) {
  const onCopy = (e) => {
    e.clipboardData.setData('text/plain', text);
    if (html) e.clipboardData.setData('text/html', html);
    e.preventDefault();
  };
  document.addEventListener('copy', onCopy);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.removeEventListener('copy', onCopy);
  if (ok) return true;
  try {
    const item = { 'text/plain': new Blob([text], { type: 'text/plain' }) };
    if (html) item['text/html'] = new Blob([html], { type: 'text/html' });
    await navigator.clipboard.write([new ClipboardItem(item)]);
    return true;
  } catch { return false; }
}

let linkRange = null;
function format(cmd) {
  const body = $('#tbody');
  if (cmd === 'link') {
    const sel = getSelection();
    linkRange = sel.rangeCount && body.contains(sel.anchorNode) ? sel.getRangeAt(0) : null;
    const input = $('#tlink');
    input.hidden = false; input.value = ''; input.focus();
    return;
  }
  body.focus();
  if (cmd === 'h2') {
    const inH2 = getSelection().anchorNode?.parentElement?.closest('h2');
    document.execCommand('formatBlock', false, inH2 ? 'div' : 'h2');
  } else document.execCommand(cmd);
}
function applyLink(url) {
  const body = $('#tbody'), input = $('#tlink');
  input.hidden = true;
  body.focus();
  if (!url) return;
  if (linkRange) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(linkRange); }
  if (linkRange && !linkRange.collapsed) document.execCommand('createLink', false, url);
  else document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`);
}

const TRIGGER = {
  build: () => 'Built from your templates, reply rates and style',
  batch: (t) => `From your last ${t.count} decision${t.count === 1 ? '' : 's'} on drafts${t.notes ? ` (${t.notes} with a note)` : ''}${t.answers ? `, ${t.answers} answer${t.answers === 1 ? '' : 's'}` : ''}`,
  approve: (t) => `After you sent the draft for ${t.personName}`,

  answer: () => 'Your answer to a question',
  migrate: () => 'Playbook lessons became your rules',
  user: () => 'Your edit',
  copilot: (t) => `In the AI chat about ${t.personName}`,
};

function stepDiff(before, after) {
  if (!before) return [`New playbook with ${after.steps.length} steps`];
  if (!after) return ['Removed'];
  const out = [], byId = new Map(before.steps.map((s, i) => [s.id, { s, i }]));
  if (before.goal !== after.goal) out.push(`Goal: “${after.goal}”`);
  after.steps.forEach((s, i) => {
    const b = byId.get(s.id);
    if (!b) return out.push(`Step ${i + 1} added: ${PB_CHANNELS[s.channel]}, after ${s.waitDays} d — ${s.ask}`);
    const d = [];
    if (b.i !== i) d.push(`moved from ${b.i + 1}`);
    if (b.s.channel !== s.channel) d.push(`${PB_CHANNELS[b.s.channel]} → ${PB_CHANNELS[s.channel]}`);
    if (b.s.waitDays !== s.waitDays) d.push(`wait ${b.s.waitDays} → ${s.waitDays} d`);
    if (b.s.ask !== s.ask) d.push(`ask: “${s.ask}”`);
    if (b.s.why !== s.why) d.push(`why: “${s.why}”`);
    const added = s.templateIds.filter((x) => !b.s.templateIds.includes(x)), gone = b.s.templateIds.filter((x) => !s.templateIds.includes(x));
    if (added.length) d.push(`+ ${added.map((x) => `“${tplById(x)?.name || x}”`).join(', ')}`);
    if (gone.length) d.push(`− ${gone.map((x) => `“${tplById(x)?.name || x}”`).join(', ')}`);
    if (d.length) out.push(`Step ${i + 1}: ${d.join('; ')}`);
  });
  const ids = new Set(after.steps.map((s) => s.id));
  for (const s of before.steps) if (!ids.has(s.id)) out.push(`Step removed: ${s.ask}`);
  const rIds = new Set(before.responses.map((r) => r.id));
  for (const r of after.responses) if (!rIds.has(r.id)) out.push(`New reply branch: when ${r.when}`);
  for (const r of before.responses) if (!after.responses.some((x) => x.id === r.id)) out.push(`Reply branch removed: ${r.when}`);
  for (const l of after.lessons) if (!before.lessons.includes(l)) out.push(`Lesson: ${l}`);
  for (const l of before.lessons) if (!after.lessons.includes(l)) out.push(`Lesson removed: ${l}`);
  return out.length ? out : ['Small wording changes'];
}

const RULE_STATUS = { active: 'now one of yours', testing: 'back to testing', rejected: 'rejected' };
function renderOp(o) {
  if (o.op === 'setRule' || o.op === 'deleteRule') {
    const r = o.after || o.before, what = r.kind === 'fact' ? 'Fact' : 'Rule';
    const label = !o.after ? `${what} removed` : !o.before ? `New ${what.toLowerCase()}` : o.before.status !== o.after.status ? `${what} ${RULE_STATUS[o.after.status]}` : `${what} changed`;
    const changed = o.before && o.after && ruleLine(o.before) !== ruleLine(o.after);
    return `<li>${label}: ${esc(ruleLine(r))}${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
      ${changed ? `<details><summary>Show before</summary><p class="brief">${esc(ruleLine(o.before))}</p></details>` : ''}</li>`;
  }
  if (o.op === 'setStyle') {
    return `<li>Style guide changed${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
      <details><summary>Show what changed</summary>${styleDiff(o.before, o.after)}</details></li>`;
  }
  if (o.op === 'setTemplate') {
    const name = o.after?.name || o.before?.name || 'Untitled';
    const text = (t) => (t ? htmlToText(t.bodyHtml) : '');
    return `<li>${o.before ? 'Template changed' : 'New template'}: <button type="button" class="link" data-tpl="${esc(o.id)}">${esc(name)}</button>
      ${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
      <details><summary>${o.before ? 'Show text before / after' : 'Show text'}</summary>
        ${o.before ? `<p class="why">Before</p><p class="brief">${esc(text(o.before))}</p><p class="why">After</p>` : ''}<p class="brief">${esc(text(o.after))}</p></details></li>`;
  }
  const p = o.after || o.before;
  const lines = stepDiff(o.before, o.after);
  return `<li>${o.op === 'deletePlaybook' ? 'Removed playbook' : o.before ? 'Playbook' : 'New playbook'}: <button type="button" class="link" data-pid="${esc(o.id)}">${esc(p.name)}</button>
    ${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
    ${o.before && o.after ? `<details><summary>${lines.length} change${lines.length === 1 ? '' : 's'}</summary><ul class="ops">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></details>` : ''}</li>`;
}

// The changed lines of the style guide (lines removed, then added), or the whole text when it's new.
function styleDiff(before, after) {
  const a = (before || '').split('\n'), b = after.split('\n'), had = new Set(a), has = new Set(b);
  const gone = a.filter((l) => l.trim() && !has.has(l)), added = b.filter((l) => l.trim() && !had.has(l));
  if (!before?.trim()) return `<p class="brief">${esc(after)}</p>`;
  return (gone.length ? `<p class="why">Before</p><p class="brief">${esc(gone.join('\n'))}</p>` : '')
    + (added.length ? `<p class="why">After</p><p class="brief">${esc(added.join('\n'))}</p>` : '');
}

function renderChange(c) {
  const t = c.trigger;
  return `<li class="card past${c.undone ? ' undone' : ''}" id="ch-${esc(c.id)}" tabindex="-1">
    <h3><span class="name">${esc(c.summary || 'Changes')}</span>${timeTag(c.at, ago(c.at))}</h3>
    <p class="task">${esc((TRIGGER[t.kind] || TRIGGER.user)(t))}</p>
    ${t.note ? `<p class="note"><b>Your note:</b> ${esc(t.note)}</p>` : ''}
    <ul class="ops">${c.ops.map(renderOp).join('')}</ul>
    <div class="ractions"><span class="cancel">${c.undone ? '<span class="why">Undone</span>'
      : `<span class="err" data-err></span><button type="button" class="btn sm" data-undo="${esc(c.id)}" aria-label="Undo: ${esc(c.summary)}">${icon('recover')}Undo</button>`}</span></div></li>`;
}

// What I learned: per learning run, what happened to every note and edit
// (changed, already a rule, kept for this chat…), and the Copilot's changes;
// runs that changed nothing from plain sends and cancels get no entry. All
// changes (also your own edits) stay below, each undoable.
const OUTCOME = { changed: 'Changed', style: 'Style guide', already: 'Already a rule', situational: 'Kept for this chat only', unanswered: 'Not accounted for' };
const changeOf = (id) => id && pb.changes.find((c) => c.id === id);
function learnFeed() {
  const runs = (pb?.coach.log || []).filter((r) => r.handled.length || r.changeId).map((run) => ({ at: run.at, run }));
  const cop = (pb?.changes || []).filter((c) => c.trigger.kind === 'copilot').map((change) => ({ at: change.at, change }));
  return [...runs, ...cop].sort((a, b) => b.at.localeCompare(a.at));
}
const renderChangeTools = (c) => !c ? '' : `<details class="xsteps" data-k="sc-${esc(c.id)}"><summary>Show change</summary><ul class="ops">${c.ops.map(renderOp).join('')}</ul></details>
  <div class="ractions"><span class="cancel">${c.undone ? '<span class="why">Undone</span>' : `<span class="err" data-err></span><button type="button" class="btn sm" data-undo="${esc(c.id)}" aria-label="Undo: ${esc(c.summary)}">${icon('recover')}Undo${c.ops.length > 1 ? ` (${c.ops.length} changes)` : ''}</button>`}</span></div>`;
function renderHandled(h, run) {
  const said = h.note ? `<q>${esc(h.note)}</q>` : h.edited ? 'your edit' : 'your decision';
  const general = h.outcome !== 'situational' ? '' : h.generalizedBy ? ' · <span class="why">sent back as a rule</span>'
    : ` · <button type="button" class="link" data-general="${esc(run.id)}" data-entry="${esc(h.id)}">Make it the rule</button>`;
  return `<li><p class="note">${h.personName ? `<b>${esc(h.personName)}</b> · ` : ''}${said}</p>
    <p class="why">→ <b>${OUTCOME[h.outcome] || h.outcome}</b>${h.what ? ` · ${esc(h.what)}` : ''}${general}</p></li>`;
}
function renderRun({ run, change }) {
  if (change) {
    return `<li class="card past" id="lr-${esc(change.id)}"><h3><span class="name">Copilot · ${esc(change.trigger.personName || '')}</span>${timeTag(change.at, ago(change.at))}</h3>
      <p class="note">${esc(change.summary)}</p>${renderChangeTools(change)}</li>`;
  }
  const h = run.handled, one = h.length === 1 && h[0];
  const title = run.trigger === 'general' ? 'Made it the rule' : one ? `From your ${one.note ? 'note' : 'edit'}${one.personName ? ` on ${one.personName}` : ''}` : `From ${plural(run.count, 'decision')}`;
  return `<li class="card past" id="lr-${esc(run.id)}"><h3><span class="name">${esc(title)}</span>${timeTag(run.at, ago(run.at))}</h3>
    ${h.length ? `<ul class="lessons">${h.map((x) => renderHandled(x, run)).join('')}</ul>` : `<p class="note">${esc(run.summary || 'Changes')}</p>`}
    ${renderChangeTools(changeOf(run.changeId))}</li>`;
}
function renderLearned() {
  const c = pb.coach, feed = learnFeed(), shown = pb.changes.slice(0, changesShown), left = pb.changes.length - shown.length;
  const state = c.learning || c.running ? `<p class="working">${SPIN} Learning from your notes…</p>`
    : c.quietAt ? `<p class="info">Your newest note or edit is learned at ${timeTag(c.quietAt, hhmm(c.quietAt))}.</p>` : '';
  return `<h1>What I learned</h1>${state}
    ${feed.length ? `<ul class="changes">${feed.map(renderRun).join('')}</ul>`
      : '<p class="info">Nothing yet. When you correct a draft (a note, an edit, or in the AI chat), what I did with it shows here.</p>'}
    ${pb.changes.length ? `<details class="moredetail" data-k="all"><summary>All changes (${pb.changes.length})</summary>
      <ul class="changes">${shown.map(renderChange).join('')}</ul>
      ${left ? `<button type="button" class="link" data-pact="more-changes">Show ${Math.min(left, 20)} more (${left} left)</button>` : ''}</details>` : ''}`;
}

// Which list a field or chip belongs to: s3 = step 3, r1 = reply 1.
const partOf = (p, where) => (where[0] === 's' ? p.steps : p.responses)[Number(where.slice(1))];

$('#view-playbooks').addEventListener('click', async (e) => {
  const row = e.target.closest('.trow');
  if (row) {
    psel = row.dataset.pid; ppane = 'editor'; changesShown = 20;

    document.querySelector(`#plist .trow[data-pid="${CSS.escape(psel)}"]`)?.focus();
    return;
  }
  const tp = e.target.closest('[data-tpl]');
  if (tp) return openTemplate(tp.dataset.tpl);
  const pid = e.target.closest('#peditor [data-pid]');
  if (pid) { psel = pid.dataset.pid; renderPList(); renderPEditor(); return; }
  const gen = e.target.closest('[data-general]');
  if (gen) {
    if (gen.getAttribute('aria-disabled') === 'true') return;
    gen.setAttribute('aria-disabled', 'true'); gen.textContent = 'Learning it as a rule…';
    try { pb.coach = await api(`/api/playbooks/learnlog/${enc(gen.dataset.general)}/${enc(gen.dataset.entry)}/general`, { method: 'POST' }); announce('Learning it as a rule'); }
    catch (er) { gen.removeAttribute('aria-disabled'); gen.textContent = 'Make it the rule'; announce(er.message); }
    return;
  }
  const undo = e.target.closest('[data-undo]');
  if (undo) {
    if (undo.getAttribute('aria-disabled') === 'true') return;
    undo.setAttribute('aria-disabled', 'true'); undo.lastChild.textContent = 'Undoing…';
    try {
      const c = await api(`/api/playbooks/changes/${encodeURIComponent(undo.dataset.undo)}/undo`, { method: 'POST' });
      $('#announce').textContent = `Undid: ${c.summary}`;
      tpls = null; await loadTemplates(); await loadPlaybooks();
      document.getElementById(`ch-${c.id}`)?.focus();
    } catch (er) {
      undo.removeAttribute('aria-disabled'); undo.lastChild.textContent = 'Undo';
      const err = undo.parentElement.querySelector('[data-err]');
      if (err) err.textContent = er.message;
      $('#announce').textContent = er.message;
    }
    return;
  }
  const p = curPb();
  const act = e.target.closest('[data-pact]')?.dataset.pact;
  if (act === 'back') { ppane = 'list'; $('#psplit').dataset.pane = 'list'; return document.querySelector('#plist .trow[aria-current]')?.focus(); }
  if (act === 'rebuild') { rebuildAsk = true; return renderPList(); }
  if (act === 'build-no') { rebuildAsk = false; return renderPList(); }
  if (act === 'build') {
    rebuildAsk = false;
    try { pb.coach = await api('/api/playbooks/build', { method: 'POST' }); $('#announce').textContent = 'Building playbooks. This takes a few minutes.'; }
    catch (er) { $('#announce').textContent = `Could not start: ${er.message}`; }
    renderPList(); renderPEditor();

// N nodes on a circle: 3 → top, lower right, lower left; an even N starts half a step over.
const ORBIT = 38;
function renderMap() {
  const n = conns.length, step = 360 / Math.max(n, 1), start = -90 + (n % 2 ? 0 : step / 2);
  const at = conns.map((_, i) => { const a = (start + i * step) * Math.PI / 180; return [Math.cos(a), Math.sin(a)]; });
  const live = conns.filter((c) => c.state === 'live').length, bad = conns.filter((c) => c.state === 'error').length;
  // One line per direction the information goes: in = node → middle (the pulse runs
  // inward), out = middle → node; both = two lines side by side, GAP apart.
  const GAP = 4;
  const line = (c, [x, y], i) => {
    const r0 = 82, r1 = ORBIT * 6 - 30 - Math.max(0, -y) * 85;
    const dirs = c.flow === 'both' ? [['in', -GAP], ['out', GAP]] : [[c.flow === 'out' ? 'out' : 'in', 0]];
    return dirs.map(([d, o], j) => {
      const ox = -y * o, oy = x * o, [a, b] = d === 'out' ? [r0, r1] : [r1, r0];
      const p = `x1="${300 + x * a + ox}" y1="${300 + y * a + oy}" x2="${300 + x * b + ox}" y2="${300 + y * b + oy}"`;
      return `<line data-k="${esc(c.id)}" data-state="${c.state}" ${p}/>${c.state === 'live' ? `<line class="pulse" ${p} style="animation-delay: ${(i * .45 + j * 1.4).toFixed(2)}s"/>` : ''}`;
    }).join('');
  };
  $('#xmap').innerHTML = `<h1 class="sr-only">Connections</h1>
    <div class="cstage">
      <svg class="clines" viewBox="0 0 600 600" aria-hidden="true">${conns.map((c, i) => line(c, at[i], i)).join('')}</svg>
      <button type="button" class="reactor" id="reactor" aria-label="Orchestrator"></button>
      ${conns.map((c, i) => `<button type="button" class="cnode" data-k="${esc(c.id)}" data-state="${c.state}"
          style="--x: ${(50 + at[i][0] * ORBIT).toFixed(2)}%; --y: ${(50 + at[i][1] * ORBIT).toFixed(2)}%"
          title="${esc(c.what)}" aria-label="${esc(`${c.name}: ${c.what}. ${({ in: 'Reads from it', out: 'Sends to it', both: 'Reads and sends' })[c.flow] ?? ''}. ${c.state === 'live' ? 'Connected' : c.state === 'off' ? 'Not set up' : 'Not working'}, ${c.detail}`)}">
          <span class="ring">${xicon(c.id)}</span><span class="nm">${esc(c.name)}</span><span class="dt">${esc(c.detail)}</span></button>`).join('')}
    </div>
    <p class="xstat" id="xstat"></p>
    <button type="button" class="xadd" id="xadd">${PLUS}${xconv?.items.length ? 'Continue setup' : 'Add connection'}</button>`;
  $('#xmap').dataset.summary = bad ? `${bad} need${bad > 1 ? '' : 's'} attention` : live === conns.length ? `All ${live} connections live` : `${live} of ${conns.length} connections live`;
  renderReactor();
}

  if (!r.innerHTML) r.innerHTML = REACTOR;

// Minimal Markdown for the AI's replies: paragraphs, lists, `code`, **bold**, links.
function xmd(s) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.split(/\n{2,}/).map((b) => {
    const ls = b.split('\n');
    if (ls.every((l) => /^\s*[-*] /.test(l))) return `<ul>${ls.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('')}</ul>`;
    if (ls.every((l) => /^\s*\d+[.)] /.test(l))) return `<ol>${ls.map((l) => `<li>${inline(l.replace(/^\s*\d+[.)] /, ''))}</li>`).join('')}</ol>`;
    return `<p>${ls.map(inline).join('<br>')}</p>`;
  }).join('');
}
const SECRET = /\[\[secret ([A-Z][A-Z0-9_]*):?\s*([^\]]*)\]\]/g, SAVED = /^\[([A-Z][A-Z0-9_]*) saved to \.env\]$/;
const pretty = (name) => name.toLowerCase().split('_').map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
const clock = (ms) => `${Math.floor(ms / 6e4)}:${String(Math.floor(ms / 1e3) % 60).padStart(2, '0')}`;

function renderXThread() {
  const t = $('#xthread');
  if (!t || !xconv) return;
  const bottom = t.scrollHeight - t.scrollTop - t.clientHeight < 40;
  const open = new Set([...t.querySelectorAll('details[open]')].map((d) => d.dataset.k));
  const items = xconv.items, saved = new Set(items.map((i) => i.kind === 'user' && i.text.match(SAVED)?.[1]).filter(Boolean));
  const out = [];
  if (!items.length) out.push(`<li><div class="msg"><p>Tell me what you'd like Outreach to connect to, and I'll set it up. I may ask a few questions along the way.</p></div></li>
    <li><div class="xstarters">${XSTARTERS.map((s) => `<button type="button" data-starter>${esc(s)}</button>`).join('')}</div></li>`);
  let steps = [];
  const flush = (live) => {
    if (!steps.length) return;
    const last = steps.at(-1);
    if (live) out.push(`<li><p class="xlive">${SPIN}<span>${esc(last.text)}</span><span id="xclock"></span></p></li>`);
    else out.push(`<li><details class="xsteps" data-k="${last.id}"${open.has(last.id) ? ' open' : ''}><summary>${steps.length} step${steps.length > 1 ? 's' : ''}</summary>
      <ul>${steps.map((s) => `<li title="${esc(s.detail || '')}">${esc(s.text)}</li>`).join('')}</ul></details></li>`);
    steps = [];
  };
  const lastUser = items.findLast((i) => i.kind === 'user' && !SAVED.test(i.text));
  items.forEach((it, i) => {
    if (it.kind === 'tool') return steps.push(it);
    flush(false);
    if (it.kind === 'user') {
      const s = SAVED.test(it.text);
      if (!s) out.push(`<li class="me"><div class="msg">${esc(it.text)}</div></li>`); // a saved secret shows on its card
    } else if (it.kind === 'ai') {
      const secrets = [...it.text.matchAll(SECRET)], text = it.text.replace(SECRET, '').trim();
      out.push(`<li><div class="msg">${xmd(text)}</div></li>`);
      for (const [, name, what] of secrets) out.push(saved.has(name) ? `<li><p class="info">✓ ${esc(pretty(name))} saved</p></li>`
        : `<li><form class="xsecret" data-secret="${esc(name)}"><b>${esc(pretty(name))}</b>${what ? `<span class="info">${esc(what)}</span>` : ''}
          <div class="xrow"><input class="input" type="password" autocomplete="off" placeholder="Paste key" aria-label="${esc(pretty(name))}" required><button type="button" class="btn sm" data-xact="show">Show</button>
          <button type="submit" class="btn primary sm">Save securely</button></div>
          <span class="info">Stored only in .env on this Mac. The AI never sees it.</span></form></li>`);
    } else if (it.kind === 'error') {
      out.push(`<li><div class="msg bad"><p>${/not found|CLAUDE_BIN|not logged in|login/i.test(it.text) ? "Claude Code isn't available on this Mac, or isn't logged in." : 'Something went wrong and I stopped.'}</p>
        <p class="info">${esc(it.text)}</p>${lastUser && i === items.length - 1 ? '<div class="xdone"><button type="button" class="btn sm" data-xact="retry">Try again</button></div>' : ''}</div></li>`);
    } else if (it.kind === 'note') out.push(`<li><p class="info center">Stopped. Nothing after this point was done.</p></li>`);
  });
  if (xconv.running && !steps.length) steps.push({ id: 'think', text: 'Thinking…' });
  flush(xconv.running);
  if (xconv.running) out.push(`<li><p class="info" id="xslow" hidden>Bigger changes can take a few minutes. You can leave this open or close it.</p></li>`);
  t.innerHTML = `<ul class="msgs">${out.join('')}</ul>`;
  if (bottom || xconv.running) t.scrollTop = t.scrollHeight;
  clearInterval(xtick);
  if (xconv.running) { tickX(); xtick = setInterval(tickX, 1000); }
}
// Elapsed time since the user's message, only once it's slow.

const LOOKS_SECRET = /\b(sk-[\w-]{16,}|AIza[\w-]{20,}|gh[pousr]_\w{20,}|xox[abp]-[\w-]{10,}|ya29\.[\w-]{20,})|\b(?=[\w-]*\d)(?=[\w-]*[A-Za-z])[\w-]{32,}\b|\b(password|heslo)\s*[:=]/i;

async function sendX(text = $('#xtext').value, force = false) {

  catch (e) { $('#xtext').value = text; grow($('#xtext')); $('#xhint').textContent = e.message; return; }

}
async function restartApp() {
  const t = $('#xthread');
  t.querySelector('.msgs').insertAdjacentHTML('beforeend', '<li><p class="xlive">' + SPIN + '<span>Restarting… Your messages and drafts stay.</span></p></li>');
  t.scrollTop = t.scrollHeight;
  try { await api('/api/restart', { method: 'POST' }); } catch {}
  await new Promise((r) => setTimeout(r, 1500));
  for (let i = 0; i < 120; i++) {
    try { await api('/api/status'); return location.reload(); } catch { await new Promise((r) => setTimeout(r, 500)); }
  }
  $('#xhint').textContent = 'Outreach didn’t come back. Quit it (⌘Q) and open it again.';
}
$('#xchat').addEventListener('click', async (e) => {
  const s = e.target.closest('[data-starter]');
  if (s) { const ta = $('#xtext'); ta.value = s.textContent; grow(ta); saveXDraft(); ta.focus(); return; }
  if (e.target.closest('#xsend')) {
    if (xconv?.running) { try { await api('/api/connect/stop', { method: 'POST' }); } catch {} return; }
    return sendX();
  }
  const a = e.target.closest('[data-xact]')?.dataset.xact;
  if (a === 'close') { xopen = false; renderConnections(); $('#xadd')?.focus(); }
  if (a === 'back') { xpane = 'map'; renderConnections(); }
  if (a === 'anyway') sendX(undefined, true);
  if (a === 'retry') sendX(xconv.items.findLast((i) => i.kind === 'user' && !SAVED.test(i.text)).text, true);
  if (a === 'restart') restartApp();
  if (a === 'show') { const inp = e.target.closest('form').querySelector('input'); inp.type = inp.type === 'password' ? 'text' : 'password'; e.target.textContent = inp.type === 'password' ? 'Show' : 'Hide'; }
  if (a === 'new') {
    const b = e.target.closest('button');
    if (b.dataset.sure) { try { xconv = await api('/api/connect/reset', { method: 'POST' }); } catch {} renderXThread(); renderXComposer(); renderMap(); $('#xtext').focus(); }
    else { b.dataset.sure = '1'; b.textContent = 'Start over?'; b.title = 'This conversation will be cleared'; setTimeout(() => { delete b.dataset.sure; b.textContent = 'New'; }, 4000); }
  }
});
$('#xchat').addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-secret]');
  if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), btn = f.querySelector('[type=submit]');
  btn.disabled = true;
  try { await api('/api/connect/secret', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: f.dataset.secret, value: inp.value }) }); inp.value = ''; }
  catch (err) { btn.disabled = false; f.insertAdjacentHTML('beforeend', `<span class="xwarn">${esc(err.message)}</span>`); }
});
$('#xchat').addEventListener('input', (e) => { if (e.target.id === 'xtext') { grow(e.target); saveXDraft(); $('#xwarn').hidden = true; } });
$('#xchat').addEventListener('keydown', (e) => {
  if (e.target.id !== 'xtext' || e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault(); sendX();
});

// First load: the last snapshot (the server refreshes on start), then live updates.
(async () => {
  const saved = (() => { try { return localStorage.getItem('section'); } catch { return null; } })();
  showSection([location.hash.slice(1), saved].find((x) => SECTIONS.includes(x)) || 'messages');
  connectEvents();
  try { sources = await api('/api/status'); } catch {}
  loadRequests(); loadPlaybooks(); loadPersonal(); loadChats();
  await checkSync();
  if (!sync.at && !sync.running) startRefresh();
  await loadPeople();
})();
</script>
