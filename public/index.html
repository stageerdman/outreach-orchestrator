<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6a65; --line: #e6e5e0;
    --accent: #2f5bd3; --email: #2f5bd3; --wa: #1f7f50; --me: #eef2fd; --sel: #eef2fd; --err: #b3261e;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --fs-sm: 12px; --fs: 14px; --fs-lg: 16px; --radius: 6px; --width: 860px; --gh: 32px;
    --rail: 72px; --list-w: 280px; --icon: 20px; --hit: 28px; --badge: 16px;
    /* Pipeline stage colours, top stage first (each ≥4.5:1 on bg, panel and sel) */
    --st-1: #1a7a45; --st-2: #0e7480; --st-3: #8a6a00; --st-4: #b8461b; --st-5: #1f6aa5;
    --st-6: #5a52c4; --st-7: #8b47ad; --st-8: #776c60; --st-9: #646c78;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a29c; --line: #33322f;
      --accent: #7b9cf2; --email: #7b9cf2; --wa: #4cc28a; --me: #252c40; --sel: #252c40; --err: #ff8a80;
      --st-1: #5cc98f; --st-2: #45bccb; --st-3: #d9b440; --st-4: #ff8a5c; --st-5: #5fb0ea;
      --st-6: #a39af2; --st-7: #cf92e8; --st-8: #ab9f92; --st-9: #959ca8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: var(--fs)/1.45 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
    height: 100vh; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
  [hidden] { display: none !important; }
  .view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Section rail: one link per section */
  .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s1); padding: var(--s2) 0; }
  .rail a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--s2) var(--s1);
    color: var(--muted); text-decoration: none; font-size: var(--fs-sm); }
  .rail a:hover { background: var(--sel); color: var(--text); }
  .rail a[aria-current] { color: var(--accent); background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .rail a:focus-visible { outline-offset: -2px; }
  .rail svg { width: var(--icon); height: var(--icon); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { width: 100%; max-width: var(--width); margin: 0 auto; }

  /* Header: title, last update, refresh, search, source status */
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: var(--s3) var(--s4); }
  .bar { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
  h1 { font-size: var(--fs-lg); margin: 0; flex: 1; }
  #updated { color: var(--muted); font-size: var(--fs-sm); }
  #refresh { font: inherit; padding: var(--s1) var(--s3); border: 1px solid var(--accent); border-radius: var(--radius);
    background: var(--accent); color: var(--panel); cursor: pointer; min-width: 9em; font-variant-numeric: tabular-nums; }
  #refresh[aria-disabled=true] { background: var(--panel); color: var(--accent); cursor: progress; }
  input[type=search] { width: 100%; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--text); font: inherit; }
  .status { margin-top: var(--s2); font-size: var(--fs-sm); color: var(--muted); display: flex; gap: var(--s3); flex-wrap: wrap; }
  .status .bad { color: var(--err); max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: var(--s1); border: 1px solid var(--muted); }
  .dot.on { background: var(--wa); border-color: var(--wa); }
  .dot.bad { background: var(--err); border-color: var(--err); }

  /* Task feed: groups per pipeline stage, one row per person, one open at a time */
  main { flex: 1; overflow-y: auto; min-height: 0; }
  .group + .group { margin-top: var(--s1); }
  .group h2 { position: sticky; top: 0; z-index: 2; margin: 0; height: var(--gh); padding: 0 var(--s2) 0 var(--s4); display: flex; align-items: center; gap: var(--s2);
    background: var(--bg); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .group h2 .over { color: var(--err); }
  .gt { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--s2); flex: 1; min-width: 0; height: 100%; cursor: pointer; }
  .gt:hover .label { color: var(--text); }
  .gt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { transition: transform .15s; } .gt[aria-expanded=true] .chev { transform: rotate(90deg); }
  .sd { width: 8px; height: 8px; border-radius: 50%; background: var(--st); flex: none; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .rows { list-style: none; margin: 0; padding: 0; background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .head { position: relative; padding: var(--s3) calc(var(--s4) + var(--hit) + var(--s2)) var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--panel); scroll-margin-top: var(--gh); }
  .head:hover { background: var(--sel); }
  .head.open { position: sticky; top: var(--gh); z-index: 1; background: var(--sel); box-shadow: inset 3px 0 var(--st, var(--accent)); }
  /* The row button covers the whole head (click anywhere); copy buttons sit above it. */
  .row { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; gap: var(--s3); cursor: pointer; }
  .row::after { content: ""; position: absolute; inset: 0; }
  .row:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
  .name { font-weight: 600; }
  .due { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
  .due.over { color: var(--err); font-weight: 600; }
  .contact, .task { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task b { color: var(--text); font-weight: 600; }
  .copy { all: unset; position: relative; z-index: 1; color: var(--text); cursor: copy; border-radius: var(--radius); }
  .copy:hover { color: var(--accent); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .err { color: var(--err); font-size: var(--fs-sm); margin: 0; }
  .empty { color: var(--muted); padding: var(--s5); text-align: center; margin: 0; }
  .count { color: var(--muted); font-size: var(--fs-sm); padding: var(--s2) var(--s4); margin: 0; }

  /* Expanded timeline */
  .timeline { padding: var(--s4) var(--s4) var(--s5); border-bottom: 1px solid var(--line); background: var(--bg);
    display: flex; flex-direction: column; gap: var(--s2); }
  .timeline .empty { padding: var(--s3); }
  .info { color: var(--muted); font-size: var(--fs-sm); margin: 0; }
  .filters { display: flex; gap: var(--s1); }
  .filters button { font: inherit; font-size: var(--fs-sm); padding: 2px var(--s3); border-radius: 99px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  .filters button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .msgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
  .day { color: var(--muted); font-size: var(--fs-sm); font-weight: 400; margin: var(--s2) 0 0; }
  .note { margin: 0; font-size: var(--fs-sm); white-space: pre-wrap; overflow-wrap: anywhere; }
  .note b { font-weight: 600; }
  .msg { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--email); border-radius: var(--radius);
    padding: var(--s2) var(--s3); max-width: 85%; }
  .msg.whatsapp { border-left-color: var(--wa); }
  .msgs > li { display: flex; flex-direction: column; }
  li.me { align-items: flex-end; } li.me .msg { background: var(--me); }
  .meta { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s1); }
  .tag { font-weight: 600; }
  .email .tag { color: var(--email); } .whatsapp .tag { color: var(--wa); }
  .subject { font-weight: 600; margin-bottom: var(--s1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .body.clamp { max-height: 9.5em; overflow: hidden; }
  .link { all: unset; color: var(--accent); font-size: var(--fs-sm); cursor: pointer; margin-top: var(--s1); align-self: flex-start; }
  .link:focus-visible { outline: 2px solid var(--accent); }

  /* AI: icon buttons, spinner, the draft button on task rows, badges */
  .ib { all: unset; box-sizing: border-box; display: inline-grid; place-items: center; width: var(--hit); height: var(--hit); flex: none;
    border-radius: var(--radius); color: var(--muted); cursor: pointer; }
  .ib:hover { color: var(--text); background: var(--sel); }
  .ib:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ib[aria-disabled=true], .btn[aria-disabled=true] { opacity: .45; cursor: default; }
  .ib svg, .btn svg { width: var(--icon); height: var(--icon); }
  .btn svg { width: var(--fs-lg); height: var(--fs-lg); vertical-align: -3px; margin-right: var(--s1); }
  .btn.sm svg { width: var(--fs); height: var(--fs); }
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .ai { position: absolute; right: var(--s3); top: var(--s3); z-index: 1; }
  .ai:not([aria-disabled=true]):hover { color: var(--accent); }
  .gai { flex: none; font-variant-numeric: tabular-nums; }
  .pill { all: unset; position: relative; z-index: 1; cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--accent);
    border: 1px solid currentColor; border-radius: 99px; padding: 0 var(--s2); }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rail a { position: relative; }
  .count-badge { position: absolute; top: 2px; right: 10px; min-width: var(--badge); height: var(--badge); padding: 0 var(--s1); border-radius: 99px;
    background: var(--accent); color: var(--panel); font-size: var(--fs-sm); line-height: var(--badge); text-align: center; font-weight: 600; }
  .count-badge.bad { background: var(--err); }

  /* AI Requests: one card per draft, conversation opens below it */
  .cards { list-style: none; margin: 0; padding: 0; }
  .card { position: relative; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--panel);
    box-shadow: inset 3px 0 var(--st, var(--line)); display: flex; flex-direction: column; gap: var(--s2); }
  .card h3 { margin: 0; font-size: var(--fs); display: flex; justify-content: space-between; gap: var(--s3); }
  .card .task { white-space: normal; }
  .why { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
  .brief { margin: 0; padding: var(--s2) var(--s3); background: var(--bg); border-radius: var(--radius); white-space: pre-wrap; }
  textarea.input { width: 100%; resize: vertical; line-height: 1.45; }
  .rsubj { width: 100%; }
  .ractions { display: flex; align-items: center; gap: var(--s1); }
  .ractions .cancel { margin-left: auto; }
  .rrow { padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); background: var(--panel); font-size: var(--fs-sm); color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow b { color: var(--text); }
  .card.past { box-shadow: inset 3px 0 var(--line); }
  .rsub { margin: 0; font-weight: 600; }
  .working { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--fs-sm); }
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); padding: var(--s4);
    width: min(28rem, calc(100% - 2 * var(--s4))); }
  dialog::backdrop { background: color-mix(in srgb, var(--text) 30%, transparent); }
  dialog h2 { font-size: var(--fs-lg); margin: 0 0 var(--s3); }
  dialog label { display: block; font-size: var(--fs-sm); font-weight: 600; margin-bottom: var(--s1); }
  .dact { display: flex; justify-content: flex-end; gap: var(--s2); margin-top: var(--s3); }
  .btn.danger { background: var(--err); border-color: var(--err); color: var(--panel); }

  /* Settings */
  .settings { flex: 1; min-height: 0; }
  .settings .fields { gap: var(--s3); }
  .lrow { display: flex; align-items: center; gap: var(--s2); }
  .lrow label { font-weight: 600; flex: 1; }

  /* Templates: list on the left, editor on the right */
  .tsplit { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr); }
  .tlist { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .tbar { display: flex; gap: var(--s2); padding: var(--s3); border-bottom: 1px solid var(--line); }
  #tlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .trow { all: unset; box-sizing: border-box; display: block; width: 100%; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); cursor: pointer; }
  .trow:hover { background: var(--sel); }
  .trow[aria-current] { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .trow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tn, .ts { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tn { font-weight: 600; } .ts { color: var(--muted); font-size: var(--fs-sm); }
  .editor { overflow-y: auto; padding: var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
  .editor > * { width: 100%; max-width: var(--width); }
  .ehead { display: flex; align-items: center; gap: var(--s2); }
  .input { font: inherit; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); min-width: 0; }
  .tname { flex: 1; font-size: var(--fs-lg); font-weight: 600; padding: var(--s1) var(--s2); border-color: transparent; background: transparent; }
  .tname:hover, .tname:focus { border-color: var(--line); }
  .tstatus { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; } .tstatus.bad { color: var(--err); }
  .btn { font: inherit; padding: var(--s1) var(--s3); border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .btn[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .btn.sm { font-size: var(--fs-sm); padding: 2px var(--s2); }
  .quiet { all: unset; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; padding: var(--s1) var(--s2); border-radius: var(--radius); white-space: nowrap; }
  .quiet:hover { color: var(--text); } .quiet.danger { color: var(--err); font-weight: 600; }
  .quiet:focus-visible { outline: 2px solid var(--accent); }
  .actions { position: sticky; top: calc(-1 * var(--s4)); z-index: 1; display: flex; gap: var(--s2); padding: var(--s2) 0; background: var(--bg); }
  .fields { margin: 0; padding: var(--s3); display: grid; gap: var(--s2); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .fields legend { font-size: var(--fs-sm); font-weight: 600; color: var(--muted); padding: 0 var(--s1); }
  .field { display: grid; grid-template-columns: 11em minmax(0, 1fr) auto; align-items: center; gap: var(--s3); }
  .field > :first-child { font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field.off > :first-child { color: var(--muted); text-decoration: line-through; }
  .inc { font-size: var(--fs-sm); color: var(--muted); display: flex; gap: var(--s1); align-items: center; }
  .toolbar { display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; }
  .tbody { min-height: 16em; padding: var(--s3) var(--s4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow-wrap: anywhere; }
  .tbody h2 { font-size: var(--fs-lg); }
  .preview .tbody, .preview .tsubj { background: var(--bg); }
  .back { display: none; }

  @media (max-width: 700px) {
    .msg { max-width: 100%; } .rows { border-left: 0; border-right: 0; }
    body { grid-template: minmax(0, 1fr) auto / minmax(0, 1fr); }
    .view { grid-row: 1; grid-column: 1; }
    .rail { grid-row: 2; flex-direction: row; padding: 0; border-right: 0; border-top: 1px solid var(--line); }
    .rail a { flex: 1; } .rail a[aria-current] { box-shadow: inset 0 3px var(--accent); }
    .tsplit { grid-template-columns: minmax(0, 1fr); }
    .tsplit[data-pane=editor] .tlist, .tsplit[data-pane=list] .editor { display: none; }
    .back { display: inline-block; }
    .editor { padding: var(--s3); }
    .field { grid-template-columns: minmax(0, 1fr) auto; } .field > :first-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<nav class="rail" aria-label="Sections">
  <a href="#tasks" data-section="tasks" aria-keyshortcuts="Meta+1" title="Tasks (⌘1)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5l1.5 1.5L7 4M3 11l1.5 1.5L7 10M10 5.5h7M10 11.5h7M10 16.5h7M3.5 16.5h3"/></svg>
    <span>Tasks</span></a>
  <a href="#requests" data-section="requests" aria-keyshortcuts="Meta+2" title="AI Requests (⌘2)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l1.4 3.6 3.6 1.4-3.6 1.4L10 12.5 8.6 8.9 5 7.5l3.6-1.4zM15.5 12.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
    <span>Requests</span><span class="count-badge" id="rbadge" hidden></span></a>
  <a href="#templates" data-section="templates" aria-keyshortcuts="Meta+3" title="Templates (⌘3)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5zM12 2.5V6h3.5M7.5 10h6M7.5 13h6"/></svg>
    <span>Templates</span></a>
  <a href="#settings" data-section="settings" aria-keyshortcuts="Meta+4" title="Settings (⌘4)">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h5M12 5h5M3 10h9M16 10h1M3 15h2M9 15h8"/><circle cx="10" cy="5" r="2"/><circle cx="14" cy="10" r="2"/><circle cx="7" cy="15" r="2"/></svg>
    <span>Settings</span></a>
</nav>
<div class="view" id="view-tasks">
<header>
  <div class="wrap">
    <div class="bar">
      <h1>Tasks</h1>
      <time id="updated"></time>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <input type="search" id="q" aria-label="Search tasks" placeholder="Search name, stage, task, email, phone…  ( / )">
    <div class="status" id="status"></div>
  </div>
</header>
<main id="main">
  <div class="wrap" id="people" aria-busy="true"></div>
</main>
</div>
<div class="view" id="view-requests" hidden>
<header>
  <div class="wrap">
    <div class="bar"><h1>AI Requests</h1></div>
    <div class="status" id="rstatus"></div>
  </div>
</header>
<main id="rmain">
  <div class="wrap" id="requests" aria-busy="true"></div>
</main>
</div>
<div class="view" id="view-templates" hidden>
  <div class="tsplit" id="tsplit" data-pane="list">
    <div class="tlist">
      <div class="tbar">
        <input type="search" id="tq" aria-label="Search templates" placeholder="Search templates…  ( / )">
        <button type="button" class="btn" id="tnew" aria-label="New template" title="New template (⌘N)">+</button>
      </div>
      <ul id="tlist" aria-label="Templates"></ul>
    </div>
    <div class="editor" id="editor"></div>
  </div>
</div>
<div class="view" id="view-settings" hidden>
  <div class="editor settings" id="settings"></div>
</div>
<dialog id="ask" aria-labelledby="ask-title">
  <form method="dialog">
    <h2 id="ask-title"></h2>
    <label for="ask-note" id="ask-label"></label>
    <textarea class="input" id="ask-note" rows="3"></textarea>
    <p class="info" id="ask-info"></p>
    <div class="dact"><button type="submit" class="btn" value="keep">Keep</button><button type="submit" class="btn primary" value="ok" id="ask-ok"></button></div>
  </form>
</dialog>
<p class="sr-only" aria-live="polite" id="announce"></p>
<script type="module">
import { placeholders, hasGender, resolve, htmlToText } from '/resolve.js';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHANNELS = { email: 'Email', whatsapp: 'WhatsApp' };
const RECENT = 20;

// App state. Only one person is open at a time.
let sources = {}, sync = { running: false, at: null, errors: {} }, people = [];
let open = null;            // { id, data, filter, all }
const expanded = new Set(); // stage ranks the user opened; all collapsed at launch
const hist = new Map();     // id -> history from the current snapshot

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// ---- time formatting
const fullDate = (d) => d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function ago(at) {
  const d = new Date(at), mins = (Date.now() - d) / 6e4;
  if (mins < 1) return 'now';
  if (mins < 60) return `${Math.floor(mins)}m`;
  if (mins < 1440) return `${Math.floor(mins / 60)}h`;
  if (mins < 10080) return `${Math.floor(mins / 1440)}d`;
  return d.toLocaleDateString(undefined, d.getFullYear() === new Date().getFullYear()
    ? { day: 'numeric', month: 'short' } : { month: 'short', year: 'numeric' });
}
const timeTag = (at, label) => `<time datetime="${esc(at)}" title="${esc(fullDate(new Date(at)))}">${esc(label)}</time>`;

// ---- header
function renderHeader() {
  const btn = $('#refresh');
  btn.setAttribute('aria-disabled', sync.running);
  const step = { history: 'Refreshing', whatsapp: 'Older WhatsApp' }[sync.stage] || 'Refreshing';
  btn.textContent = !sync.running ? 'Refresh' : sync.total ? `${step} ${sync.done} / ${sync.total}` : `${step}…`;
  if (sync.at) {
    const mins = Math.floor((Date.now() - new Date(sync.at)) / 6e4);
    const label = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : `${Math.floor(mins / 60)} h ago`;
    $('#updated').outerHTML = `<time id="updated" datetime="${esc(sync.at)}" title="${esc(fullDate(new Date(sync.at)))}">Updated ${label}</time>`;
  }
  const e = sync.errors || {};
  const item = (label, on, err) => err
    ? `<span class="bad" title="${esc(err)}"><span class="dot bad"></span>${esc(label)} failed: ${esc(err)}</span>`
    : `<span><span class="dot ${on ? 'on' : ''}"></span>${esc(on ? label : label + ' off')}</span>`;
  $('#status').innerHTML = [
    e.crm ? item('CRM', true, e.crm + (sync.at ? ' — showing the last list' : '')) :
      `<span><span class="dot on"></span>${sources.people === 'crm' ? 'CRM' : 'People: sample data'}</span>`,
    ...Object.entries(CHANNELS).map(([k, label]) => item(label, sources[k], e[k])),
  ].join('');
}

// ---- task feed
const KIND = { call: 'Call', followup: 'Follow up', confirm: 'Confirm consultation', splatka: 'Installment' };
const OTHER = { rank: 99, label: 'Other' };
const stageColor = (rank) => (rank >= 1 && rank <= 9 ? `var(--st-${rank})` : 'var(--muted)');
const isOverdue = (p) => p.task?.dueAt && new Date(p.task.dueAt) < Date.now();
// Only tasks due today or overdue are shown; later ones wait until their day.
const endOfToday = () => new Date(new Date().setHours(24, 0, 0, 0));
const isCurrent = (p) => !p.task?.dueAt || new Date(p.task.dueAt) < endOfToday();
const matches = (p, q) => !q || [p.name, p.company, p.stage?.label, p.task && KIND[p.task.kind], p.task?.rule, ...p.emails, ...p.phones]
  .join(' ').toLowerCase().includes(q);

// "+420775623723" -> "+420 775 623 723"; other formats are shown as they are.
const showPhone = (ph) => String(ph).replace(/^\+(42[01])(\d{3})(\d{3})(\d{3})$/, '+$1 $2 $3 $4');

function dueLabel(at) {
  const d = new Date(at), mins = (d - Date.now()) / 6e4;
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (mins < 0) {
    const a = -mins;
    return { over: true, text: 'overdue ' + (a < 60 ? `${Math.floor(a)}m` : a < 1440 ? `${Math.floor(a / 60)}h` : `${Math.floor(a / 1440)}d`) };
  }
  if (mins < 60) return { text: `in ${Math.ceil(mins)}m` };
  const day = (x) => new Date(x).toDateString();
  if (day(d) === day(Date.now())) return { text: `today ${time}` };
  if (day(d) === day(Date.now() + 864e5)) return { text: `tomorrow ${time}` };
  if (mins < 7 * 1440) return { text: `${d.toLocaleDateString(undefined, { weekday: 'short' })} ${time}` };
  return { text: d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) };
}

function renderDue(p) {
  if (!p.task?.dueAt) return p.lastAt ? `<span class="due">last ${timeTag(p.lastAt, ago(p.lastAt))}</span>` : '';
  const d = dueLabel(p.task.dueAt);
  return `<time class="due${d.over ? ' over' : ''}" datetime="${esc(p.task.dueAt)}" title="Due ${esc(fullDate(new Date(p.task.dueAt)))}">${esc(d.text)}</time>`;
}

const renderCopy = (value, shown, what) =>
  `<button type="button" class="copy" data-copy="${esc(value)}" data-what="${what}" aria-label="Copy ${what} ${esc(shown)}">${esc(shown)}</button>`;

function renderContact(p) {
  const parts = [p.stage && esc(p.stage.label),
    p.phones[0] && renderCopy(p.phones[0].replace(/[^\d+]/g, ''), showPhone(p.phones[0]), 'phone'),
    p.emails[0] && renderCopy(p.emails[0], p.emails[0], 'email')].filter(Boolean);
  return parts.length ? `<p class="contact">${parts.join(' · ')}</p>` : '';
}

function renderTask(p) {
  const r = activeReq(p.id);
  const ai = r?.status === 'pending' ? `<button type="button" class="pill" data-goto="${esc(r.id)}">${r.kind === 'meeting' ? 'Offer meeting' : 'Draft ready'}</button>`
    : r?.status === 'failed' ? `<span class="err" title="${esc(r.error)}">AI failed</span>` : '';
  const failed = [ai, ...Object.keys(p.errors || {}).map((k) => `<span class="err">${CHANNELS[k] || k} failed</span>`)].filter(Boolean);
  const last = p.lastAt ? `last ${timeTag(p.lastAt, ago(p.lastAt))}` : 'never contacted';
  const parts = p.task
    ? [`<b>${esc(KIND[p.task.kind] || p.task.kind)}</b>`, p.task.rule && `<span title="${esc(p.task.rule)}">${esc(p.task.rule)}</span>`, last, ...failed]
    : [esc(p.company), last, ...failed];
  return `<p class="task" id="task-${esc(p.id)}">${parts.filter(Boolean).join(' · ')}</p>`;
}

function renderRow(p) {
  const isOpen = open?.id === p.id;
  return `<li class="person">
    <div class="head${isOpen ? ' open' : ''}">
      <button class="row" id="row-${esc(p.id)}" data-id="${esc(p.id)}" aria-expanded="${isOpen}" aria-controls="tl-${esc(p.id)}" aria-describedby="task-${esc(p.id)}">
        <span class="name">${esc(p.name)}</span>${renderDue(p)}
      </button>
      ${renderContact(p)}${renderTask(p)}${renderAi(p)}
    </div>
    ${isOpen ? `<section class="timeline" id="tl-${esc(p.id)}" role="region" aria-labelledby="row-${esc(p.id)}">${renderTimeline()}</section>` : ''}
  </li>`;
}

// Stage groups in pipeline order, collapsed unless opened (or matching a
// search); inside a group the most overdue task first. Empty groups aren't shown.
function renderGroups(rows, searching) {
  const groups = new Map();
  const sorted = [...rows].sort((a, b) => (a.stage || OTHER).rank - (b.stage || OTHER).rank
    || (a.task?.dueAt ?? '9').localeCompare(b.task?.dueAt ?? '9') || a.name.localeCompare(b.name));
  for (const p of sorted) {
    const st = p.stage || OTHER;
    if (!groups.has(st.rank)) groups.set(st.rank, { label: st.label, people: [] });
    groups.get(st.rank).people.push(p);
  }
  return [...groups.entries()].map(([rank, g]) => {
    const over = g.people.filter(isOverdue).length;
    const isOpen = searching || expanded.has(rank);
    return `<section class="group" style="--st: ${stageColor(rank)}">
      <h2><button type="button" class="gt" data-rank="${rank}" aria-expanded="${isOpen}" aria-controls="g-${rank}-rows">
        <span class="chev" aria-hidden="true">▸</span><span class="sd" aria-hidden="true"></span>
        <span class="label">${esc(g.label)}</span> <span>· ${g.people.length}</span>${over ? ` <span class="over">· ${over} overdue</span>` : ''}
      </button>${renderBatch(rank, g)}</h2>
      <ul class="rows" id="g-${rank}-rows"${isOpen ? '' : ' hidden'}>${isOpen ? g.people.map(renderRow).join('') : ''}</ul>
    </section>`;
  }).join('');
}

function renderList() {
  const list = $('#people');
  if (!people.length) {
    list.innerHTML = `<p class="empty">${sync.running ? `Loading tasks and history… ${sync.total ? `${sync.done} / ${sync.total}` : ''}`
      : sync.errors?.crm ? 'Could not load tasks.' : 'No tasks yet. Press Refresh.'}</p>`;
    return;
  }
  list.removeAttribute('aria-busy');
  const q = $('#q').value.trim().toLowerCase();
  const current = people.filter(isCurrent), later = people.length - current.length;
  const rows = current.filter((p) => matches(p, q));
  const empty = q ? 'No matches' : 'Nothing due today.';
  list.innerHTML = (q ? `<p class="count">${rows.length} of ${current.length}</p>` : '') +
    (rows.length ? renderGroups(rows, Boolean(q)) : `<p class="empty">${empty}</p>`) +
    (later ? `<p class="count">${later} later task${later > 1 ? 's' : ''} hidden until their day</p>` : '');
}

// One click copies phone or email; falls back when the clipboard API is refused.
async function copy(btn) {
  const value = btn.dataset.copy;
  let ok = false;
  try { await navigator.clipboard.writeText(value); ok = true; } catch {
    const t = document.createElement('textarea');
    t.value = value; document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch {}
    t.remove();
  }
  const shown = btn.textContent;
  btn.style.minWidth = `${btn.offsetWidth}px`;
  btn.textContent = ok ? 'Copied' : 'Press ⌘C';
  $('#announce').textContent = ok ? `${btn.dataset.what === 'phone' ? 'Phone' : 'Email'} copied` : '';
  setTimeout(() => { btn.textContent = shown; btn.style.minWidth = ''; }, 1500);
}

// ---- timeline (inside the open row)
const renderMeta = (m, who) => `<div class="meta"><span class="tag">${CHANNELS[m.channel]}</span> · ${esc(who)} · ${timeTag(m.at, new Date(m.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}</div>`;

function renderBody(m) {
  if (m.text.length <= 600) return `<div class="body">${esc(m.text)}</div>`;
  const id = `b-${esc(m.id).replace(/[^\w-]/g, '_')}`;
  return `<div class="body clamp" id="${id}">${esc(m.text)}</div>
    <button class="link" data-more aria-expanded="false" aria-controls="${id}">Show more</button>`;
}

const renderEmail = (m, p) => `<article class="msg email" aria-label="Email from ${esc(m.fromMe ? 'you' : m.from)}">
  ${renderMeta(m, m.fromMe ? 'You' : m.from)}
  <div class="subject" title="${esc(m.subject)}">${esc(m.subject)}</div>${renderBody(m)}</article>`;

const renderWhatsApp = (m, p) => `<article class="msg whatsapp" aria-label="WhatsApp from ${esc(m.fromMe ? 'you' : p.name)}">
  ${renderMeta(m, m.fromMe ? 'You' : p.name)}${renderBody(m)}</article>`;

const RENDER = { email: renderEmail, whatsapp: renderWhatsApp };

function renderDay(at) {
  return `<li><h3 class="day">${esc(new Date(at).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }))}</h3></li>`;
}

function renderErrors(errors) {
  return Object.entries(errors).map(([k, v]) => `<p class="err" role="status">${CHANNELS[k] || k} unavailable: ${esc(v)}</p>`).join('');
}

function renderEmpty(p) {
  if (!p.emails.length && !p.phones.length) return '<p class="empty">No email or phone for this person in the CRM.</p>';
  const tips = [];
  if (p.emails.length && !sources.email) tips.push('Email isn\'t connected.');
  if (p.phones.length && !sources.whatsapp) tips.push('WhatsApp isn\'t connected.');
  if (p.phones.some((ph) => !String(ph).trim().startsWith('+'))) tips.push('WhatsApp needs phones with a country code (+…).');
  return `<p class="empty">No messages for ${esc([...p.emails, ...p.phones].join(', '))}.${tips.length ? '<br>' + esc(tips.join(' ')) : ''}</p>`;
}

// st: { data, filter, all } — the open person in Tasks, or the open request's conversation.
function renderTimeline(st = open) {
  if (!st.data) return '<p class="info" aria-live="polite">Loading…</p>';
  const { person: p, messages, errors } = st.data;
  const used = Object.keys(CHANNELS).filter((k) => messages.some((m) => m.channel === k));
  const shown = messages.filter((m) => st.filter === 'all' || m.channel === st.filter);
  const visible = st.all ? shown : shown.slice(-RECENT);
  const filters = used.length > 1 ? `<div class="filters">${[['all', `All ${messages.length}`], ...used.map((k) => [k, `${CHANNELS[k]} ${p.counts[k]}`])]
    .map(([k, l]) => `<button type="button" data-filter="${k}" aria-pressed="${st.filter === k}">${l}</button>`).join('')}</div>` : '';
  const earlier = shown.length > visible.length ? `<button class="link" data-earlier>Show earlier (${shown.length - visible.length})</button>` : '';
  let lastDay = '';
  const items = visible.map((m) => {
    const day = new Date(m.at).toDateString();
    const sep = day !== lastDay ? renderDay(m.at) : '';
    lastDay = day;
    return sep + `<li class="${m.channel}${m.fromMe ? ' me' : ''}">${RENDER[m.channel](m, p)}</li>`;
  }).join('');
  const note = p.task?.note ? `<p class="note"><b>Task note:</b> ${esc(p.task.note)}</p>` : '';
  const after = st.data.after ? `<p class="day">${esc(st.data.after)}</p>` : '';
  return note + renderErrors(errors) + (messages.length ? filters + earlier + `<ol class="msgs">${items}</ol>` : renderEmpty(p)) + after;
}

function rerenderOpen() {
  const el = open && document.getElementById(`tl-${open.id}`);
  if (el) el.innerHTML = renderTimeline();
  const rel = ropen && document.getElementById(`rtl-${ropen.reqId}`);
  if (rel) rel.innerHTML = renderTimeline(ropen);
}

// Filters, "Show earlier" and "Show more" inside a timeline. True when handled.
function timelineClick(e, st) {
  const f = e.target.closest('[data-filter]');
  if (f) { st.filter = f.dataset.filter; st.all = false; rerenderOpen(); return true; }
  if (e.target.closest('[data-earlier]')) { st.all = true; rerenderOpen(); return true; }
  const more = e.target.closest('[data-more]');
  if (!more) return false;
  const expanded = more.getAttribute('aria-expanded') !== 'true';
  document.getElementById(more.getAttribute('aria-controls')).classList.toggle('clamp', !expanded);
  more.setAttribute('aria-expanded', expanded);
  more.textContent = expanded ? 'Show less' : 'Show more';
  return true;
}

async function loadHistory(id) {
  if (!hist.has(id)) {
    try { hist.set(id, await api(`/api/people/${encodeURIComponent(id)}/history`)); }
    catch (e) { const p = people.find((x) => x.id === id); hist.set(id, { person: p, messages: [], errors: { load: e.message } }); }
  }
  if (open?.id === id) open.data = hist.get(id);
  if (ropen?.id === id && !ropen.ctx) ropen.data = hist.get(id);
  rerenderOpen();
}

// Opens or closes a row, keeping the clicked header where it was on screen.
function toggle(id) {
  const before = document.getElementById(`row-${id}`)?.getBoundingClientRect().top;
  open = open?.id === id ? null : { id, data: hist.get(id), filter: 'all', all: false };
  renderList();
  const btn = document.getElementById(`row-${id}`);
  if (btn && before != null) $('#main').scrollTop += btn.getBoundingClientRect().top - before;
  btn?.focus({ preventScroll: true });
  if (open && !open.data) loadHistory(id);
}

// Opens or closes a stage group; closing it also closes the person open in it.
function toggleGroup(rank) {
  if ($('#q').value.trim()) return; // while searching, every group with matches is open
  if (expanded.has(rank)) {
    expanded.delete(rank);
    if (open && (people.find((p) => p.id === open.id)?.stage || OTHER).rank === rank) open = null;
  } else expanded.add(rank);
  renderList();
  document.querySelector(`.gt[data-rank="${rank}"]`)?.focus({ preventScroll: true });
}

// ---- refresh
async function loadPeople() {
  people = await api('/api/people');
  hist.clear();
  if (open && !people.some((p) => p.id === open.id)) open = null;
  const focusedId = document.activeElement?.dataset?.id, focusedRank = document.activeElement?.dataset?.rank;
  renderList();
  if (focusedId) document.getElementById(`row-${focusedId}`)?.focus({ preventScroll: true });
  if (focusedRank) document.querySelector(`.gt[data-rank="${focusedRank}"]`)?.focus({ preventScroll: true });
  if (open) { open.data = null; rerenderOpen(); loadHistory(open.id); }
  if (ropen && !ropen.ctx) { ropen.data = null; rerenderOpen(); loadHistory(ropen.id); }
  renderRequests();
}

async function poll() {
  const wasRunning = sync.running, prevAt = sync.at;
  sync = await api('/api/refresh');
  renderHeader();
  // A refresh publishes twice (history, then older WhatsApp); show each as it lands.
  if (sync.at !== prevAt) await loadPeople();
  if (sync.running) {
    if (!people.length) renderList();
    return setTimeout(poll, 1000);
  }
  if (wasRunning) {
    const failed = Object.keys(sync.errors).map((k) => `${CHANNELS[k] || 'CRM'} failed.`).join(' ');
    $('#announce').textContent = `Updated, ${people.length} people. ${failed}`;
  }
}

async function startRefresh() {
  if (sync.running) return;
  sync = await api('/api/refresh', { method: 'POST' });
  $('#announce').textContent = 'Refreshing';
  renderHeader(); renderList();
  setTimeout(poll, 500);
}

// ---- events
$('#refresh').addEventListener('click', startRefresh);
$('#q').addEventListener('input', () => {
  renderList();
  const q = $('#q').value.trim();
  if (q) $('#announce').textContent = `${document.querySelectorAll('.row').length} matches in ${document.querySelectorAll('.group').length} stages`;
});
$('#people').addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]');
  if (c) return copy(c);
  const g = e.target.closest('.gt');
  if (g) return toggleGroup(Number(g.dataset.rank));
  const row = e.target.closest('.row');
  if (row) return toggle(row.dataset.id);
  const d = e.target.closest('[data-draft]');
  if (d) return d.getAttribute('aria-disabled') === 'true' ? $('#announce').textContent = d.title : startDraft([d.dataset.draft]);
  const go = e.target.closest('[data-goto]');
  if (go) { e.preventDefault(); return gotoRequest(go.dataset.goto); }
  const b = e.target.closest('[data-batch]');
  if (b) return batch(b);
  if (open) timelineClick(e, open);
});
// ↑/↓/Home/End move between people; Esc closes the open person.
$('#people').addEventListener('keydown', (e) => {
  // Arrows move through group headers and the rows of open groups, in order.
  const rows = [...document.querySelectorAll('.gt, .rows:not([hidden]) .row')];
  if (e.key === 'Escape' && open) { e.preventDefault(); return toggle(open.id); }
  if (e.key === 'g' && !e.metaKey && !e.ctrlKey) {
    const ai = document.activeElement.closest('.head')?.querySelector('.ai');
    if (ai) { e.preventDefault(); return ai.click(); }
  }
  // From a row's copy buttons too, arrows move between rows.
  const a = document.activeElement;
  const current = a.classList.contains('gt') ? a : a.closest('.head')?.querySelector('.row');
  const i = rows.indexOf(current);
  if (i < 0) return;
  const next = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: rows.length - 1 }[e.key];
  if (next == null) return;
  e.preventDefault();
  rows[Math.max(0, Math.min(rows.length - 1, next))].focus();
});
document.addEventListener('keydown', (e) => {
  const a = document.activeElement, typing = a?.matches('input, textarea, [contenteditable=true]');
  if (e.metaKey && SECTIONS.includes(SECTIONS[e.key - 1])) { e.preventDefault(); return showSection(SECTIONS[e.key - 1], true); }
  if (e.metaKey && e.key === 'n' && section === 'templates') { e.preventDefault(); return newTemplate(); }
  const search = { tasks: '#q', templates: '#tq' }[section];
  if (e.key === '/' && !typing && search) { e.preventDefault(); $(search).focus(); }
});
setInterval(() => { renderHeader(); if (!sync.running && people.length && !open) renderList(); }, 30_000);

// ---- AI: drafts are requests waiting for the user (see /api/requests)
const ICONS = {
  draft: 'M4 10h11M11 6l4 4-4 4',
  send: 'M17.5 2.5L9 11M17.5 2.5l-5 15-3.5-6.5-6.5-3.5z',
  wa: 'M10 3a7 7 0 0 0-6 10.6L3 17l3.4-1A7 7 0 1 0 10 3z',
  done: 'M4 10.5l4 4 8-9',
  regen: 'M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3h-3',
  conv: 'M3 4h10v7H7l-3 2.5V11H3zM13 8h4v6h-1v2l-2.5-2H9v-2',
  cancel: 'M5 5l10 10M15 5L5 15',
  recover: 'M7 4L3 8l4 4M3 8h9a5 5 0 0 1 0 10H9',
};
const icon = (name) => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]}"/></svg>`;
const SPIN = '<svg class="spin" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke-dasharray="30 14"/></svg>';
const REQ_OPEN = ['generating', 'pending', 'failed'];

let requests = [], reqError = '', reqLoaded = false;
let ropen = null;            // the request whose conversation is open: { reqId, id, data, filter, all }
let recentOpen = false, cancelledOpen = false, cancelledShown = 20, rdefer = false, rtimer;
const CANCELLED_PAGE = 20;
const activeReq = (personId) => requests.filter((r) => r.personId === personId && REQ_OPEN.includes(r.status)).at(-1);
const busy = (p) => ['generating', 'pending'].includes(activeReq(p.id)?.status);
const reachable = (p) => p.emails.length > 0 || p.phones.length > 0;

function renderAi(p) {
  const r = activeReq(p.id), id = esc(p.id), name = esc(p.name);
  if (r?.status === 'generating') return `<button type="button" class="ib ai" id="ai-${id}" aria-disabled="true" aria-label="Drafting a follow-up for ${name}" title="Drafting a follow-up…">${SPIN}</button>`;
  const why = r?.status === 'pending' ? 'A draft is waiting in AI Requests' : !reachable(p) ? 'No email or WhatsApp to write to' : '';
  const title = why || (r?.status === 'failed' ? `Retry the draft. Last try failed: ${r.error}` : 'Draft a follow-up with AI (G)');
  return `<button type="button" class="ib ai" id="ai-${id}" data-draft="${id}" aria-keyshortcuts="g" aria-label="${why ? esc(why) : `Draft a follow-up for ${name}`}"
    title="${esc(title)}"${why ? ' aria-disabled="true"' : ''}>${icon('draft')}</button>`;
}

// Group button: drafts for everyone shown in the group without a draft on the way.
function renderBatch(rank, g) {
  const ok = g.people.filter((p) => reachable(p) && !busy(p)), skipped = g.people.filter(busy).length;
  if (!ok.length) return '';
  return `<button type="button" class="btn sm gai" data-batch="${rank}" data-ids="${esc(ok.map((p) => p.id).join(','))}"
    aria-label="Draft follow-ups for ${ok.length} in ${esc(g.label)}" title="Draft follow-ups for ${ok.length} with AI${skipped ? ` (${skipped} with a draft are skipped)` : ''}">${icon('draft')}Draft ${ok.length}</button>`;
}

// Re-renders the task list, keeping focus on the same element.
function rerenderTasks() {
  const a = document.activeElement;
  const key = a?.id ? `#${CSS.escape(a.id)}` : a?.dataset?.rank ? `[data-rank="${a.dataset.rank}"]${a.dataset.batch ? '.gai' : '.gt'}` : null;
  renderList();
  if (key) document.querySelector(key)?.focus({ preventScroll: true });
}

async function startDraft(ids, quiet = false) {
  try {
    const created = await api('/api/requests', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify({ personIds: ids }) });
    requests.push(...created);
    if (!quiet) $('#announce').textContent = created.length === 1 ? `Drafting a follow-up for ${created[0].personName}` : `Drafting ${created.length} follow-ups`;
  } catch (e) { $('#announce').textContent = `Could not start the draft: ${e.message}`; }
  rerenderTasks(); renderRequests(); renderBadge(); loadRequests();
}

// More than 10 at once asks for a second click.
let armTimer;
function batch(b) {
  const ids = b.dataset.ids.split(',');
  if (ids.length > 10 && !b.dataset.armed) {
    b.dataset.armed = '1'; b.lastChild.textContent = `Draft ${ids.length}? Click again`;
    clearTimeout(armTimer); armTimer = setTimeout(rerenderTasks, 4000);
    return;
  }
  startDraft(ids, true);
  $('#announce').textContent = `Drafting ${ids.length} follow-ups`;
}

// Only the newest load counts: an older answer arriving late would undo newer state.
let reqSeq = 0;
async function loadRequests() {
  const seq = ++reqSeq, before = new Map(requests.map((r) => [r.id, r.status]));
  let list;
  try { list = await api('/api/requests'); reqError = ''; } catch (e) { reqError = e.message; }
  if (seq !== reqSeq) return;
  if (list) requests = list;
  reqLoaded = true;
  const done = requests.filter((r) => before.get(r.id) === 'generating' && r.status !== 'generating');
  if (done.length === 1) $('#announce').textContent = done[0].status === 'failed' ? `Draft failed for ${done[0].personName}` : `Draft ready for ${done[0].personName}`;
  else if (done.length) $('#announce').textContent = `${done.filter((r) => r.status !== 'failed').length} drafts ready, ${done.filter((r) => r.status === 'failed').length} failed`;
  if (done.length || before.size !== requests.length) rerenderTasks();
  renderRequests(); renderBadge();
  clearTimeout(rtimer);
  if (requests.some((r) => r.status === 'generating')) rtimer = setTimeout(loadRequests, 2000);
}

function renderBadge() {
  const waiting = requests.filter((r) => r.status === 'pending').length, failed = requests.filter((r) => r.status === 'failed').length;
  const b = $('#rbadge'), n = waiting + failed;
  b.hidden = !n; b.textContent = n; b.classList.toggle('bad', failed > 0);
  b.parentElement.setAttribute('aria-label', `AI Requests${n ? `, ${waiting} waiting${failed ? `, ${failed} failed` : ''}` : ''}`);
}

// ---- AI Requests section
const personOf = (r) => people.find((p) => p.id === r.personId) || { id: r.personId, name: r.personName, emails: [], phones: [] };
const STATUS = { sent: 'sent', cancelled: 'cancelled', done: 'offered', regenerated: 'replaced' };

function renderRStatus() {
  const items = [`<span><span class="dot ${sources.smtp ? 'on' : ''}"></span>${sources.smtp ? 'Email sending' : 'Email sending off'}</span>`,
    `<span><span class="dot ${sources.whatsapp ? 'on' : ''}"></span>WhatsApp app</span>`];
  if (reqError) items.unshift(`<span class="bad"><span class="dot bad"></span>Could not load requests: ${esc(reqError)}</span>`);
  $('#rstatus').innerHTML = items.join('');
}

function renderRequests() {
  const el = $('#requests');
  if (!el) return;
  // Never re-render under the user's hands; catch up when they leave the field.
  if (el.contains(document.activeElement) && document.activeElement.matches('textarea, input')) { rdefer = true; return; }
  rdefer = false;
  renderRStatus();
  if (!reqLoaded) { el.innerHTML = '<p class="empty">Loading requests…</p>'; return; }
  el.removeAttribute('aria-busy');
  const rank = (r) => personOf(r).stage?.rank ?? 99, due = (r) => personOf(r).task?.dueAt ?? '9';
  const waiting = requests.filter((r) => r.status === 'pending').sort((a, b) => rank(a) - rank(b) || due(a).localeCompare(due(b)));
  const working = requests.filter((r) => r.status === 'failed' || r.status === 'generating').sort((a, b) => (a.status === 'failed' ? -1 : 0) - (b.status === 'failed' ? -1 : 0));
  const week = Date.now() - 7 * 864e5;
  const recent = requests.filter((r) => !REQ_OPEN.includes(r.status) && r.status !== 'cancelled' && new Date(r.updatedAt) > week).slice(-20).reverse();
  const cancelled = requests.filter((r) => r.status === 'cancelled' && r.text).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  const shown = cancelled.slice(0, cancelledShown), left = cancelled.length - shown.length;
  const group = (title, list, body) => list.length ? `<section class="group"><h2>${title} <span>· ${list.length}</span></h2>${body}</section>` : '';
  el.innerHTML = (waiting.length || working.length ? '' : `<p class="empty">Nothing waiting. Press ${icon('draft').replace('<svg', '<svg width="14" height="14"')} on a task to draft a follow-up.</p>`)
    + group('Waiting for you', waiting, `<ul class="cards">${waiting.map(renderCard).join('')}</ul>`)
    + group('In progress', working, `<ul class="cards">${working.map(renderCard).join('')}</ul>`)
    + (recent.length ? `<section class="group"><h2><button type="button" class="gt" data-recent aria-expanded="${recentOpen}" aria-controls="recent-rows">
        <span class="chev" aria-hidden="true">▸</span><span class="label">Recent</span> <span>· ${recent.length}</span></button></h2>
        <ul class="cards" id="recent-rows"${recentOpen ? '' : ' hidden'}>${recentOpen ? recent.map(renderRecent).join('') : ''}</ul></section>` : '')
    + (cancelled.length ? `<section class="group"><h2><button type="button" class="gt" data-cancelled aria-expanded="${cancelledOpen}" aria-controls="cancelled-rows">
        <span class="chev" aria-hidden="true">▸</span><span class="label">Cancelled</span> <span>· ${cancelled.length}</span></button></h2>
        <ul class="cards" id="cancelled-rows"${cancelledOpen ? '' : ' hidden'}>${cancelledOpen ? shown.map(renderCancelled).join('')
          + (left ? `<li class="rrow"><button type="button" class="link" data-cmore>Show ${Math.min(left, CANCELLED_PAGE)} more (${left} left)</button></li>` : '') : ''}</ul></section>` : '');
}

const renderRecent = (r) => `<li class="rrow"><b>${esc(r.personName)}</b> · ${r.kind === 'meeting' ? 'Meeting' : CHANNELS[r.channel] || 'Draft'} ${STATUS[r.status] || r.status}
  ${timeTag(r.updatedAt, ago(r.updatedAt))}${r.note ? ` · “${esc(r.note)}”` : ''}${r.text ? ` — ${esc(r.text.slice(0, 140))}` : ''}</li>`;

function renderCardHead(r, p) {
  const tpl = r.templateId && tpls?.find((t) => t.id === r.templateId);
  const what = r.status === 'generating' || r.status === 'failed' ? '' : r.kind === 'meeting' ? 'Offer a meeting' : CHANNELS[r.channel];
  const parts = [what && `<b class="${r.kind === 'meeting' ? '' : r.channel}">${what}</b>`,
    p.task && esc(KIND[p.task.kind] || p.task.kind), `drafted ${timeTag(r.createdAt, ago(r.createdAt))}`, tpl && `template “${esc(tpl.name)}”`];
  return `<h3><span class="name">${esc(p.name)}</span>${renderDue(p)}</h3>${renderContact(p)}<p class="task">${parts.filter(Boolean).join(' · ')}</p>`;
}

const renderConv = (r, p, isOpen, label = `Conversation with ${p.name}`) =>
  `<button type="button" class="ib" data-act="conv" aria-expanded="${isOpen}" aria-controls="rtl-${esc(r.id)}" aria-label="${esc(label)}" title="${esc(label)}">${icon('conv')}</button>`;

const renderReason = (r) => (r.note ? `<p class="note"><b>Reason:</b> ${esc(r.note)}</p>` : '<p class="why">No reason given</p>');

// Recover: a copy goes back to "Waiting for you". The server says why not (r.recover).
function renderRecover(r) {
  const copy = requests.find((x) => x.recoveredFrom === r.id);
  if (copy) return `<span class="why">Recovered${copy.status === 'pending' ? ` · <button type="button" class="link" data-goto="${esc(copy.id)}">open</button>` : ` · ${STATUS[copy.status] || copy.status}`}</span>`;
  const label = `Recover the draft for ${r.personName}`;
  return `<button type="button" class="btn sm" data-act="recover" title="${esc(r.recover || 'Make this a waiting draft again')}"
    aria-label="${esc(r.recover ? `${label}: ${r.recover}` : label)}"${r.recover ? ' aria-disabled="true"' : ''}>${icon('recover')}Recover</button>`;
}

// A cancelled draft as a record: the reason, the message, and (on demand) what the AI saw.
function renderCancelled(r) {
  const p = personOf(r), id = esc(r.id), isOpen = ropen?.reqId === r.id;
  const what = r.kind === 'meeting' ? 'Offer a meeting' : CHANNELS[r.channel];
  return `<li class="card past" id="card-${id}" data-req="${id}" tabindex="-1">
    <h3><span class="name">${esc(r.personName)}</span>${timeTag(r.updatedAt, `cancelled ${ago(r.updatedAt)}`)}</h3>
    <p class="task"><b class="${r.kind === 'meeting' ? '' : esc(r.channel)}">${what}</b> · drafted ${timeTag(r.createdAt, ago(r.createdAt))}</p>
    ${renderReason(r)}${r.subject ? `<p class="rsub">${esc(r.subject)}</p>` : ''}<p class="brief">${esc(r.text)}</p>
    <div class="ractions">${renderConv(r, p, isOpen, `What the AI saw before drafting for ${r.personName}`)}<span class="cancel">${renderRecover(r)}</span></div></li>
    ${isOpen ? `<li><section class="timeline" id="rtl-${id}" role="region" aria-label="What the AI saw before drafting for ${esc(r.personName)}">${renderTimeline(ropen)}</section></li>` : ''}`;
}

// The saved context as timeline data; the draft was written right after the last message.
function contextData(r, ctx) {
  const counts = {};
  for (const m of ctx.messages) counts[m.channel] = (counts[m.channel] || 0) + 1;
  return { person: { ...personOf(r), name: r.personName, task: ctx.task, counts }, messages: ctx.messages, errors: {},
    after: `${ctx.rebuilt ? 'Rebuilt from the current history (older drafts have no saved context). ' : ''}The AI drafted here${ctx.stage ? ` · stage ${ctx.stage}` : ''}.` };
}

async function openContext(r) {
  try { const one = await api(`/api/requests/${encodeURIComponent(r.id)}`); if (ropen?.reqId === r.id) ropen.data = contextData(r, one.context); }
  catch (e) { if (ropen?.reqId === r.id) ropen.data = { person: { ...personOf(r), counts: {} }, messages: [], errors: { load: e.message } }; }
  rerenderOpen();
}

async function recoverDraft(card, r, btn) {
  if (btn.getAttribute('aria-disabled') === 'true') { $('#announce').textContent = r.recover; return; }
  btn.setAttribute('aria-disabled', 'true'); btn.lastChild.textContent = 'Recovering…';
  try {
    const copy = await requestAction(r, 'recover');
    $('#announce').textContent = `Draft for ${r.personName} recovered, waiting for you`;
    rerenderTasks(); gotoRequest(copy.id);
  } catch (e) {
    await loadRequests();
    $('#announce').textContent = `Could not recover: ${e.message}`;
    document.querySelector(`#card-${CSS.escape(r.id)} [data-act=recover]`)?.focus();
  }
}

function renderCard(r) {
  const p = personOf(r), id = esc(r.id), isOpen = ropen?.reqId === r.id;
  const conv = renderConv(r, p, isOpen);
  const regen = (label) => `<button type="button" class="ib" data-act="regen" aria-label="${label}" title="${label}">${icon('regen')}</button>`;
  const cancel = `<button type="button" class="ib cancel" data-act="cancel" aria-label="Cancel" title="Cancel">${icon('cancel')}</button>`;
  let body;
  if (r.status === 'generating') body = `<p class="working">${SPIN} Drafting…</p><div class="ractions">${conv}${cancel}</div>`;
  else if (r.status === 'failed') body = `<p class="err" role="status">Draft failed: ${esc(r.error)}</p>
    <div class="ractions"><button type="button" class="btn primary" data-act="retry">${icon('regen')}Retry</button>${conv}${cancel}</div>`;
  else if (r.kind === 'meeting') body = `<p class="why">${esc(r.reasoning)}</p><p class="brief">${esc(r.text)}</p>
    <div class="ractions"><button type="button" class="btn primary" data-act="send" aria-keyshortcuts="Meta+Enter" title="I offered the meeting (⌘↩)">${icon('done')}Done</button>
      ${regen('Draft a message instead')}${conv}${cancel}<span class="tstatus" data-st></span></div>`;
  else {
    const rows = Math.min(14, Math.max(3, r.text.split('\n').length + Math.floor(r.text.length / 90)));
    const primary = r.channel === 'email'
      ? `<button type="button" class="btn primary" data-act="send" aria-keyshortcuts="Meta+Enter" title="${sources.smtp ? 'Send the email (⌘↩)' : 'Email sending is not set up'}"${sources.smtp ? '' : ' aria-disabled="true"'}>${icon('send')}Send</button>`
      : `<button type="button" class="btn primary" data-act="send" aria-keyshortcuts="Meta+Enter" title="Open WhatsApp with this message (⌘↩)">${icon('wa')}Open WA</button>`;
    body = `<p class="why">${esc(r.reasoning)}</p>
      ${r.channel === 'email' ? `<input class="input rsubj" data-edit="subject" aria-label="Subject" placeholder="Subject" value="${esc(r.subject)}">` : ''}
      <textarea class="input" data-edit="text" rows="${rows}" aria-label="Message to ${esc(p.name)}">${esc(r.text)}</textarea>
      <div class="ractions">${primary}${regen('Regenerate')}${conv}${cancel}<span class="tstatus" data-st></span></div>`;
  }
  return `<li class="card" id="card-${id}" data-req="${id}" style="--st: ${stageColor(p.stage?.rank)}">${renderCardHead(r, p)}${body}</li>
    ${isOpen ? `<li><section class="timeline" id="rtl-${id}" role="region" aria-label="Conversation with ${esc(p.name)}">${renderTimeline(ropen)}</section></li>` : ''}`;
}

function gotoRequest(id) {
  showSection('requests');
  const card = document.getElementById(`card-${id}`);
  card?.scrollIntoView({ block: 'center' });
  (card?.querySelector('textarea, [data-act=send]'))?.focus({ preventScroll: true });
}

const cardStatus = (card, text, bad = false) => {
  const el = card?.querySelector('[data-st]');
  if (el) { el.textContent = text; el.classList.toggle('bad', bad); }
};

// Edits are saved as you type, so a draft survives a reload.
const editTimers = {};
function editDraft(card, r) {
  r.text = card.querySelector('[data-edit=text]')?.value ?? r.text;
  r.subject = card.querySelector('[data-edit=subject]')?.value ?? r.subject;
  r.edited = true;
  cardStatus(card, 'Saving…');
  clearTimeout(editTimers[r.id]);
  editTimers[r.id] = setTimeout(async () => {
    try { await api(`/api/requests/${encodeURIComponent(r.id)}`, { method: 'PUT', headers: JSON_HEADERS, body: JSON.stringify({ text: r.text, subject: r.subject }) }); cardStatus(document.getElementById(`card-${r.id}`), 'Saved'); }
    catch (e) { cardStatus(document.getElementById(`card-${r.id}`), `Not saved: ${e.message}`, true); }
  }, 600);
}

async function requestAction(r, action, body = {}) {
  const res = await api(`/api/requests/${encodeURIComponent(r.id)}/${action}`, { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(body) });
  if (ropen?.reqId === r.id) ropen = null;
  await loadRequests();
  return res;
}

async function approve(card, r, btn) {
  if (btn.getAttribute('aria-disabled') === 'true') return;
  clearTimeout(editTimers[r.id]);
  const label = btn.innerHTML;
  btn.setAttribute('aria-disabled', 'true');
  btn.lastChild.textContent = r.kind === 'meeting' ? 'Saving…' : r.channel === 'email' ? 'Sending…' : 'Opening…';
  const text = card.querySelector('[data-edit=text]')?.value, subject = card.querySelector('[data-edit=subject]')?.value;
  try {
    await requestAction(r, 'send', { text, subject });
    $('#announce').textContent = r.kind === 'meeting' ? `Meeting offer done for ${r.personName}` : r.channel === 'email' ? `Email sent to ${r.personName}` : `Opened WhatsApp for ${r.personName}`;
  } catch (e) {
    btn.innerHTML = label; btn.removeAttribute('aria-disabled');
    cardStatus(card, `Not sent: ${e.message}`, true);
  }
}

// One dialog for Cancel and Regenerate: an optional note, saved with the request.
function ask(r, mode) {
  const d = $('#ask'), name = r.personName;
  const edited = mode === 'regen' && r.edited;
  $('#ask-title').textContent = mode === 'cancel' ? `Cancel the draft for ${name}?` : `Regenerate the draft for ${name}`;
  $('#ask-label').textContent = mode === 'cancel' ? 'Reason (optional)' : 'What should change? (optional)';
  $('#ask-note').placeholder = mode === 'cancel' ? 'e.g. already called her' : 'e.g. shorter, mention the installment option';
  $('#ask-info').textContent = edited ? 'Your edits will be replaced.' : 'The AI sees this note next time it drafts for this client.';
  $('#ask-ok').textContent = mode === 'cancel' ? 'Cancel draft' : 'Regenerate';
  $('#ask-ok').className = `btn ${mode === 'cancel' ? 'danger' : 'primary'}`;
  $('#ask-note').value = '';
  d.returnValue = '';
  d.onclose = async () => {
    if (d.returnValue !== 'ok') return;
    const note = $('#ask-note').value.trim();
    try {
      await requestAction(r, mode === 'cancel' ? 'cancel' : 'regenerate', { note });
      $('#announce').textContent = mode === 'cancel' ? `Draft cancelled for ${name}` : `Regenerating the draft for ${name}`;
      rerenderTasks();
    } catch (e) { $('#announce').textContent = e.message; }
  };
  d.showModal();
  $('#ask-note').focus();
}
$('#ask-note').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.metaKey) { e.preventDefault(); $('#ask').close('ok'); }
});

$('#requests').addEventListener('click', (e) => {
  const cp = e.target.closest('[data-copy]');
  if (cp) return copy(cp);
  if (e.target.closest('[data-recent]')) { recentOpen = !recentOpen; renderRequests(); return $('[data-recent]')?.focus(); }
  if (e.target.closest('[data-cancelled]')) {
    cancelledOpen = !cancelledOpen; cancelledShown = CANCELLED_PAGE; renderRequests(); return $('[data-cancelled]')?.focus();
  }
  if (e.target.closest('[data-cmore]')) {
    const first = cancelledShown; cancelledShown += CANCELLED_PAGE; renderRequests();
    return $('#cancelled-rows').querySelectorAll('.card')[first]?.focus();
  }
  const go = e.target.closest('[data-goto]');
  if (go) return gotoRequest(go.dataset.goto);
  const card = e.target.closest('.card');
  const r = card && requests.find((x) => x.id === card.dataset.req);
  if (!r) return ropen && timelineClick(e, ropen);
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'conv') {
    const ctx = r.status === 'cancelled';
    ropen = ropen?.reqId === r.id ? null : { reqId: r.id, id: r.personId, data: ctx ? null : hist.get(r.personId), filter: 'all', all: false, ctx };
    renderRequests();
    document.querySelector(`#card-${CSS.escape(r.id)} [data-act=conv]`)?.focus({ preventScroll: true });
    if (ropen?.ctx) openContext(r);
    else if (ropen && !ropen.data) loadHistory(r.personId);
    return;
  }
  if (act === 'recover') return recoverDraft(card, r, btn);
  if (act === 'send') return approve(card, r, btn);
  if (act === 'retry') return requestAction(r, 'regenerate').then(rerenderTasks).catch((er) => cardStatus(card, er.message, true));
  if (act === 'cancel' && r.status === 'generating') return requestAction(r, 'cancel').then(rerenderTasks);
  ask(r, act);
});
$('#requests').addEventListener('input', (e) => {
  const card = e.target.closest('.card'), r = card && requests.find((x) => x.id === card.dataset.req);
  if (r && e.target.dataset.edit) editDraft(card, r);
});
$('#requests').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.metaKey) return;
  const btn = e.target.closest('.card')?.querySelector('[data-act=send]');
  if (btn) { e.preventDefault(); btn.click(); }
});
$('#requests').addEventListener('focusout', () => setTimeout(() => {
  if (rdefer && !$('#requests').contains(document.activeElement)) renderRequests();
}));

// ---- Settings: model, style guide (learned, editable) and the prompts
let settings = null, learnTimer;
const SETTING_TEXTS = [
  ['styleGuide', 'Style guide', 'Learned from your sent WhatsApp messages and emails. Edit freely: every draft follows this text.', 18],
  ['draftPrompt', 'Follow-up prompt', 'Instructions for every draft. The client, task, conversation, earlier drafts, style guide and templates are added after it.', 14],
  ['stylePrompt', 'Style-learning prompt', 'Used by Learn my style. Your reply pairs, follow-ups and measured stats are added before it.', 14],
];

async function loadSettings() {
  try { settings = await api('/api/settings'); }
  catch (e) { $('#settings').innerHTML = `<p class="err">Could not load settings: ${esc(e.message)}</p>`; return; }
  renderSettings();
  if (settings.learning.running) pollLearn();
}

const settingValue = (key) => settings[key] || settings.defaults[key] || '';
function renderLearn() {
  const l = settings.learning, el = $('#learn-info'), btn = $('#learn');
  if (!el) return;
  btn.setAttribute('aria-disabled', l.running);
  btn.lastChild.textContent = l.running ? `Learning from ${l.count} messages…` : 'Learn my style';
  $('[data-setting=styleGuide]').readOnly = l.running;
  el.className = l.error ? 'err' : 'info';
  el.textContent = l.error ? `Learning failed: ${l.error}. Your guide wasn't changed.`
    : settings.styleLearnedAt ? `Learned ${fullDate(new Date(settings.styleLearnedAt))} from ${settings.styleCount} of your messages.`
    : 'Not learned yet. Press Learn my style (takes a minute or two).';
}

function renderSettings() {
  const field = ([key, label, hint, rows]) => `<fieldset class="fields">
    <div class="lrow"><label for="set-${key}">${label}</label><span class="tstatus" id="st-${key}"></span>
      ${key === 'styleGuide' ? `<button type="button" class="btn" id="learn">${icon('regen')}<span>Learn my style</span></button>`
        : `<button type="button" class="quiet" data-reset="${key}"${settings[key] ? '' : ' hidden'}>Reset to default</button>`}</div>
    <textarea class="input" id="set-${key}" data-setting="${key}" rows="${rows}">${esc(settingValue(key))}</textarea>
    ${key === 'styleGuide' ? '<p id="learn-info" role="status"></p>' : ''}<p class="info">${hint}</p></fieldset>`;
  $('#settings').innerHTML = `<h1>Settings</h1>
    <fieldset class="fields"><legend>AI</legend><div class="field"><span>Model</span><span class="filters" role="group" aria-label="Model">${settings.models
      .map((m) => `<button type="button" data-model="${m}" aria-pressed="${settings.model === m}">${m[0].toUpperCase() + m.slice(1)}</button>`).join('')}</span>
      <span class="tstatus" id="st-model"></span></div></fieldset>
    ${SETTING_TEXTS.map(field).join('')}`;
  renderLearn();
}

const settingTimers = {};
function saveSetting(key, value) {
  const status = (t, bad) => { const el = $(`#st-${key}`); if (el) { el.textContent = t; el.classList.toggle('bad', !!bad); } };
  status('Saving…');
  clearTimeout(settingTimers[key]);
  settingTimers[key] = setTimeout(async () => {
    // A prompt equal to the default is saved empty, so it follows future defaults.
    const v = value === settings.defaults[key] ? '' : value;
    try {
      settings = { ...(await api('/api/settings', { method: 'PUT', headers: JSON_HEADERS, body: JSON.stringify({ [key]: v }) })), learning: settings.learning };
      status('Saved'); setTimeout(() => status(''), 2000);
      const reset = document.querySelector(`[data-reset=${key}]`);
      if (reset) reset.hidden = !settings[key];
    } catch (e) { status(`Not saved: ${e.message}`, true); }
  }, key === 'model' ? 0 : 600);
}

async function pollLearn() {
  clearTimeout(learnTimer);
  try { settings.learning = await api('/api/settings/learn'); } catch (e) { settings.learning = { running: false, error: e.message }; }
  if (settings.learning.running) { renderLearn(); learnTimer = setTimeout(pollLearn, 2000); return; }
  const learning = settings.learning;
  settings = { ...(await api('/api/settings')), learning };
  if (section === 'settings') { renderSettings(); $('#announce').textContent = learning.error ? 'Learning failed' : 'Style guide updated'; }
}

$('#settings').addEventListener('input', (e) => {
  const key = e.target.dataset.setting;
  if (key) saveSetting(key, e.target.value);
});
$('#settings').addEventListener('click', async (e) => {
  const m = e.target.closest('[data-model]');
  if (m) {
    document.querySelectorAll('[data-model]').forEach((x) => x.setAttribute('aria-pressed', x === m));
    return saveSetting('model', m.dataset.model);
  }
  const reset = e.target.closest('[data-reset]');
  if (reset) {
    const key = reset.dataset.reset;
    $(`#set-${key}`).value = settings.defaults[key];
    saveSetting(key, settings.defaults[key]);
    $(`#set-${key}`).focus();
    return ($('#announce').textContent = 'Prompt reset to default');
  }
  const learn = e.target.closest('#learn');
  if (learn && learn.getAttribute('aria-disabled') !== 'true') {
    if (settings.styleGuide && !learn.dataset.armed) {
      learn.dataset.armed = '1'; learn.lastChild.textContent = 'Replace the guide? Click again';
      return setTimeout(() => { if (settings && section === 'settings') renderLearn(); delete learn.dataset.armed; }, 4000);
    }
    settings.learning = await api('/api/settings/learn', { method: 'POST' });
    $('#announce').textContent = 'Learning your style';
    renderLearn();
    if (settings.learning.running) learnTimer = setTimeout(pollLearn, 2000);
  }
});
addEventListener('pagehide', () => { for (const t of Object.values(settingTimers)) clearTimeout(t); });

// ---- sections (the last one is remembered per browser)
const SECTIONS = ['tasks', 'requests', 'templates', 'settings'];
let section = 'tasks';
function showSection(name, focus = false) {
  section = name;
  for (const s of SECTIONS) {
    $(`#view-${s}`).hidden = s !== name;
    const link = document.querySelector(`.rail [data-section="${s}"]`);
    if (s === name) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
  }
  try { localStorage.setItem('section', name); } catch {}
  history.replaceState(null, '', `#${name}`);
  if (name === 'templates') loadTemplates();
  if (name === 'requests') { loadTemplates(); loadRequests(); }
  if (name === 'settings') loadSettings();
  const search = { tasks: '#q', templates: '#tq' }[name];
  if (focus && search) $(search).focus();
}
$('.rail').addEventListener('click', (e) => {
  const a = e.target.closest('[data-section]');
  if (a) { e.preventDefault(); showSection(a.dataset.section); }
});

// ---- templates: list + editor; placeholder values stay in memory and carry
// over between templates (fill JMENO once, use it in every template).
let tpls = null, tsel = null, pane = 'list', preview = false, gender = 'female', fieldsKey = '';
const values = {};                   // NAME -> { value, include }
const dirty = new Set();             // template ids waiting to be saved
let saveTimer, statusTimer, delTimer;
const currentTpl = () => tpls?.find((t) => t.id === tsel);
const JSON_HEADERS = { 'Content-Type': 'application/json' };

async function loadTemplates() {
  if (tpls) return;
  try { tpls = (await api('/api/templates')).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)); }
  catch (e) { $('#tlist').innerHTML = `<li class="empty err">Could not load templates: ${esc(e.message)}</li>`; return; }
  tsel = tpls[0]?.id ?? null;
  renderTList(); renderEditor();
}

const tmatch = (t, q) => !q || `${t.name}\n${t.subject}\n${htmlToText(t.bodyHtml)}`.toLowerCase().includes(q);
const renderTRow = (t) => `<li><button type="button" class="trow" data-tid="${esc(t.id)}"${t.id === tsel ? ' aria-current="true"' : ''}>
  <span class="tn">${esc(t.name || 'Untitled')}</span>${t.subject ? `<span class="ts">${esc(t.subject)}</span>` : ''}</button></li>`;

function renderTList() {
  if (!tpls) return;
  const q = $('#tq').value.trim().toLowerCase();
  const rows = tpls.filter((t) => tmatch(t, q));
  $('#tlist').innerHTML = rows.length ? rows.map(renderTRow).join('')
    : `<li class="empty">${q ? `No match for “${esc(q)}”` : 'No templates yet. Press + to add one.'}</li>`;
}

const TOOLS = [['bold', '<b>B</b>', 'Bold'], ['italic', '<i>I</i>', 'Italic'], ['h2', 'H2', 'Heading'],
  ['insertUnorderedList', '•', 'Bulleted list'], ['insertOrderedList', '1.', 'Numbered list'], ['link', 'Link', 'Link']];

function renderEditor() {
  const t = currentTpl(), ed = $('#editor');
  $('#tsplit').dataset.pane = t ? pane : 'list';
  preview = false; fieldsKey = '';
  if (!t) { ed.innerHTML = `<p class="empty">${tpls.length ? 'Pick a template.' : 'No templates yet.'}</p>`; return; }
  ed.classList.remove('preview');
  ed.innerHTML = `<button type="button" class="link back" data-act="back">‹ Templates</button>
    <div class="ehead">
      <input class="input tname" id="tname" aria-label="Template name" placeholder="Untitled">
      <span class="tstatus" id="tstatus"></span>
      <button type="button" class="quiet" data-act="dup">Duplicate</button>
      <span id="tdel">${renderDelete(false)}</span>
    </div>
    <input class="input tsubj" id="tsubj" aria-label="Subject" placeholder="Subject">
    <div class="actions">
      <button type="button" class="btn" data-act="copy-subject">Copy subject</button>
      <button type="button" class="btn primary" data-act="copy-body">Copy body</button>
      <button type="button" class="btn" data-act="preview" aria-pressed="false">Preview</button>
    </div>
    <div id="tfields"></div>
    <div class="toolbar" role="toolbar" aria-label="Formatting">
      ${TOOLS.map(([cmd, label, title]) => `<button type="button" class="btn sm" data-cmd="${cmd}" title="${title}" aria-label="${title}">${label}</button>`).join('')}
      <input type="url" class="input" id="tlink" aria-label="Link address" placeholder="https://…  (Enter)" hidden>
    </div>
    <div class="tbody" id="tbody" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Body"></div>`;
  $('#tname').value = t.name; $('#tsubj').value = t.subject; $('#tbody').innerHTML = t.bodyHtml;
  syncFields();
}

const renderDelete = (asking) => asking
  ? `Delete? <button type="button" class="quiet danger" data-act="del-yes">Delete</button><button type="button" class="quiet" data-act="del-no">Cancel</button>`
  : `<button type="button" class="quiet" data-act="del">Delete</button>`;

function renderFields(names, withGender) {
  if (!names.length && !withGender) return '';
  const rows = names.map((n, i) => {
    const v = values[n] ??= { value: '', include: true };
    return `<div class="field${v.include ? '' : ' off'}">
      <label for="f-${i}" title="${esc(n)}">${esc(n)}</label>
      <input class="input" id="f-${i}" data-field="${esc(n)}" value="${esc(v.value)}"${v.include ? '' : ' disabled'}>
      <label class="inc"><input type="checkbox" data-include="${esc(n)}"${v.include ? ' checked' : ''}> Include</label></div>`;
  });
  if (withGender) rows.push(`<div class="field"><span>Gender</span><span class="filters">${[['female', 'Female'], ['male', 'Male']]
    .map(([g, l]) => `<button type="button" data-gender="${g}" aria-pressed="${gender === g}">${l}</button>`).join('')}</span></div>`);
  return `<fieldset class="fields"><legend>Fields</legend>${rows.join('')}</fieldset>`;
}

// Re-renders the fields panel only when the set of placeholders changes.
function syncFields() {
  const t = currentTpl(), names = placeholders(t.subject, t.bodyHtml), g = hasGender(t.subject, t.bodyHtml);
  const key = JSON.stringify([names, g]);
  if (key !== fieldsKey) { fieldsKey = key; $('#tfields').innerHTML = renderFields(names, g); }
}

function setPreview(on) {
  const t = currentTpl();
  preview = on;
  $('#editor').classList.toggle('preview', on);
  $('[data-act=preview]').setAttribute('aria-pressed', on);
  $('#tsubj').readOnly = on;
  $('#tbody').contentEditable = String(!on);
  $('.toolbar').hidden = on;
  $('#tsubj').value = on ? resolve(t.subject, values, gender) : t.subject;
  $('#tbody').innerHTML = on ? resolve(t.bodyHtml, values, gender, true) : t.bodyHtml;
}

function tstatus(text, bad = false) {
  const el = $('#tstatus');
  clearTimeout(statusTimer);
  if (!el) return;
  el.textContent = text; el.classList.toggle('bad', bad);
  if (text === 'Saved') statusTimer = setTimeout(() => { el.textContent = ''; }, 2000);
}

function scheduleSave() {
  dirty.add(tsel); tstatus('Saving…');
  clearTimeout(saveTimer); saveTimer = setTimeout(flushSaves, 600);
}
async function flushSaves(keepalive = false) {
  clearTimeout(saveTimer);
  for (const id of [...dirty]) {
    dirty.delete(id);
    const t = tpls.find((x) => x.id === id);
    if (!t) continue;
    try {
      const saved = await api(`/api/templates/${encodeURIComponent(id)}`, { method: 'PUT', headers: JSON_HEADERS, keepalive,
        body: JSON.stringify({ name: t.name, subject: t.subject, bodyHtml: t.bodyHtml }) });
      t.updatedAt = saved.updatedAt; // keep local text: it may have changed while saving
      if (id === tsel) tstatus('Saved');
    } catch (e) { dirty.add(id); if (id === tsel) tstatus(`Not saved: ${e.message}`, true); }
  }
}

function selectTpl(id, toEditor = false) {
  tsel = id;
  if (toEditor) pane = 'editor';
  renderTList(); renderEditor();
}

async function addTemplate(fields, after) {
  try {
    const t = await api('/api/templates', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(fields) });
    tpls.splice(after < 0 ? 0 : after + 1, 0, t);
    $('#tq').value = '';
    selectTpl(t.id, true);
    $('#tname').focus(); $('#tname').select();
    $('#announce').textContent = 'Template created';
  } catch (e) { $('#announce').textContent = `Could not create the template: ${e.message}`; }
}
async function newTemplate() {
  if (section !== 'templates') showSection('templates');
  await loadTemplates();
  if (tpls) addTemplate({ name: '', subject: '', bodyHtml: '' }, -1);
}

async function deleteTpl() {
  const id = tsel;
  try { await api(`/api/templates/${encodeURIComponent(id)}`, { method: 'DELETE' }); }
  catch (e) { return tstatus(`Not deleted: ${e.message}`, true); }
  const q = $('#tq').value.trim().toLowerCase();
  const visible = tpls.filter((t) => tmatch(t, q)), i = visible.findIndex((t) => t.id === id);
  dirty.delete(id);
  tpls = tpls.filter((t) => t.id !== id);
  const next = visible.filter((t) => t.id !== id)[Math.min(i, visible.length - 2)];
  pane = 'list';
  selectTpl(next?.id ?? null);
  $('#announce').textContent = 'Template deleted';
  document.querySelector('.trow[aria-current]')?.focus();
}

function askDelete(asking) {
  clearTimeout(delTimer);
  $('#tdel').innerHTML = renderDelete(asking);
  $(asking ? '[data-act=del-no]' : '[data-act=del]').focus();
  if (asking) delTimer = setTimeout(() => { if ($('#tdel')) $('#tdel').innerHTML = renderDelete(false); }, 5000);
}

// Copies HTML (with a plain-text fallback) or just text. The copy event runs
// inside the click, which WebKit allows; the async clipboard API is the backup.
async function copyRich(text, html) {
  const onCopy = (e) => {
    e.clipboardData.setData('text/plain', text);
    if (html) e.clipboardData.setData('text/html', html);
    e.preventDefault();
  };
  document.addEventListener('copy', onCopy);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.removeEventListener('copy', onCopy);
  if (ok) return true;
  try {
    const item = { 'text/plain': new Blob([text], { type: 'text/plain' }) };
    if (html) item['text/html'] = new Blob([html], { type: 'text/html' });
    await navigator.clipboard.write([new ClipboardItem(item)]);
    return true;
  } catch { return false; }
}

async function copyPart(btn, part) {
  const t = currentTpl();
  const ok = part === 'subject' ? await copyRich(resolve(t.subject, values, gender))
    : await copyRich(htmlToText(resolve(t.bodyHtml, values, gender, true)), resolve(t.bodyHtml, values, gender, true));
  const label = btn.textContent;
  btn.style.minWidth = `${btn.offsetWidth}px`;
  btn.textContent = ok ? 'Copied' : 'Copy failed';
