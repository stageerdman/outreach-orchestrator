<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6a65; --line: #e6e5e0;
    --accent: #2f5bd3; --email: #2f5bd3; --wa: #1f7f50; --me: #eef2fd; --sel: #eef2fd; --err: #b3261e;
    --draft-row: color-mix(in srgb, var(--accent) 9%, transparent); /* rows with an AI draft waiting */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --measure: 720px; --fs-xl: 22px; /* reading width, the largest type (You) */
    --fs-sm: 12px; --fs: 14px; --fs-lg: 16px; --radius: 6px; --width: 860px; --gh: 32px;
    --rail: 72px; --list-w: 280px; --feed-w: 380px; --feed-min: 240px; --feed-max: 640px; --chat-min: 360px; --icon: 20px; --hit: 28px; --badge: 16px;
    /* Fronta group colours (A, B; C is a hollow dot) and the gray of an AI draft */
    --q-a: var(--st-7); --q-b: var(--st-1); --draft: color-mix(in srgb, var(--muted) 14%, var(--bg));
    /* Draft buttons: send (green) and discard (red) circles */
    --ok: var(--wa);
    /* Pipeline stage colours, top stage first (each ≥4.5:1 on bg, panel and sel) */
    --st-1: #1a7a45; --st-2: #0e7480; --st-3: #8a6a00; --st-4: #b8461b; --st-5: #1f6aa5;
    --st-6: #5a52c4; --st-7: #8b47ad; --st-8: #776c60; --st-9: #646c78;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #a3a29c; --line: #33322f;
      --accent: #7b9cf2; --email: #7b9cf2; --wa: #4cc28a; --me: #252c40; --sel: #252c40; --err: #ff8a80;
      --st-1: #5cc98f; --st-2: #45bccb; --st-3: #d9b440; --st-4: #ff8a5c; --st-5: #5fb0ea;
      --st-6: #a39af2; --st-7: #cf92e8; --st-8: #ab9f92; --st-9: #959ca8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: var(--fs)/1.45 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
    height: 100vh; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }
  [hidden] { display: none !important; }
  .view { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Section rail: one link per section */
  .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s1); padding: var(--s2) 0; }
  .rail a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--s2) var(--s1);
    color: var(--muted); text-decoration: none; font-size: var(--fs-sm); }
  .rail a:hover { background: var(--sel); color: var(--text); }
  .rail a[aria-current] { color: var(--accent); background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .rail a:focus-visible { outline-offset: -2px; }
  .rail svg { width: var(--icon); height: var(--icon); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { width: 100%; max-width: var(--width); margin: 0 auto; }

  /* Header: title, last update, refresh, search, source status */
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: var(--s3) var(--s4); }
  .bar { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
  h1 { font-size: var(--fs-lg); margin: 0; flex: 1; }
  #updated { color: var(--muted); font-size: var(--fs-sm); }
  #refresh[aria-disabled=true] { cursor: progress; }
  h1 .n { color: var(--muted); font-size: var(--fs-sm); font-weight: 400; margin-left: var(--s1); }
  input[type=search] { width: 100%; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--bg); color: var(--text); font: inherit; }
  .status { margin-top: var(--s2); font-size: var(--fs-sm); color: var(--muted); display: flex; gap: var(--s3); flex-wrap: wrap; }
  .status .bad { color: var(--err); max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: var(--s1); border: 1px solid var(--muted); }
  .dot.on { background: var(--wa); border-color: var(--wa); }
  .dot.bad { background: var(--err); border-color: var(--err); }
  .dot.ready { background: var(--accent); border-color: var(--accent); }
  .name .dot, .name .spin { margin: 0 0 0 var(--s2); vertical-align: middle; } .name .spin { color: var(--muted); }

  /* Task feed: Fronta's groups, one row per person; the selected one is open in the chat */
  main { flex: 1; overflow-y: auto; min-height: 0; }
  .group + .group { margin-top: var(--s1); }
  .group h2 { position: sticky; top: 0; z-index: 2; margin: 0; height: var(--gh); padding: 0 var(--s2) 0 var(--s4); display: flex; align-items: center; gap: var(--s2);
    background: var(--bg); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .group h2 .over { color: var(--err); }
  .gt { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--s2); flex: 1; min-width: 0; height: 100%; cursor: pointer; }
  .gt:hover .label { color: var(--text); }
  .gt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { transition: transform .15s; } .gt[aria-expanded=true] .chev { transform: rotate(90deg); }
  .sd { width: 8px; height: 8px; border-radius: 50%; background: var(--st); flex: none; }
  .sd.c { background: none; border: 1px solid var(--muted); }
  .stage { color: var(--st); }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .rows { list-style: none; margin: 0; padding: 0; background: var(--panel); }
  .head { position: relative; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--panel); scroll-margin-top: var(--gh); }
  .head:hover { background: var(--sel); }
  .head:has(> .row[aria-current]) { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  /* The row button covers the whole head (click anywhere); copy buttons sit above it. */
  .row { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; gap: var(--s3); cursor: pointer; }
  .row::after { content: ""; position: absolute; inset: 0; }
  .row:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
  .name { font-weight: 600; }
  .due { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
  .due.now { color: var(--text); }
  .due svg { width: var(--fs); height: var(--fs); vertical-align: -2px; margin-right: 2px; }
  .contact, .task { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task b { color: var(--text); font-weight: 600; }
  .copy { all: unset; position: relative; z-index: 1; color: var(--text); cursor: copy; border-radius: var(--radius); }
  .copy:hover { color: var(--accent); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .err { color: var(--err); font-size: var(--fs-sm); margin: 0; }
  .empty { color: var(--muted); padding: var(--s5); text-align: center; margin: 0; }
  .count { color: var(--muted); font-size: var(--fs-sm); padding: var(--s2) var(--s4); margin: 0; }

  .info { color: var(--muted); font-size: var(--fs-sm); margin: 0; }
  .filters { display: flex; gap: var(--s1); }
  .filters button { font: inherit; font-size: var(--fs-sm); padding: 2px var(--s3); border-radius: 99px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer; }
  .filters button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .msgs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s2); }
  .day { color: var(--muted); font-size: var(--fs-sm); font-weight: 400; margin: var(--s2) 0 0; }
  .note { margin: 0; font-size: var(--fs-sm); white-space: pre-wrap; overflow-wrap: anywhere; }
  .note b { font-weight: 600; }
  .msg { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--email); border-radius: var(--radius);
    padding: var(--s2) var(--s3); max-width: 85%; }
  .msg.whatsapp { border-left-color: var(--wa); }
  .msgs > li { display: flex; flex-direction: column; align-items: flex-start; }
  li.me { align-items: flex-end; } li.me .msg { background: var(--me); }
  .meta { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--s1); }
  .subject { font-weight: 600; margin-bottom: var(--s1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .body.clamp { max-height: 9.5em; overflow: hidden; }
  .link { all: unset; color: var(--accent); font-size: var(--fs-sm); cursor: pointer; margin-top: var(--s1); align-self: flex-start; }
  .link:focus-visible { outline: 2px solid var(--accent); }

  /* AI: icon buttons, spinner, the draft button on task rows, badges */
  .ib { all: unset; box-sizing: border-box; display: inline-grid; place-items: center; width: var(--hit); height: var(--hit); flex: none;
    border-radius: var(--radius); color: var(--muted); cursor: pointer; }
  .ib:hover { color: var(--text); background: var(--sel); }
  .ib:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ib[aria-disabled=true], .btn[aria-disabled=true] { opacity: .45; cursor: default; }
  .ib svg, .btn svg { width: var(--icon); height: var(--icon); }
  .btn svg { width: var(--fs-lg); height: var(--fs-lg); vertical-align: -3px; margin-right: var(--s1); }
  .btn.sm svg { width: var(--fs); height: var(--fs); }
  .spin { animation: spin .8s linear infinite; width: 1em; height: 1em; vertical-align: -0.125em; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .ib[aria-pressed=true] { color: var(--accent); background: var(--sel); }
  .gai { flex: none; font-variant-numeric: tabular-nums; }
  .pill { all: unset; position: relative; z-index: 1; cursor: pointer; font-size: var(--fs-sm); font-weight: 600; color: var(--accent);
    border: 1px solid currentColor; border-radius: 99px; padding: 0 var(--s2); }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rail a { position: relative; }
  .count-badge { position: absolute; top: 2px; right: 10px; min-width: var(--badge); height: var(--badge); padding: 0 var(--s1); border-radius: 99px;
    background: var(--accent); color: var(--panel); font-size: var(--fs-sm); line-height: var(--badge); text-align: center; font-weight: 600; }
  .count-badge.bad { background: var(--err); }

  /* cards (Playbooks changes) */
  .card { position: relative; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); background: var(--panel);
    box-shadow: inset 3px 0 var(--st, var(--line)); display: flex; flex-direction: column; gap: var(--s2); }
  .card h3 { margin: 0; font-size: var(--fs); display: flex; justify-content: space-between; gap: var(--s3); }
  .card .task { white-space: normal; }
  .why { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
  .brief { margin: 0; padding: var(--s2) var(--s3); background: var(--bg); border-radius: var(--radius); white-space: pre-wrap; }
  textarea.input { width: 100%; resize: vertical; line-height: 1.45; }
  .ractions { display: flex; align-items: center; gap: var(--s1); }
  .ractions .cancel { margin-left: auto; }
  .card.past { box-shadow: inset 3px 0 var(--line); }
  .working { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--fs-sm); }
  .btn.danger { background: var(--err); border-color: var(--err); color: var(--panel); }

  /* Settings */
  .settings { flex: 1; min-height: 0; }
  .settings .fields { gap: var(--s3); }
  .lrow { display: flex; align-items: center; gap: var(--s2); }
  .lrow label { font-weight: 600; flex: 1; }

  /* Templates: list on the left, editor on the right */
  .tsplit { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--list-w) minmax(0, 1fr); }
  .tlist { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
  .tbar { display: flex; gap: var(--s2); padding: var(--s3); border-bottom: 1px solid var(--line); }
  #tlist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .trow { all: unset; box-sizing: border-box; display: block; width: 100%; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); cursor: pointer; }
  .trow:hover { background: var(--sel); }
  .trow[aria-current] { background: var(--sel); box-shadow: inset 3px 0 var(--accent); }
  .trow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tn, .ts { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tn { font-weight: 600; } .ts { color: var(--muted); font-size: var(--fs-sm); }
  .editor { overflow-y: auto; padding: var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
  .editor > * { width: 100%; max-width: var(--width); }
  .ehead { display: flex; align-items: center; gap: var(--s2); }
  .input { font: inherit; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); min-width: 0; }
  .tname { flex: 1; font-size: var(--fs-lg); font-weight: 600; padding: var(--s1) var(--s2); border-color: transparent; background: transparent; }
  .tname:hover, .tname:focus { border-color: var(--line); }
  .tstatus { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; } .tstatus.bad { color: var(--err); }
  .btn { font: inherit; padding: var(--s1) var(--s3); border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .btn[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .btn.sm { font-size: var(--fs-sm); padding: 2px var(--s2); }
  .quiet { all: unset; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; padding: var(--s1) var(--s2); border-radius: var(--radius); white-space: nowrap; }
  .quiet:hover { color: var(--text); } .quiet.danger { color: var(--err); font-weight: 600; }
  .quiet:focus-visible { outline: 2px solid var(--accent); }
  .actions { position: sticky; top: calc(-1 * var(--s4)); z-index: 1; display: flex; gap: var(--s2); padding: var(--s2) 0; background: var(--bg); }
  .fields { margin: 0; padding: var(--s3); display: grid; gap: var(--s2); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .fields legend { font-size: var(--fs-sm); font-weight: 600; color: var(--muted); padding: 0 var(--s1); }
  .field { display: grid; grid-template-columns: 11em minmax(0, 1fr) auto; align-items: center; gap: var(--s3); }
  .field > :first-child { font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .field.off > :first-child { color: var(--muted); text-decoration: line-through; }
  .inc { font-size: var(--fs-sm); color: var(--muted); display: flex; gap: var(--s1); align-items: center; }
  .toolbar { display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; }
  .tbody { min-height: 16em; padding: var(--s3) var(--s4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow-wrap: anywhere; }
  .tbody h2 { font-size: var(--fs-lg); }
  .preview .tbody, .preview .tsubj { background: var(--bg); }
  /* Playbooks: list of strategies on the left, one playbook (or the learning log) on the right */
  .pgh { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s3) var(--s1); font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .pdots { display: inline-flex; gap: 2px; margin-left: var(--s1); vertical-align: middle; }
  .pcoach { padding: 0 var(--s3) var(--s2); font-size: var(--fs-sm); color: var(--muted); display: flex; align-items: center; gap: var(--s1); }
  .pcoach .bad, .rcoach.bad { color: var(--err); }
  .pcoach:empty { display: none; }
  .ph { margin: var(--s3) 0 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
  .steps, .lessons, .resps, .changes { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
  .step { padding: var(--s3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: var(--s1); }
  .step:focus-within { border-color: var(--accent); }
  .shead { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); flex-wrap: wrap; }
  .snum { font-weight: 600; min-width: var(--badge); }
  .shead select, .shead input { font-size: var(--fs-sm); padding: 2px var(--s2); }
  .shead input { width: 4.5em; }
  .sact { margin-left: auto; display: flex; gap: var(--s1); }
  .sact .ib { width: var(--badge); height: var(--badge); }
  .pt { flex: none; width: 100%; resize: none; field-sizing: content; min-height: 0; border-color: transparent; background: transparent; padding: var(--s1) var(--s2); line-height: 1.45; }
  .pt:hover, .pt:focus { border-color: var(--line); }
  .pt.strong { font-weight: 600; }
  .swhy, .lessons .pt { color: var(--muted); font-size: var(--fs-sm); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
  .chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-size: var(--fs-sm); }
  .chip button { all: unset; cursor: pointer; padding: 2px var(--s2); }
  .chip button:hover { color: var(--accent); }
  .chip button:focus-visible { outline: 2px solid var(--accent); }
  .chip .x { padding: 2px var(--s1); color: var(--muted); }
  .chip.missing { color: var(--muted); text-decoration: line-through; }
  .chips select { font-size: var(--fs-sm); padding: 2px var(--s2); max-width: 14em; }
  .lrow2 { display: flex; gap: var(--s1); align-items: flex-start; }
  .ops { margin: 0; padding-left: var(--s4); display: grid; gap: var(--s1); font-size: var(--fs-sm); }
  .ops details { margin-top: var(--s1); }
  .ops summary { color: var(--accent); cursor: pointer; }
  .card.undone h3 .name { text-decoration: line-through; color: var(--muted); }
  #plist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .back { display: none; }

  /* Messages and Tasks: a list, and the chat column on the right */
  .csplit { --list-w: clamp(var(--feed-min), var(--feed-w), min(var(--feed-max), 100vw - var(--rail) - var(--chat-min))); }
  .csplit > .tlist { position: relative; }
  .gutter { position: absolute; top: 0; bottom: 0; right: calc(-1 * var(--s1)); width: var(--s2); z-index: 3; cursor: col-resize; touch-action: none; }
  .gutter::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(var(--s1) - 1px); width: 2px; }
  .gutter:hover::after, .gutter:focus-visible::after, .resizing .gutter::after { background: var(--accent); }
  .gutter:focus-visible { outline: none; }
  .resizing { cursor: col-resize; user-select: none; }
  .csplit > .tlist > header { border-bottom: 1px solid var(--line); }
  .csplit .bar { margin-bottom: var(--s2); flex-wrap: wrap; row-gap: var(--s1); }
  #clist { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .crow { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s2); align-items: center;
    padding: var(--s2) var(--s3) var(--s2) var(--s4); border-bottom: 1px solid var(--line); cursor: pointer; }
  .crow:hover, .crow[aria-current] { background: var(--sel); } .crow[aria-current] { box-shadow: inset 3px 0 var(--accent); }
  .crow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .crow .tn { font-weight: 600; }
  .when { color: var(--muted); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
  .crow.unread .when { color: var(--wa); font-weight: 600; }
  .cn { display: flex; align-items: center; gap: var(--s1); min-width: 0; }
  .cn > * { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; } .cn .sd { margin-left: var(--s1); }
  .prev { color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crow.unread .prev .t { color: var(--text); font-weight: 600; }
  .crow.draft { background: var(--draft-row); } .crow.draft:hover, .crow.draft[aria-current] { background: var(--sel); }
  .prev .dl { color: var(--accent); font-weight: 600; } .prev .dl.bad { color: var(--err); }

<script type="module">
import { placeholders, hasGender, resolve, htmlToText } from '/resolve.js';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHANNELS = { email: 'Email', whatsapp: 'WhatsApp' };
const RECENT = 50;

// App state. One chat is open at a time, shared by Messages and Tasks.
let sources = {}, sync = { running: false, at: null, errors: {} }, people = [], chats = [], chatsLoaded = false, chatsError = '';
const collapsed = new Set(['LEADY KOLEGŮ']); // Fronta groups the user closed; teammates' leads start closed
const hist = new Map();     // id -> history from the current snapshot
const sel = { messages: null, tasks: null }; // the selected person per list
let live = true, liveDownAt = null;          // the event stream (GET /api/events)
const announce = (t) => { $('#announce').textContent = t; };
const enc = encodeURIComponent;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

// ---- time formatting
const fullDate = (d) => d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function ago(at) {
  const d = new Date(at), mins = (Date.now() - d) / 6e4;
  if (mins < 1) return 'now';
  if (mins < 60) return `${Math.floor(mins)}m`;
  if (mins < 1440) return `${Math.floor(mins / 60)}h`;
  if (mins < 10080) return `${Math.floor(mins / 1440)}d`;
  return d.toLocaleDateString(undefined, d.getFullYear() === new Date().getFullYear()
    ? { day: 'numeric', month: 'short' } : { month: 'short', year: 'numeric' });
}
const timeTag = (at, label) => `<time datetime="${esc(at)}" title="${esc(fullDate(new Date(at)))}">${esc(label)}</time>`;
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const thisYear = (at) => new Date(at).getFullYear() === new Date().getFullYear();
const hhmm = (at) => new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
// Chat list times, WhatsApp style: 14:32, Yesterday, Mon, 12 Nov, 12/11/2025.
function chatTime(at) {
  if (sameDay(at, Date.now())) return hhmm(at);
  if (sameDay(at, Date.now() - 864e5)) return 'Yesterday';
  if (Date.now() - new Date(at) < 6 * 864e5) return new Date(at).toLocaleDateString(undefined, { weekday: 'short' });
  return new Date(at).toLocaleDateString(undefined, thisYear(at) ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'numeric', year: 'numeric' });
}
const dayLabel = (at) => (sameDay(at, Date.now()) ? 'Today' : sameDay(at, Date.now() - 864e5) ? 'Yesterday'
  : new Date(at).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', ...(thisYear(at) ? {} : { year: 'numeric' }) }));

// ---- header and source status
// The status line only shows what's off: a failed or unconnected source,
// sample data, or live updates down for more than 30 s.
function renderSourceStatus(el) {
  const e = sync.errors || {};
  const bad = (t) => `<span class="bad" title="${esc(t)}"><span class="dot bad"></span>${esc(t)}</span>`;
  const off = (t) => `<span><span class="dot"></span>${esc(t)}</span>`;
  const items = [
    e.crm && bad(`CRM failed: ${e.crm}${sync.at ? ' — showing the last list' : ''}`),
    sources.people && sources.people !== 'crm' && off('People: sample data'),
    ...Object.entries(CHANNELS).map(([k, label]) => (e[k] ? bad(`${label} failed: ${e[k]}`) : sources[k] === false ? off(`${label} off`) : '')),
    !live && Date.now() - liveDownAt > 30e3 && bad('Live updates paused, reconnecting…'),
  ].filter(Boolean);
  el.innerHTML = items.join('');
  el.hidden = !items.length;
}

// "Updating" lasts until the CRM and WhatsApp are in; email merges in after.
const updating = () => sync.running && sync.stage !== 'email';
function renderHeader() {
  const btn = $('#refresh'), busy = updating(), u = $('#updated');
  btn.setAttribute('aria-disabled', busy);
  btn.innerHTML = busy ? SPIN : icon('regen');
  if (busy) u.textContent = 'Updating…';
  else if (sync.at) {
    const mins = Math.floor((Date.now() - new Date(sync.at)) / 6e4);
    u.dateTime = sync.at; u.title = fullDate(new Date(sync.at));
    u.textContent = `Updated ${mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : `${Math.floor(mins / 60)} h ago`}`;
  }
  renderSourceStatus($('#status')); renderSourceStatus($('#mstatus'));
}

// ---- task feed: Fronta's list, in Fronta's groups and order
const KIND = { call: 'Call', followup: 'Follow up', confirm: 'Confirm consultation', splatka: 'Installment' };
const OTHER = { rank: 99, label: 'Other' };
// The six categories (rank 1–6, lib/resultson.js STAGES) keep their former stages' colours.
const ST_VAR = [1, 3, 4, 6, 8, 9];
const stageColor = (rank) => (ST_VAR[rank - 1] ? `var(--st-${ST_VAR[rank - 1]})` : 'var(--muted)');
const Q_COLOR = { A: 'var(--q-a)', B: 'var(--q-b)' };
// Already messaged today (Prague day), from the history or a draft sent from
// the app since: Fronta still lists the task, but it's done for today
// unless the client wrote back after it.
const pragueDay = (at) => new Date(at).toLocaleDateString('sv-SE', { timeZone: 'Europe/Prague' });
function messagedToday(p) {
  const sent = requests.filter((r) => r.personId === p.id && ['sent', 'done'].includes(r.status)).map((r) => r.updatedAt);
  const last = [p.lastSentAt, ...sent].filter(Boolean).sort().at(-1);
  return Boolean(last) && pragueDay(last) === pragueDay(Date.now()) && !(p.lastClientAt && p.lastClientAt > last);
}
// Search ignores case and accents ("triaz" finds TRIÁŽ).
const fold = (s) => String(s ?? '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const matches = (p, q) => !q || fold([p.name, p.company, p.queue?.group, p.stage?.label, p.task && KIND[p.task.kind], p.task?.rule, ...p.emails, ...p.phones].join(' ')).includes(q);

// "+420775623723" -> "+420 775 623 723"; other formats are shown as they are.
const showPhone = (ph) => String(ph).replace(/^\+(42[01])(\d{3})(\d{3})(\d{3})$/, '+$1 $2 $3 $4');

function dueLabel(at) {
  const d = new Date(at), mins = (d - Date.now()) / 6e4;
  if (mins < 0) {
    const a = -mins;
    return { over: true, text: 'overdue ' + (a < 60 ? `${Math.floor(a)}m` : a < 1440 ? `${Math.floor(a / 60)}h` : `${Math.floor(a / 1440)}d`) };
  }
  if (mins < 60) return { text: `in ${Math.ceil(mins)}m` };
  if (sameDay(d, Date.now())) return { text: `today ${hhmm(d)}` };
  if (sameDay(d, Date.now() + 864e5)) return { text: `tomorrow ${hhmm(d)}` };
  if (mins < 7 * 1440) return { text: `${d.toLocaleDateString(undefined, { weekday: 'short' })} ${hhmm(d)}` };
  return { text: d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) };
}

// Meeting rows: when the meeting is. Others: how long the task has been due.
function renderWhen(p) {
  const at = p.queue?.meetingAt;
  if (at) {
    const d = dueLabel(at), text = d.over ? (sameDay(at, Date.now()) ? `today ${hhmm(at)}` : chatTime(at)) : d.text;
    return `<time class="due${sameDay(at, Date.now()) ? ' now' : ''}" datetime="${esc(at)}" title="Meeting ${esc(fullDate(new Date(at)))}">${icon('cal')}${esc(text)}</time>`;
  }
  return p.task?.dueAt ? `<time class="due" datetime="${esc(p.task.dueAt)}" title="Due ${esc(fullDate(new Date(p.task.dueAt)))}">due ${esc(ago(p.task.dueAt))}</time>` : '';
}

const renderCopy = (value, shown, what) =>
  `<button type="button" class="copy" data-copy="${esc(value)}" data-what="${what}" aria-label="Copy ${what} ${esc(shown)}">${esc(shown)}</button>`;

function renderContact(p, withStage = true, id = '') {
  const parts = [withStage && p.stage && `<span class="stage" style="--st: ${stageColor(p.stage.rank)}">${esc(p.stage.label)}</span>`,
    p.phones[0] && renderCopy(p.phones[0].replace(/[^\d+]/g, ''), showPhone(p.phones[0]), 'phone'),
    p.emails[0] && renderCopy(p.emails[0], p.emails[0], 'email')].filter(Boolean);
  return parts.length ? `<p class="contact"${id ? ` id="${esc(id)}"` : ''}>${parts.join(' · ')}</p>` : '';
}

// A draft on the way for this person: a spinner, a dot when it waits, red when it failed.
function renderAiMark(p) {
  const r = activeReq(p.id);
  if (r?.status === 'generating') return `<span role="img" aria-label="AI drafting">${SPIN}</span>`;
  if (r?.status === 'pending') return `<span class="dot ready" role="img" aria-label="${r.kind === 'meeting' ? 'Meeting to offer' : 'Draft waiting'}"></span>`;
  if (r?.status === 'failed') return `<span class="dot bad" role="img" aria-label="AI draft failed" title="${esc(r.error)}"></span>`;
  return '';
}

const renderRow = (p) => `<li class="person"><div class="head">
    <button type="button" class="row" id="row-${esc(p.id)}" data-id="${esc(p.id)}"${sel.tasks === p.id ? ' aria-current="true"' : ''} aria-controls="chat" aria-describedby="contact-${esc(p.id)}">
      <span class="name">${esc(p.name)}${renderAiMark(p)}</span>${renderWhen(p)}</button>
    ${renderContact(p, true, `contact-${p.id}`)}</div></li>`;

// Fronta's groups in the order the server sends the rows (Fronta's order).
// Open unless the user closed them (or matching a search).
function renderGroups(rows, searching) {
  const groups = new Map();
  for (const p of rows) {
    const name = p.queue?.group || (p.stage || OTHER).label;
    if (!groups.has(name)) groups.set(name, { color: p.queue?.color, people: [] });
    groups.get(name).people.push(p);
  }
  return [...groups].map(([name, g], i) => {
    const isOpen = searching || !collapsed.has(name);
    return `<section class="group">
      <h2><button type="button" class="gt" data-group="${esc(name)}" aria-expanded="${isOpen}" aria-controls="g-${i}-rows">
        <span class="chev" aria-hidden="true">▸</span><span class="sd${Q_COLOR[g.color] ? '' : ' c'}" style="--st: ${Q_COLOR[g.color] || 'var(--muted)'}" aria-hidden="true"></span>
        <span class="label">${esc(name)}</span> <span>· ${g.people.length}</span>
      </button>${renderBatch(name, g)}</h2>
      <ul class="rows" id="g-${i}-rows"${isOpen ? '' : ' hidden'}>${isOpen ? g.people.map(renderRow).join('') : ''}</ul>
    </section>`;
  }).join('');
}

function renderList() {
  const list = $('#people');
  const current = people.filter((p) => !messagedToday(p)), done = people.length - current.length;
  $('#tcount').textContent = people.length ? current.length : '';
  if (!people.length) {
    list.innerHTML = `<p class="empty">${sync.running ? 'Loading tasks…' : sync.errors?.crm ? 'Could not load tasks.' : 'Nothing in Fronta right now.'}</p>`;
    return;
  }
  list.removeAttribute('aria-busy');
  const q = fold($('#q').value.trim());
  const rows = current.filter((p) => matches(p, q));
  list.innerHTML = (q ? `<p class="count">${rows.length} of ${current.length}</p>` : '') +
    (rows.length ? renderGroups(rows, Boolean(q)) : `<p class="empty">${q ? 'No matches' : 'Nothing to do right now.'}</p>`) +
    (done ? `<p class="count">${done} messaged today, hidden until they reply</p>` : '');
}

// Re-renders a list without moving what's on screen: the first visible row stays put.
function keepAnchor(scroller, rowSel, render) {
  const top = scroller.getBoundingClientRect().top;
  const anchor = scroller.scrollTop > 0 ? [...scroller.querySelectorAll(rowSel)].find((el) => el.getBoundingClientRect().bottom > top) : null;
  const id = anchor?.dataset.id, before = anchor?.getBoundingClientRect().top;
  render();
  const el = id && scroller.querySelector(`${rowSel}[data-id="${CSS.escape(id)}"]`);
  if (el) scroller.scrollTop += el.getBoundingClientRect().top - before;
}

// Re-renders the task list, keeping focus and scroll position.
function rerenderTasks() {
  const a = document.activeElement;
  const key = a?.id ? `#${CSS.escape(a.id)}` : a?.dataset?.group ? `[data-group="${CSS.escape(a.dataset.group)}"]${a.dataset.batch != null ? '.gai' : '.gt'}` : null;
  keepAnchor($('#main'), '.row', renderList);
  if (key && $('#people').contains(a)) document.querySelector(key)?.focus({ preventScroll: true });
}

function toggleGroup(name) {
  if ($('#q').value.trim()) return; // while searching, every group with matches is open
  if (collapsed.has(name)) collapsed.delete(name); else collapsed.add(name);
  renderList();
  document.querySelector(`.gt[data-group="${CSS.escape(name)}"]`)?.focus({ preventScroll: true });
}

// One click copies phone or email; falls back when the clipboard API is refused.
async function copy(btn) {
  const value = btn.dataset.copy;
  let ok = false;
  try { await navigator.clipboard.writeText(value); ok = true; } catch {
    const t = document.createElement('textarea');
    t.value = value; document.body.append(t); t.select();
    try { ok = document.execCommand('copy'); } catch {}
    t.remove();
  }
  const shown = btn.textContent;
  btn.style.minWidth = `${btn.offsetWidth}px`;
  btn.textContent = ok ? 'Copied' : 'Press ⌘C';
  announce(ok ? `${btn.dataset.what === 'phone' ? 'Phone' : 'Email'} copied` : '');
  setTimeout(() => { btn.textContent = shown; btn.style.minWidth = ''; }, 1500);
}

// ---- message bodies
// Quoted history in email replies hides behind "Show quoted".
const QUOTE = /^(>|On .+wrote:|Dne .+napsal|-{2,}\s*(Original|Původní)|From: |Od: )/m;
let bodySeq = 0;
function renderBody(m) {
  const text = m.text || '', i = m.channel === 'email' ? text.search(QUOTE) : -1;
  const main = i > 0 ? text.slice(0, i).trimEnd() : text, quoted = i > 0 ? text.slice(i) : '';
  const id = `b${++bodySeq}`, long = main.length > 600;
  return `<div class="body${long ? ' clamp' : ''}" id="${id}">${esc(main)}</div>`
    + (long ? `<button type="button" class="link" data-more aria-expanded="false" aria-controls="${id}">Show more</button>` : '')
    + (quoted ? `<div class="body quoted" id="${id}q" hidden>${esc(quoted)}</div><button type="button" class="link" data-quoted aria-expanded="false" aria-controls="${id}q">Show quoted</button>` : '');
}

// "Show more" and "Show quoted". True when handled.
function bodyClick(e) {
  const more = e.target.closest('[data-more], [data-quoted]');
  if (!more) return false;
  const open = more.getAttribute('aria-expanded') !== 'true', el = document.getElementById(more.getAttribute('aria-controls'));
  if (more.dataset.more != null) el.classList.toggle('clamp', !open); else el.hidden = !open;
  more.setAttribute('aria-expanded', open);
  more.textContent = more.dataset.more != null ? (open ? 'Show less' : 'Show more') : (open ? 'Hide quoted' : 'Show quoted');
  return true;
}

const renderDay = (at) => `<li><h3 class="day">${esc(dayLabel(at))}</h3></li>`;

function renderErrors(errors = {}) {
  return Object.entries(errors).map(([k, v]) => `<p class="err" role="status">${CHANNELS[k] || 'History'} unavailable: ${esc(v)}</p>`).join('');
}

function renderEmpty(p) {
  if (!p.emails.length && !p.phones.length) return '<p class="empty">No email or phone for this person in the CRM.</p>';
  const tips = [];
  if (p.emails.length && !sources.email) tips.push('Email isn\'t connected.');
  if (p.phones.length && !sources.whatsapp) tips.push('WhatsApp isn\'t connected.');
  if (p.phones.some((ph) => !String(ph).trim().startsWith('+'))) tips.push('WhatsApp needs phones with a country code (+…).');
  return `<p class="empty">No messages for ${esc([...p.emails, ...p.phones].join(', '))}.${tips.length ? '<br>' + esc(tips.join(' ')) : ''}</p>`;
}

async function fetchHistory(id) {
  if (!hist.has(id)) {
    try { hist.set(id, await api(`/api/people/${enc(id)}/history`)); }
    catch (e) {
      const p = people.find((x) => x.id === id) || { id, name: chats.find((c) => c.id === id)?.name || '', emails: [], phones: [], counts: {} };
      return { person: p, messages: [], errors: { load: e.message }, reach: {}, waKnown: false };
    }
  }
  return hist.get(id);
}

// ---- the chat column: the selected person's whole conversation, newest at
// the bottom, the AI draft as a gray bubble, and the composer.
let chat = null;                  // { id, data, all, unseen, error, sending, edit: { id, text, subject, open, dirty } }
const composerText = new Map();   // unsent text for the AI per person
const atBottom = (el) => el.scrollHeight - el.scrollTop - el.clientHeight < 48;
const LIST_NAME = { tasks: 'Tasks', messages: 'Messages' };
const chatPerson = () => chat.data?.person || people.find((p) => p.id === chat.id)
  || { id: chat.id, name: chats.find((c) => c.id === chat.id)?.name || '', stage: chats.find((c) => c.id === chat.id)?.stage, emails: [], phones: [] };
const grow = (el) => { if (el) { el.style.height = 'auto'; el.style.height = `${el.scrollHeight + 2}px`; } };
const saveComposer = () => { if (chat && $('#ctext')) composerText.set(chat.id, $('#ctext').value); };

function renderChat() {
  const el = $('#chat');
  if (!chat) { el.innerHTML = `<p class="empty">${section === 'messages' ? 'Pick a chat.' : 'Pick a person (↑↓, Enter).'}</p>`; return; }
  el.innerHTML = `<header class="chead" id="chead"></header>
    <div class="thread" id="thread" tabindex="0" role="region"><div id="msgs"></div><div id="draftbox"></div></div>
    <button type="button" class="pill newpill" id="newpill" hidden></button>

      <div class="cline"><textarea class="input ctext" id="ctext" rows="1" aria-keyshortcuts="Enter"></textarea>

      <p class="info" id="chint" hidden></p>

  $('#ctext').value = composerText.get(chat.id) || '';

  $('#thread').scrollTop = $('#thread').scrollHeight;
}

// Opens this person's chat in the WhatsApp app (the Mac app hands whatsapp:// links to macOS).
function renderWaLink(p) {
  const d = String(p.phones?.[0] || '').replace(/\D/g, '');
  return d && chat.data?.waKnown ? `<a class="ib walink" href="whatsapp://send?phone=${d}" title="Open the chat in WhatsApp" aria-label="Open the chat with ${esc(p.name)} in WhatsApp">${icon('wa')}</a>` : '';
}
function renderChatHeader() {
  const p = chatPerson();
  $('#chead').innerHTML = `<button type="button" class="link back" data-act="back">‹ ${LIST_NAME[section] || 'Back'}</button>
    <div class="ctitle"><h2>${esc(p.name)}</h2>${renderWaLink(p)}${p.stage ? `<span class="sd" style="--st: ${stageColor(p.stage.rank)}" aria-hidden="true"></span><span class="stage-l">${esc(p.stage.label)}</span>` : ''}</div>
    ${renderContact(p, false)}`;
  $('#thread').setAttribute('aria-label', `Conversation with ${p.name}`);
}

// One message bubble: the subject where an email thread changes, the time inside.
const subjectKey = (s) => (s || '').replace(/^((re|fwd?|fw|aw|odp):\s*)+/i, '').trim().toLowerCase();
function renderBubble(m, p, { subject }) {
  const who = m.fromMe ? 'you' : m.channel === 'email' ? m.from || p.name : p.name;
  return `<li class="${m.channel}${m.fromMe ? ' me' : ''}"><article class="msg ${m.channel}" aria-label="${CHANNELS[m.channel]} from ${esc(who)}"${m.channel === 'email' && m.from ? ` title="${esc(m.from)}"` : ''}>
    ${subject ? `<div class="subject" title="${esc(m.subject)}">${esc(m.subject)}</div>` : ''}
    ${renderBody(m)}<span class="mt">${m.local ? `${esc(m.local)} · ` : ''}${timeTag(m.at, hhmm(m.at))}</span></article></li>`;
}

function renderMessages() {
  const el = $('#msgs');
  if (!el) return;
  if (!chat.data) { el.innerHTML = '<p class="info">Loading…</p>'; return; }
  const p = chatPerson(), { messages, errors } = chat.data;
  const visible = chat.all ? messages : messages.slice(-RECENT);
  // Sent from the app and not in the history yet (WhatsApp counts as sent once opened).
  const lastMine = messages.findLast((m) => m.fromMe)?.at ?? '';
  const sent = requests.filter((r) => r.personId === chat.id && r.status === 'sent' && r.updatedAt > lastMine)
    .map((r) => ({ channel: r.channel, id: r.id, at: r.updatedAt, fromMe: true, subject: r.subject, text: r.text, local: r.channel === 'email' ? 'sent from app' : 'opened in WhatsApp' }));
  let prev = null, lastSubject = null;
  const items = [...visible, ...sent].map((m) => {
    const subject = m.channel === 'email' && Boolean(m.subject) && subjectKey(m.subject) !== lastSubject;
    if (m.channel === 'email') lastSubject = subjectKey(m.subject);
    const html = (!prev || !sameDay(prev.at, m.at) ? renderDay(m.at) : '') + renderBubble(m, p, { subject });
    prev = m;
    return html;
  }).join('');
  const earlier = messages.length > visible.length ? `<button type="button" class="link earlier" data-earlier>Show earlier (${messages.length - visible.length})</button>` : '';
  el.innerHTML = renderErrors(errors) + (items ? earlier + `<ol class="msgs">${items}</ol>`
    : renderEmpty(p) + `<p class="info center">Ask the AI below to draft the first message.</p>`);
}

// The draft for the open person, after the conversation: the user's notes,
// earlier versions folded, the current version last. Changed only by talking to the AI.
function chainOf(r) {
  const out = [r];
  for (let x = r; x.previousId && (x = requests.find((y) => y.id === x.previousId));) out.unshift(x);
  return out;
}
const renderAiNote = (v) => (v.instruction ? `<p class="anote">${icon('spark')} you: ${esc(v.instruction)}</p>`
  : v.previousId ? `<p class="anote">${icon('spark')} another version</p>` : '');

// Two round buttons: × discards (stops drafting, dismisses a failure), ↑ sends
// (email over SMTP, WhatsApp opens prefilled, a meeting offer is marked done).
function renderDraftButtons(r, p) {
  const xl = r.status === 'generating' ? 'Stop drafting' : r.status === 'failed' ? 'Dismiss' : 'Discard draft';
  const x = `<button type="button" class="ib rb" data-dact="discard" data-label="${xl}" aria-label="${xl}" title="${xl}"><span class="rc no">${icon('cancel')}</span></button>`;
  if (r.status !== 'pending') return `<span class="dbtns">${x}</span>`;
  const email = r.kind === 'message' && r.channel === 'email';
  const label = r.kind === 'meeting' ? 'Mark the meeting offer as done' : email ? `Send email to ${p.name.split(' ')[0] || p.name}` : 'Open in WhatsApp to send';
  const off = email && !sources.smtp ? 'Email sending is not set up (SMTP in .env)' : '';
  return `<span class="dbtns">${x}<button type="button" class="ib rb" data-dact="send" data-label="${esc(label)}" data-off="${esc(off)}" aria-label="${esc(label)}" title="${esc(off || label)}">
    <span class="rc">${chat.sending ? SPIN : icon('up')}</span></button></span>`;
}

function renderDraftBubble(r, p) {
  const id = esc(r.id), btns = renderDraftButtons(r, p);
  if (r.status === 'generating') return `<article class="msg draft" data-req="${id}"><p class="working">${SPIN} Drafting… <span data-elapsed="${esc(r.createdAt)}"></span></p><div class="dmeta"><span></span>${btns}</div></article>`;
  if (r.status === 'failed') return `<article class="msg draft" data-req="${id}"><p class="err">Draft failed: ${esc(r.error)}</p><div class="dmeta"><span>Press ${icon('spark')} to try again</span>${btns}</div></article>`;
  const stale = (chat.data?.messages || []).some((m) => !m.fromMe && m.at > r.createdAt)
    ? `<p class="why">${esc(p.name.split(' ')[0])} wrote after this draft · ${icon('spark')} to redo</p>` : '';
  if (r.kind === 'meeting') return `<article class="msg draft" data-req="${id}"><p class="body"><b>Offer a meeting:</b> ${esc(r.text)}</p>${stale}
    <div class="dmeta"><span></span>${btns}</div></article>`;
  const e = chat.edit?.id === r.id ? chat.edit : null;
  const edited = r.aiText != null && ((e?.text ?? r.text).trim() !== r.aiText.trim() || ((e?.subject ?? r.subject) || '') !== (r.aiSubject || ''));
  return `<article class="msg draft ${esc(r.channel)}" data-req="${id}" aria-label="AI draft to ${esc(p.name)}">
    ${renderDraftText(r)}${stale}<div class="dmeta"><span class="dst" data-dst>${edited ? 'edited by you' : ''}</span>${btns}</div></article>`;
}
// The draft's text, or while editing its fields (only this part is swapped, so the buttons keep working).
function renderDraftText(r) {
  const e = chat.edit?.id === r.id ? chat.edit : null, text = e ? e.text : r.text, subj = e ? e.subject : r.subject;
  if (e?.open) return `<div class="dtext">${r.channel === 'email' ? `<input class="dfield" data-dfield="subject" value="${esc(subj)}" aria-label="Subject" placeholder="Subject">` : ''}
    <textarea class="dfield body" data-dfield="text" rows="1" aria-label="Draft text">${esc(text)}</textarea></div>`;
  const lastSubject = subjectKey((chat.data?.messages || []).findLast((m) => m.channel === 'email')?.subject);
  const subject = r.channel === 'email' && subj && subjectKey(subj) !== lastSubject;
  return `<div class="dtext dedit" data-dedit tabindex="0" role="button" aria-label="Edit draft" title="Click to edit">${subject ? `<div class="subject">${esc(subj)}</div>` : ''}<div class="body">${esc(text)}</div></div>`;
}

function renderDraft() {
  const el = $('#draftbox');
  if (!el) return;
  const focused = el.contains(document.activeElement) ? document.activeElement.dataset.dact : null;
  const r = activeReq(chat.id);
  if (chat.edit && (chat.edit.id !== r?.id || r.status !== 'pending')) chat.edit = null;
  if (chat.edit?.open && el.querySelector('[data-dfield]')) return; // never re-render under the user's hands
  if (!r) { el.innerHTML = ''; return; }
  const chain = chainOf(r), p = chatPerson();
  const early = chain.slice(0, -1).map((v) => renderAiNote(v)
    + (v.text ? `<details class="early"><summary>Earlier draft</summary><p class="brief">${esc(v.text)}</p></details>` : '')).join('');
  el.innerHTML = `<div class="dchain">${early}${renderAiNote(r)}${renderDraftBubble(r, p)}</div>`;
  if (focused) el.querySelector(`[data-dact="${focused}"]`)?.focus({ preventScroll: true });
  tickElapsed();
}
const tickElapsed = () => {
  for (const s of document.querySelectorAll('[data-elapsed]')) {
    const n = Math.max(0, Math.round((Date.now() - new Date(s.dataset.elapsed)) / 1000));

// The box only talks to the AI: no draft, ✨ drafts (the text is the

const renderNewPill = () => {

};

function openChat(id) {

// (Re)loads the open person's history; new client messages while the user

  const t = $('#thread'), first = !chat.data, wasBottom = first || atBottom(t);

// Editing the draft by hand: the text turns into fields in the same bubble,
// autosaved (PUT /api/requests/:id); Esc or leaving it ends editing. The AI's
// own version stays in aiText/aiSubject, so the coach sees what changed.
function editDraftText(r) {
  if (r.status !== 'pending' || r.kind !== 'message') return;
  if (chat.edit?.id !== r.id) chat.edit = { id: r.id, text: r.text, subject: r.subject || '', dirty: false };
  chat.edit.open = true;

function saveDraftText(now = false) {

  draftStatus('Saving…');
  const run = () => (draftSaving = (async () => {

    catch (er) { e.dirty = true; draftStatus(`Not saved: ${er.message}`, true); }

async function sendDraft(r) {

// ✨: a first draft (the typed text is the instruction), or a new version of
// the current one (the typed text is the note about it).

    if (!out) throw new Error('There is no email or WhatsApp to write to, or a draft is already waiting');

// ↑/↓/Home/End move focus and selection (the chat follows; narrow: focus only);
// Enter/→ goes to the composer; Esc clears the selection.
function listKeys(e, rows, i, search) {

  if (i < 0) return;
  if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); return pick(rows[i].dataset.id, { composer: true }); }
  const next = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: rows.length - 1 }[e.key];

// ---- list width: a divider in Tasks and Messages, one shared width (--feed-w),
// remembered per browser. Drag, ←/→ (Shift: more), Home/End; double-click resets.
const rootCss = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
const FEED = { def: rootCss('--feed-w'), min: rootCss('--feed-min'), max: rootCss('--feed-max'), step: 16 };
let feedW = FEED.def;
const feedMax = () => Math.max(FEED.min, Math.min(FEED.max, innerWidth - rootCss('--rail') - rootCss('--chat-min')));
function setFeed(w, save) {
  feedW = Math.round(Math.min(FEED.max, Math.max(FEED.min, w)));
  document.documentElement.style.setProperty('--feed-w', `${feedW}px`);
  renderGutters();
  try { if (save === 'reset') localStorage.removeItem('feedW'); else if (save) localStorage.setItem('feedW', feedW); } catch {}
}
function renderGutters() {
  const max = feedMax(), now = Math.min(feedW, max);
  for (const g of document.querySelectorAll('.gutter')) {
    g.setAttribute('aria-valuemin', FEED.min); g.setAttribute('aria-valuemax', max);
    g.setAttribute('aria-valuenow', now); g.setAttribute('aria-valuetext', `${now} pixels`);
  }
}
try { setFeed(Number(localStorage.getItem('feedW')) || FEED.def, false); } catch { setFeed(FEED.def, false); }

  g.addEventListener('pointerdown', (e) => {
    if (e.button) return;
    e.preventDefault(); g.setPointerCapture(e.pointerId); document.body.classList.add('resizing');
  });
  g.addEventListener('pointermove', (e) => {
    if (g.hasPointerCapture(e.pointerId)) setFeed(Math.min(feedMax(), e.clientX - g.parentElement.getBoundingClientRect().left), false);
  });
  g.addEventListener('lostpointercapture', () => { document.body.classList.remove('resizing'); setFeed(feedW, true); });
  g.addEventListener('dblclick', () => { setFeed(FEED.def, 'reset'); announce('List width reset'); });
  g.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? FEED.step * 4 : FEED.step, now = Math.min(feedW, feedMax());
    const next = { ArrowLeft: now - step, ArrowRight: now + step, Home: FEED.min, End: feedMax() }[e.key];
    if (next == null) return;
    e.preventDefault(); setFeed(Math.min(feedMax(), next), true);

// ---- Messages: every CRM contact with a conversation, newest first

// New client messages from anyone but the chat on screen, a few at once in one line.

// An open AI draft replaces the preview, WhatsApp-style ("Draft: …").

// While the pointer or focus is in the list, rows update in place and keep
// their order (new chats go on top); the new order applies once it leaves.
// Chats with an open AI draft go on top, newest draft first; someone drafted
// for from Tasks without any messages yet gets a row too.
function withDrafts(list) {
  const open = new Map(requests.filter((r) => REQ_OPEN.includes(r.status)).map((r) => [r.personId, r]));
  const extra = [...open.values()].filter((r) => !list.some((c) => c.id === r.personId)).map((r) => {
    const p = people.find((x) => x.id === r.personId);
    return { id: r.personId, name: p?.name || r.personName, stage: p?.stage || null, channels: [], unread: 0, last: { at: r.createdAt, fromMe: true, text: '' } };
  });
  const at = (c) => open.get(c.id)?.createdAt;

// Requests = people with an open AI draft, Unanswered = unread chats, All. Remembered per browser;

// One event stream for the whole app: snapshot (a refresh published),
// messages { ids } (new messages), requests (a draft changed).
const soonTimers = {};
const soon = (key, fn, ms = 200) => { clearTimeout(soonTimers[key]); soonTimers[key] = setTimeout(fn, ms); };
let newIds = [];
async function onSnapshot() { checkSync(); await loadPeople(); loadChats(); if (chat) loadChat(true); }
async function onMessages() {
  const ids = newIds;
  newIds = [];
  loadChats();
  await loadPeople();
  if (chat && ids.includes(chat.id)) loadChat(true);
}
function connectEvents() {
  const es = new EventSource('/api/events');
  es.onopen = () => {
    if (live) return;
    live = true; renderHeader();
    onSnapshot(); loadRequests(); // anything missed while away
  };
  es.onerror = () => {
    if (!live) return;
    live = false; liveDownAt = Date.now();
    setTimeout(renderHeader, 31e3);
  };
  es.addEventListener('snapshot', () => soon('snapshot', onSnapshot));
  es.addEventListener('messages', (e) => { newIds.push(...JSON.parse(e.data).ids); soon('messages', onMessages); });
  es.addEventListener('requests', () => soon('requests', loadRequests));
  es.addEventListener('personal', () => soon('personal', loadPersonal));
}

// Only the newest load counts: an older answer arriving late would undo newer state.
let reqSeq = 0;
async function loadRequests() {
  const seq = ++reqSeq, before = new Map(requests.map((r) => [r.id, r.status]));
  let list;
  try { list = await api('/api/requests'); } catch {}
  if (seq !== reqSeq) return;
  if (list) requests = list;
  const done = requests.filter((r) => before.get(r.id) === 'generating' && r.status !== 'generating');
  if (done.length === 1) $('#announce').textContent = done[0].status === 'failed' ? `Draft failed for ${done[0].personName}` : `Draft ready for ${done[0].personName}`;
  else if (done.length) $('#announce').textContent = `${done.filter((r) => r.status !== 'failed').length} drafts ready, ${done.filter((r) => r.status === 'failed').length} failed`;

}

}

function trackChanges() {
  const m = pers?.mind;
  if (!m?.portrait) return;
  const now = Object.fromEntries(itemsOf(m.portrait));
  if (seen === null) { try { seen = JSON.parse(localStorage.getItem('youSeen') || 'null'); } catch { seen = null; } seen ??= now; }
  else if (lastBuilt && m.builtAt !== lastBuilt) seen = lastMap;
  lastBuilt = m.builtAt; lastMap = now;
  try { localStorage.setItem('youSeen', JSON.stringify(now)); } catch {}
}

function renderTell(m) {

  return `<section class="tell" aria-labelledby="ph-tell"><h2 class="psh" id="ph-tell">Correct it</h2>

    ${waiting.map((n) => `<p class="pending">“${esc(n.text)}”<span class="why">${m.building ? `${SPIN} Updating with this…` : 'In the next update'}</span></p>`).join('')}
    ${done.length ? `<details data-k="notes"><summary class="link">Your corrections (${done.length})</summary><ul class="quotes">${done.slice().reverse()
      .map((n) => `<li>${esc(n.text)} <span class="why">· ${since(n.at)}</span></li>`).join('')}</ul></details>` : ''}</section>`;
}

// One row: the headline; open it for the reasoning and the quotes.

function renderPortrait(p) {

  const out = [

      + (p.heuristics.length > HEUR_SHOWN ? `<button type="button" class="quiet showall" data-pp="allheur">${allHeur ? 'Show fewer' : `Show all ${p.heuristics.length}`}</button>` : '')),
    (p.values?.length || p.never?.length) && sec('stand', 'What I stand for',
      (p.values?.length ? list(p.values, (x, i) => item(x, esc(x.text), '', `<span class="n">${i + 1}</span>`), 'plain') : '')
      + (p.never?.length ? `<h3 class="sub">What I never do</h3>${list(p.never, (x) => item(x, esc(x.headline || x.text), x.headline ? `<p>${esc(x.text)}</p>` : ''), 'plain')}` : '')),
    p.tensions?.length && sec('calls', 'Judgment calls', list(p.tensions, (x) => item(x, esc(x.between), `<p>${esc(x.text)}</p>`)),
      '<p class="info">Two things you care about that clash. Open one to see which wins when.</p>'),

  ];

// Does it help: a blind test on moments it never saw, honest about noise.
const pctOf = (a, n) => (n ? `${Math.round((100 * a) / n)}%` : '–');
function renderFit(p) {
  const v = pers.mind.validation, f = pers.fidelity || [], scores = pers.mind.scores || [];
  const wk = (d, i) => (i === 0 ? 'this week' : `week of ${new Date(`${d}T12:00:00Z`).toLocaleDateString('en', { day: 'numeric', month: 'short' })}`);
  const gap = v ? v.with - v.without : 0;
  const test = v ? `<p class="fitn${gap >= 5 ? ' up' : ''}">${gap >= 5 ? `${gap} points better than without it` : 'About even so far'}</p>
    <div class="mrow"><span>With</span><i style="--v:${v.with}"></i><b>${v.with}</b></div>
    <div class="mrow off"><span>Without</span><i style="--v:${v.without}"></i><b>${v.without}</b></div>
    <p class="info">Blind test ${since(v.at)} on ${plural(v.n, 'recent moment')} it never saw: it guessed what you did, a second AI scored the guesses. Gaps under 5 are noise.${scores.length > 1 ? ` Before: ${scores.slice(-6, -1).reverse().map((x) => `${x.with} vs. ${x.without}`).join(' · ')}.` : ''}</p>` : '';
  const sent = f.length ? `<p class="info">Sent unedited: ${f.slice(0, 2).map((w, i) => `${pctOf(w.asIs, w.decided)} ${wk(w.week, i)} (${w.asIs} of ${w.decided})`).join(' · ')}</p>` : '';
  const blind = p?.limits?.length ? `<details data-k="blind"><summary class="link">Blind spots (${p.limits.length})</summary><ul>${p.limits.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></details>` : '';
  return test || sent || blind ? sec('fit', 'Does it help?', `${test}${sent}${blind}`) : '';
}

async function flushSaves(keepalive = false) {

// Copies HTML (with a plain-text fallback) or just text. The copy event runs
// inside the click, which WebKit allows; the async clipboard API is the backup.
async function copyRich(text, html) {
  const onCopy = (e) => {
    e.clipboardData.setData('text/plain', text);
    if (html) e.clipboardData.setData('text/html', html);
    e.preventDefault();
  };
  document.addEventListener('copy', onCopy);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.removeEventListener('copy', onCopy);
  if (ok) return true;
  try {
    const item = { 'text/plain': new Blob([text], { type: 'text/plain' }) };
    if (html) item['text/html'] = new Blob([html], { type: 'text/html' });
    await navigator.clipboard.write([new ClipboardItem(item)]);
    return true;
  } catch { return false; }
}

  const label = btn.textContent;
  btn.style.minWidth = `${btn.offsetWidth}px`;

}

// Formatting keeps the body's selection: buttons don't take focus on mousedown.
let linkRange = null;
function format(cmd) {
  const body = $('#tbody');
  if (cmd === 'link') {
    const sel = getSelection();
    linkRange = sel.rangeCount && body.contains(sel.anchorNode) ? sel.getRangeAt(0) : null;
    const input = $('#tlink');
    input.hidden = false; input.value = ''; input.focus();
    return;
  }
  body.focus();
  if (cmd === 'h2') {
    const inH2 = getSelection().anchorNode?.parentElement?.closest('h2');
    document.execCommand('formatBlock', false, inH2 ? 'div' : 'h2');
  } else document.execCommand(cmd);
}
function applyLink(url) {
  const body = $('#tbody'), input = $('#tlink');
  input.hidden = true;
  body.focus();
  if (!url) return;
  if (linkRange) { const sel = getSelection(); sel.removeAllRanges(); sel.addRange(linkRange); }
  if (linkRange && !linkRange.collapsed) document.execCommand('createLink', false, url);
  else document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`);
}

  if (i < 0) return;
  if (e.key === 'Enter') { e.preventDefault(); selectTpl(rows[i].dataset.tid, true); return $('#tname').focus(); }
  const next = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: rows.length - 1 }[e.key];
  if (next == null) return;
  e.preventDefault();
  if (next < 0) return $('#tq').focus();
  const id = rows[Math.min(rows.length - 1, next)].dataset.tid;
  selectTpl(id);
  document.querySelector(`.trow[data-tid="${CSS.escape(id)}"]`)?.focus();
});

const editor = $('#editor');
editor.addEventListener('mousedown', (e) => { if (e.target.closest('[data-cmd]')) e.preventDefault(); });
editor.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act], [data-cmd], [data-gender]');
  if (!b) return;
  if (b.dataset.cmd) return format(b.dataset.cmd);
  if (b.dataset.gender) {
    gender = b.dataset.gender;
    document.querySelectorAll('[data-gender]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.gender === gender));
    if (preview) setPreview(true);
    return;
  }
  const t = currentTpl();
  ({
    back: () => { pane = 'list'; renderEditor(); document.querySelector('.trow[aria-current]')?.focus(); },
    dup: () => addTemplate({ name: `${t.name || 'Untitled'} Copy`, subject: t.subject, bodyHtml: t.bodyHtml }, tpls.indexOf(t)),
    del: () => askDelete(true),
    'del-no': () => askDelete(false),
    'del-yes': deleteTpl,
    'copy-subject': () => copyPart(b, 'subject'),
    'copy-body': () => copyPart(b, 'body'),
    preview: () => setPreview(!preview),
  })[b.dataset.act]?.();
});
editor.addEventListener('input', (e) => {
  const t = currentTpl(), el = e.target;
  if (el.dataset.field != null) { values[el.dataset.field].value = el.value; if (preview) setPreview(true); return; }
  if (el.dataset.include != null) return;
  if (el.id === 'tlink' || preview) return;
  if (el.id === 'tname') t.name = el.value;
  else if (el.id === 'tsubj') t.subject = el.value;
  else if (el.id === 'tbody') t.bodyHtml = el.innerHTML;
  else return;
  scheduleSave();
  if (el.id !== 'tbody') renderTList();
  if (el.id !== 'tname') syncFields();
});
editor.addEventListener('change', (e) => {
  const n = e.target.dataset.include;
  if (n == null) return;
  values[n].include = e.target.checked;
  const row = e.target.closest('.field');
  row.classList.toggle('off', !e.target.checked);
  row.querySelector('[data-field]').disabled = !e.target.checked;
  if (preview) setPreview(true);
});
editor.addEventListener('keydown', (e) => {
  if (e.target.id === 'tlink') {
    if (e.key === 'Enter') { e.preventDefault(); applyLink(e.target.value.trim()); }
    if (e.key === 'Escape') { e.preventDefault(); applyLink(''); }
    return;
  }
  if (e.key !== 'Escape') return;

  if ($('[data-act=del-no]')) return askDelete(false);
  pane = 'list';

// ---- Playbooks: a follow-up strategy per stage; the AI builds them and learns
// from every decision on a draft. The left list has the learning log first.
const PB_STAGES = ['Installments', 'Thinking about it', 'No show', 'To be booked', 'Not answered', 'New lead']; // = STAGES in lib/resultson.js
const PB_CHANNELS = { whatsapp: 'WhatsApp', email: 'Email', any: 'Any channel' };
const LEARNED = '__learned';
const MAX_STEPS = 10;
let pb = null, psel = null, ppane = 'list', pbTimer, pbSave, pbError = '', lastChange, changesShown = 20, rebuildAsk = false;
const curPb = () => pb?.playbooks.find((p) => p.id === psel);
const stageRank = (s) => PB_STAGES.indexOf(s) + 1;
const topRank = (p) => Math.min(...p.stages.map(stageRank).filter((r) => r > 0), 99);
const tplById = (id) => tpls?.find((t) => t.id === id);
const coachBusy = () => pb?.coach.running || pb?.coach.queued > 0;

async function loadPlaybooks() {
  try { pb = await api('/api/playbooks'); pbError = ''; } catch (e) { pbError = e.message; }
  if (pb) {
    const newest = pb.changes[0]?.id;
    if (lastChange !== undefined && newest && newest !== lastChange && pb.changes[0].trigger.kind !== 'user') {
      // The AI may have written templates: reload them (not while one is being edited).
      if (pb.changes[0].ops.some((o) => o.op === 'setTemplate') && section !== 'templates') { tpls = null; await loadTemplates(); }
    }
    lastChange = newest ?? null;
    if (psel === null) psel = pb.playbooks.length ? LEARNED : null;
  }
  renderCoachBadge();
  if (section === 'playbooks') { renderPList(); renderPEditor(false); }
  clearTimeout(pbTimer);
  if (coachBusy()) pbTimer = setTimeout(loadPlaybooks, 3000);
}

// Learning runs quietly in the background: decisions are collected and every
// c.batch of them one run learns. Only here: the count, Learn now, a failure (also "!" on the rail).
function renderCoachLine() {
  const c = pb?.coach;
  if (!c) return pbError ? `<span class="bad">Could not load playbooks: ${esc(pbError)}</span>` : '';
  const err = c.error ? `<span class="bad"><span class="dot bad"></span>Learning failed: ${esc(c.error)}. Nothing was changed; it retries at the next decision.</span>` : '';
  const count = c.learning ? `<span>${SPIN} Learning from ${c.lessons} decision${c.lessons === 1 ? '' : 's'}…</span>`
    : c.lessons ? `<span>${c.lessons} of ${c.batch} decisions collected</span> · <button type="button" class="quiet" data-pact="learn">Learn now</button>`
    : c.last && !c.last.changed ? `<span title="${esc(c.last.summary)}">Reviewed ${c.last.count} decision${c.last.count === 1 ? '' : 's'}: nothing to change.</span>` : '';
  return err + count;
}
function renderCoachBadge() {
  const b = $('#pbadge'), bad = Boolean(pb?.coach.error);
  b.hidden = !bad; b.textContent = '!';

}

function renderPList() {

// Every edit saves the whole playbook (the server logs it; quick edits fold into one change).
function savePlaybook(p, now = false) {
  pstatus('Saving…');
