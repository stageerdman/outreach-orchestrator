// ---- the learning log
const TRIGGER = {
  build: () => 'Built from your templates, reply rates and style',
  batch: (t) => `From your last ${t.count} decision${t.count === 1 ? '' : 's'} on drafts${t.notes ? ` (${t.notes} with a note)` : ''}${t.answers ? `, ${t.answers} answer${t.answers === 1 ? '' : 's'}` : ''}`,
  approve: (t) => `After you sent the draft for ${t.personName}`,
  regenerate: (t) => `After you asked for a new draft for ${t.personName}`,
  cancel: (t) => `After you cancelled the draft for ${t.personName}`,
  distill: (t) => `From your ${t.count} past decision${t.count === 1 ? '' : 's'} with a note or an edit`,
  answer: () => 'Your answer to a question',
  migrate: () => 'Playbook lessons became your rules',
  user: () => 'Your edit',
};

function stepDiff(before, after) {
  if (!before) return [`New playbook with ${after.steps.length} steps`];
  if (!after) return ['Removed'];
  const out = [], byId = new Map(before.steps.map((s, i) => [s.id, { s, i }]));
  if (before.goal !== after.goal) out.push(`Goal: “${after.goal}”`);
  after.steps.forEach((s, i) => {
    const b = byId.get(s.id);
    if (!b) return out.push(`Step ${i + 1} added: ${PB_CHANNELS[s.channel]}, after ${s.waitDays} d — ${s.ask}`);
    const d = [];
    if (b.i !== i) d.push(`moved from ${b.i + 1}`);
    if (b.s.channel !== s.channel) d.push(`${PB_CHANNELS[b.s.channel]} → ${PB_CHANNELS[s.channel]}`);
    if (b.s.waitDays !== s.waitDays) d.push(`wait ${b.s.waitDays} → ${s.waitDays} d`);
    if (b.s.ask !== s.ask) d.push(`ask: “${s.ask}”`);
    if (b.s.why !== s.why) d.push(`why: “${s.why}”`);
    const added = s.templateIds.filter((x) => !b.s.templateIds.includes(x)), gone = b.s.templateIds.filter((x) => !s.templateIds.includes(x));
    if (added.length) d.push(`+ ${added.map((x) => `“${tplById(x)?.name || x}”`).join(', ')}`);
    if (gone.length) d.push(`− ${gone.map((x) => `“${tplById(x)?.name || x}”`).join(', ')}`);
    if (d.length) out.push(`Step ${i + 1}: ${d.join('; ')}`);
  });
  const ids = new Set(after.steps.map((s) => s.id));
  for (const s of before.steps) if (!ids.has(s.id)) out.push(`Step removed: ${s.ask}`);
  const rIds = new Set(before.responses.map((r) => r.id));
  for (const r of after.responses) if (!rIds.has(r.id)) out.push(`New reply branch: when ${r.when}`);
  for (const r of before.responses) if (!after.responses.some((x) => x.id === r.id)) out.push(`Reply branch removed: ${r.when}`);
  for (const l of after.lessons) if (!before.lessons.includes(l)) out.push(`Lesson: ${l}`);
  for (const l of before.lessons) if (!after.lessons.includes(l)) out.push(`Lesson removed: ${l}`);
  return out.length ? out : ['Small wording changes'];
}

const RULE_STATUS = { active: 'now one of yours', testing: 'back to testing', rejected: 'rejected' };
function renderOp(o) {
  if (o.op === 'setRule' || o.op === 'deleteRule') {
    const r = o.after || o.before, what = r.kind === 'fact' ? 'Fact' : 'Rule';
    const label = !o.after ? `${what} removed` : !o.before ? `New ${what.toLowerCase()}` : o.before.status !== o.after.status ? `${what} ${RULE_STATUS[o.after.status]}` : `${what} changed`;
    const changed = o.before && o.after && ruleLine(o.before) !== ruleLine(o.after);
    return `<li>${label}: ${esc(ruleLine(r))}${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
      ${changed ? `<details><summary>Show before</summary><p class="brief">${esc(ruleLine(o.before))}</p></details>` : ''}</li>`;
  }
  if (o.op === 'setStyle') {
    return `<li>Style guide changed${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
      <details><summary>Show what changed</summary>${styleDiff(o.before, o.after)}</details></li>`;
  }
  if (o.op === 'setTemplate') {
    const name = o.after?.name || o.before?.name || 'Untitled';
    const text = (t) => (t ? htmlToText(t.bodyHtml) : '');
    return `<li>${o.before ? 'Template changed' : 'New template'}: <button type="button" class="link" data-tpl="${esc(o.id)}">${esc(name)}</button>
      ${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
      <details><summary>${o.before ? 'Show text before / after' : 'Show text'}</summary>
        ${o.before ? `<p class="why">Before</p><p class="brief">${esc(text(o.before))}</p><p class="why">After</p>` : ''}<p class="brief">${esc(text(o.after))}</p></details></li>`;
  }
  const p = o.after || o.before;
  const lines = stepDiff(o.before, o.after);
  return `<li>${o.op === 'deletePlaybook' ? 'Removed playbook' : o.before ? 'Playbook' : 'New playbook'}: <button type="button" class="link" data-pid="${esc(o.id)}">${esc(p.name)}</button>
    ${o.reason ? `<p class="why">${esc(o.reason)}</p>` : ''}
    ${o.before && o.after ? `<details><summary>${lines.length} change${lines.length === 1 ? '' : 's'}</summary><ul class="ops">${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></details>` : ''}</li>`;
}

// The changed lines of the style guide (lines removed, then added), or the whole text when it's new.
function styleDiff(before, after) {
  const a = (before || '').split('\n'), b = after.split('\n'), had = new Set(a), has = new Set(b);
  const gone = a.filter((l) => l.trim() && !has.has(l)), added = b.filter((l) => l.trim() && !had.has(l));
  if (!before?.trim()) return `<p class="brief">${esc(after)}</p>`;
  return (gone.length ? `<p class="why">Before</p><p class="brief">${esc(gone.join('\n'))}</p>` : '')
    + (added.length ? `<p class="why">After</p><p class="brief">${esc(added.join('\n'))}</p>` : '');
}

function renderChange(c) {
  const t = c.trigger;
  return `<li class="card past${c.undone ? ' undone' : ''}" id="ch-${esc(c.id)}" tabindex="-1">
    <h3><span class="name">${esc(c.summary || 'Changes')}</span>${timeTag(c.at, ago(c.at))}</h3>
    <p class="task">${esc((TRIGGER[t.kind] || TRIGGER.user)(t))}</p>
    ${t.note ? `<p class="note"><b>Your note:</b> ${esc(t.note)}</p>` : ''}
    <ul class="ops">${c.ops.map(renderOp).join('')}</ul>
    <div class="ractions"><span class="cancel">${c.undone ? '<span class="why">Undone</span>'
      : `<span class="err" data-err></span><button type="button" class="btn sm" data-undo="${esc(c.id)}" aria-label="Undo: ${esc(c.summary)}">${icon('recover')}Undo</button>`}</span></div></li>`;
}

function renderLearned() {
  const shown = pb.changes.slice(0, changesShown), left = pb.changes.length - shown.length;
  return `<h1>What the AI learned</h1>
    <p class="info">Your decisions on drafts (sent, edited, regenerated, cancelled) are collected; every ${pb.coach.batch} the AI reviews them together and may adjust the playbooks, templates and style guide. Each change says why, and can be undone.</p>
    <ul class="changes">${shown.map(renderChange).join('')}</ul>
    ${left ? `<button type="button" class="link" data-pact="more-changes">Show ${Math.min(left, 20)} more (${left} left)</button>` : ''}`;
}

// ---- interactions
async function openTemplate(id) {
  showSection('templates');
  await loadTemplates();
  tsel = id; pane = 'editor';
  renderTList(); renderEditor();
}

// Which list a field or chip belongs to: s3 = step 3, r1 = reply 1.
const partOf = (p, where) => (where[0] === 's' ? p.steps : p.responses)[Number(where.slice(1))];

$('#view-playbooks').addEventListener('click', async (e) => {
  const row = e.target.closest('.trow');
  if (row) {
    psel = row.dataset.pid; ppane = 'editor'; changesShown = 20;
    renderPList(); renderPEditor();
    document.querySelector(`#plist .trow[data-pid="${CSS.escape(psel)}"]`)?.focus();
    return;
  }
  const tp = e.target.closest('[data-tpl]');
  if (tp) return openTemplate(tp.dataset.tpl);
  const pid = e.target.closest('#peditor [data-pid]');
  if (pid) { psel = pid.dataset.pid; renderPList(); renderPEditor(); return; }
  const undo = e.target.closest('[data-undo]');
  if (undo) {
    if (undo.getAttribute('aria-disabled') === 'true') return;
    undo.setAttribute('aria-disabled', 'true'); undo.lastChild.textContent = 'Undoing…';
    try {
      const c = await api(`/api/playbooks/changes/${encodeURIComponent(undo.dataset.undo)}/undo`, { method: 'POST' });
      $('#announce').textContent = `Undid: ${c.summary}`;
      tpls = null; await loadTemplates(); await loadPlaybooks();
      document.getElementById(`ch-${c.id}`)?.focus();
    } catch (er) {
      undo.removeAttribute('aria-disabled'); undo.lastChild.textContent = 'Undo';
      const err = undo.parentElement.querySelector('[data-err]');
      if (err) err.textContent = er.message;
      $('#announce').textContent = er.message;
    }
    return;
  }
  const p = curPb();
  const act = e.target.closest('[data-pact]')?.dataset.pact;
  if (act === 'back') { ppane = 'list'; $('#psplit').dataset.pane = 'list'; return document.querySelector('#plist .trow[aria-current]')?.focus(); }
  if (act === 'rebuild') { rebuildAsk = true; return renderPList(); }
  if (act === 'build-no') { rebuildAsk = false; return renderPList(); }
  if (act === 'build') {
    rebuildAsk = false;
    try { pb.coach = await api('/api/playbooks/build', { method: 'POST' }); $('#announce').textContent = 'Building playbooks. This takes a few minutes.'; }
    catch (er) { $('#announce').textContent = `Could not start: ${er.message}`; }
    renderPList(); renderPEditor(); clearTimeout(pbTimer); pbTimer = setTimeout(loadPlaybooks, 3000);
    return;
  }
  if (act === 'more-changes') { changesShown += 20; return renderPEditor(); }
  if (act === 'learn') {
    try { pb.coach = await api('/api/playbooks/learn', { method: 'POST' }); announce(`Learning from ${pb.coach.lessons} decisions`); }
    catch (er) { announce(`Could not start: ${er.message}`); }
    renderPList(); clearTimeout(pbTimer); pbTimer = setTimeout(loadPlaybooks, 3000);
    return;
  }
  if (!p) return;
  const sit = e.target.closest('[data-situation]'), st = e.target.closest('[data-stage]');
  if (sit) { p.situation = sit.dataset.situation; renderPEditor(); savePlaybook(p, true); return document.querySelector(`[data-situation="${p.situation}"]`)?.focus(); }
  if (st) {
    const s = st.dataset.stage;
    p.stages = p.stages.includes(s) ? p.stages.filter((x) => x !== s) : PB_STAGES.filter((x) => x === s || p.stages.includes(x));
    renderPEditor(); renderPList(); savePlaybook(p, true);
    return document.querySelector(`#peditor [data-stage="${CSS.escape(s)}"]`)?.focus();
  }
  const det = e.target.closest('[data-detach]');
  if (det) {
    const part = partOf(p, det.dataset.where);
    part.templateIds = part.templateIds.filter((x) => x !== det.dataset.detach);
    renderPEditor(); savePlaybook(p, true);
    return document.querySelector(`#peditor [data-attach="${det.dataset.where}"]`)?.focus();
  }
  const i = Number(e.target.closest('[data-i]')?.dataset.i), r = Number(e.target.closest('[data-r]')?.dataset.r), l = Number(e.target.closest('[data-l]')?.dataset.l);
  const refocus = (sel) => document.querySelector(`#peditor ${sel}`)?.focus();
  if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= p.steps.length) return;
    [p.steps[i], p.steps[j]] = [p.steps[j], p.steps[i]];
    renderPEditor(); savePlaybook(p, true);
    pstatus(`Step moved to ${j + 1}`);
    return refocus(`.step[data-i="${j}"] [data-pact="${act}"]`);
  }
  if (act === 'del-step') { p.steps.splice(i, 1); renderPEditor(); savePlaybook(p, true); pstatus('Step removed (undo in What the AI learned)'); return refocus('[data-pact=add-step]'); }
  if (act === 'add-step') {
    p.steps.push({ id: `step-${Date.now().toString(36)}`, channel: 'whatsapp', waitDays: 2, ask: '', why: '', templateIds: [] });
    renderPEditor(); savePlaybook(p, true); return refocus(`.step[data-i="${p.steps.length - 1}"] [data-f=ask]`);
  }
  if (act === 'del-resp') { p.responses.splice(r, 1); renderPEditor(); savePlaybook(p, true); return refocus('[data-pact=add-resp]'); }
  if (act === 'add-resp') {
    p.responses.push({ id: `reply-${Date.now().toString(36)}`, when: '', approach: '', templateIds: [] });
    renderPEditor(); savePlaybook(p, true); return refocus(`[data-r="${p.responses.length - 1}"] [data-f=when]`);
  }
  if (act === 'del-lesson') { p.lessons.splice(l, 1); renderPEditor(); savePlaybook(p, true); return refocus('[data-pact=add-lesson]'); }
  if (act === 'add-lesson') { p.lessons.push(''); renderPEditor(); return refocus(`[data-l="${p.lessons.length - 1}"] textarea`); }
  if (act === 'del') return ($('#pdel').innerHTML = renderPDelete(true), $('[data-pact=del-no]').focus());
  if (act === 'del-no') return ($('#pdel').innerHTML = renderPDelete(false), $('[data-pact=del]').focus());
  if (act === 'del-yes') {
    try {
      await api(`/api/playbooks/${encodeURIComponent(p.id)}`, { method: 'DELETE' });
      $('#announce').textContent = `Deleted ${p.name}. Undo it in What the AI learned.`;
      psel = LEARNED; await loadPlaybooks();
    } catch (er) { pstatus(`Not deleted: ${er.message}`, true); }
  }
});

$('#view-playbooks').addEventListener('input', (e) => {
  const p = curPb(), f = e.target.dataset.f;
  if (!p || !f) return;
  const v = e.target.value;
  const step = e.target.closest('[data-i]'), resp = e.target.closest('[data-r]'), les = e.target.closest('[data-l]');
  if (step) p.steps[step.dataset.i][f] = f === 'waitDays' ? Math.max(0, Math.round(Number(v) || 0)) : v;
  else if (resp) p.responses[resp.dataset.r][f] = v;
  else if (les) p.lessons[les.dataset.l] = v;
  else p[f] = v;
  if (f === 'name') document.querySelector(`#plist .trow[data-pid="${CSS.escape(p.id)}"] .tn`)?.firstChild?.replaceWith(v);
  savePlaybook(p);
});

$('#view-playbooks').addEventListener('change', (e) => {
  const p = curPb(), where = e.target.dataset.attach;
  if (!p || !where || !e.target.value) return;
  partOf(p, where).templateIds.push(e.target.value);
  renderPEditor(); savePlaybook(p, true);
  document.querySelector(`#peditor [data-attach="${where}"]`)?.focus();
});

// Empty lessons go when you leave them; arrows move through the list.
$('#view-playbooks').addEventListener('focusout', (e) => {
  const p = curPb();
  if (p && e.target.dataset.f === 'lesson' && !e.target.value.trim()) {
    p.lessons = p.lessons.filter((x) => x.trim());
    setTimeout(() => { renderPEditor(); savePlaybook(p, true); });
  }
});
$('#plist').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const rows = [...document.querySelectorAll('#plist .trow')], i = rows.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))].focus();
});
$('#peditor').addEventListener('keydown', (e) => {
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const btn = e.target.closest('.step')?.querySelector(`[data-pact="${e.key === 'ArrowUp' ? 'up' : 'down'}"]`);
    if (btn && btn.getAttribute('aria-disabled') !== 'true') { e.preventDefault(); btn.click(); }
  }
  if (e.key === 'Escape' && ppane === 'editor') { ppane = 'list'; $('#psplit').dataset.pane = 'list'; document.querySelector('#plist .trow[aria-current]')?.focus(); }
});

// First load: the last snapshot (the server refreshes on start), then live updates.
(async () => {
  const saved = (() => { try { return localStorage.getItem('section'); } catch { return null; } })();
  showSection([location.hash.slice(1), saved].find((x) => SECTIONS.includes(x)) || 'messages');
  connectEvents();
  try { sources = await api('/api/status'); } catch {}
  loadRequests(); loadPlaybooks(); loadPersonal(); loadChats();
  await checkSync();
  if (!sync.at && !sync.running) startRefresh();
  await loadPeople();
})();
</script>
</body>
